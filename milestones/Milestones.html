<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16746f">
<title>Milestones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{color-scheme:light;
  --bg:#16746f;--panel:#fff8ea;--panel2:#f6ead2;--line:rgba(60,46,30,.16);
  --ink:#30291f;--dim:#7a6c59;--teal:#16746f;--teal2:#1f9a92;--gold:#f2b632;--gold2:#ffd566;--coral:#e4573f;--good:#2f9e5b;--bad:#cf3f2c;--plum:#8a4fbf;--pink:#e2699a;
  --display:"Fredoka","Trebuchet MS",ui-rounded,sans-serif;--body:"Nunito",ui-sans-serif,system-ui,-apple-system,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%}
#app.logOpen{grid-template-columns:minmax(0,1fr) 300px 300px}
#main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:#8cc66a;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;display:block}
#topbar{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;z-index:5}
#topbar button{background:rgba(255,248,234,.94);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
#net{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:88%;display:none;background:#30291f;color:#fff8ea;border-radius:8px;padding:6px 12px;font-size:13px;z-index:6;text-align:center}
#net.on{display:block}#net.bad{background:var(--bad)}
/* what just happened */
#card{position:absolute;left:50%;top:14px;transform:translate(-50%,-12px);width:min(380px,calc(100% - 28px));box-sizing:border-box;background:var(--panel);border-radius:12px;border-top:7px solid var(--c,var(--teal));box-shadow:0 8px 22px rgba(30,20,10,.38);padding:9px 14px 11px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:4}
#card.on{opacity:1;transform:translate(-50%,0)}
#card h4{margin:0;font:600 18px/1.2 var(--display)}
#card p{margin:2px 0 0;font-size:14px}
#card .amt{font:700 19px/1.1 var(--display);margin-top:3px}
#card .amt.up{color:var(--good)}#card .amt.down{color:var(--bad)}
/* the tray: your choices, or who we're waiting for */
#tray{background:var(--panel);border-top:3px solid var(--gold);padding:10px 14px calc(10px + env(safe-area-inset-bottom));min-height:96px;max-height:46vh;overflow:auto;box-sizing:border-box;flex:none}
#prompt h4{margin:0 0 2px;font:600 18px/1.2 var(--display)}
#prompt p{margin:0 0 7px;font-size:14px;color:var(--dim)}
.waitLine{display:flex;align-items:center;gap:9px;font:600 17px/1.2 var(--display);min-height:64px}
.waitLine .sw{width:15px;height:15px;border-radius:50%;flex:none}
#clock,.clock{font:700 14px var(--display);color:var(--dim);margin-left:8px}
.low{color:var(--bad)!important}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 170px;min-width:0;max-width:340px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 11px;box-shadow:0 2px 0 var(--line);transition:transform .08s,border-color .08s}
.opt:hover:not(:disabled){border-color:var(--teal2);transform:translateY(-1px)}
.opt b{display:block;font:600 16px/1.2 var(--display)}
.opt span{display:block;font-size:13px;color:var(--dim);line-height:1.25}
.opt .tag{float:right;margin-left:8px;font:700 15px var(--display);color:var(--teal)}
.opt.pri{background:var(--gold);border-color:#c98d10}
.opt.pri span{color:#5e4a1c}
.spinBtn{flex:0 1 240px;text-align:center;font:700 24px/1 var(--display);background:var(--coral);color:#fff;border:none;border-radius:12px;padding:15px 24px;box-shadow:0 4px 0 #a93a27}
.spinBtn:hover{filter:brightness(1.06)}
.spinBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #a93a27}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));max-width:560px}
.opts.grid .opt{text-align:center;padding:10px 0;max-width:none}
.opts.grid .opt b{font-size:19px}
/* the right-hand rail */
#rail{background:var(--panel2);display:flex;flex-direction:column;min-height:0;border-left:1px solid rgba(0,0,0,.2)}
#wheelBox{flex:none;display:flex;flex-direction:column;align-items:center;padding:8px 8px 2px;background:var(--teal)}
#wheel{width:190px;height:190px;display:block;cursor:default}
#wheel.can{cursor:pointer}
#rotor{transform-origin:100px 100px}
#wheelTxt{color:#fff8ea;font:600 13px/1.2 var(--display);min-height:20px;text-align:center}
#players{flex:1;min-height:0;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.pl{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:9px;padding:6px 9px;box-sizing:border-box}
.pl.cur{box-shadow:0 0 0 2px var(--gold)}
.pl.ret{opacity:.8}
.pl .top{display:flex;align-items:baseline;gap:6px}
.pl .nm{font:600 15px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pl .cash{font:700 15px var(--display);font-variant-numeric:tabular-nums;color:var(--teal)}
.pl .cash.neg{color:var(--bad)}
.pl .job{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .bits{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.bit{font:800 11px/1 var(--body);padding:3px 5px;border-radius:5px;background:var(--panel2);color:#5b4f3e;white-space:nowrap}
.bit.star{background:#ece0fa;color:#5f3391}.bit.debt{background:#fbdcd4;color:#a5311e}.bit.luck{background:#fdeeb9;color:#7a5a07}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:5px}
.dot.off{background:var(--bad)}
.badge{font:800 10px var(--body);background:var(--teal);color:#fff;border-radius:4px;padding:1px 4px;vertical-align:1px}
/* log */
#side{display:none;background:var(--panel);border-left:1px solid rgba(0,0,0,.2);min-height:0;flex-direction:column}
#app.logOpen #side{display:flex}
.brand{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)}
.brand h2{margin:0;font:600 18px var(--display)}
.brand button{background:none;border:none;font-size:22px;line-height:1}
#log{flex:1;overflow:auto;padding:6px 12px;font-size:13.5px}
#log p{margin:4px 0}
/* dialogs */
.modalBg{position:fixed;inset:0;background:rgba(10,40,38,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modalBg.on{display:flex}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px 22px;width:min(560px,100%);max-height:100%;overflow:auto;box-sizing:border-box;border-top:8px solid var(--gold)}
.modal h3{margin:0 0 6px;font:700 25px/1.15 var(--display);color:var(--teal)}
.modal p{margin:6px 0}
.note{color:var(--dim);font-size:13px}
.btn{background:#fff;border:2px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:800}
.btn:hover:not(:disabled){border-color:var(--teal2)}
.btn.pri{background:var(--gold);border-color:#c98d10}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.menu{display:grid;gap:8px;margin-top:10px}
.big{display:block;text-align:left;background:#fff;border:2px solid var(--line);border-radius:11px;padding:11px 14px;box-shadow:0 2px 0 var(--line)}
.big:hover{border-color:var(--teal2)}
.big b{display:block;font:600 18px/1.2 var(--display)}
.big span{color:var(--dim);font-size:13.5px}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:9px 11px;margin-top:8px}
.resume>div{flex:1 1 200px}
.setupGrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;margin-top:10px}
.setupGrid label{font-weight:800;font-size:14px}
input[type=text],select,textarea{font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px 9px;box-sizing:border-box;width:100%}
.lbl{font-weight:800;font-size:14px;margin:10px 0 4px}
.share{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:9px;padding:7px 9px}
.share code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.code{font:700 26px var(--display);letter-spacing:.2em;color:var(--teal)}
.seat{display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:9px;padding:4px 0}
.sw{width:16px;height:16px;border-radius:50%}
.stand{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 8px;align-items:baseline;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:9px;padding:7px 10px;margin-top:6px}
.stand>b{font:700 20px var(--display)}
.stand .tot{font:700 18px var(--display);color:var(--teal)}
.stand .why{grid-column:2/4;font-size:12.5px;color:var(--dim)}
.stand.first{background:#fff4cf}
.tileRow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:14px}
/* board bits */
.space{cursor:help}
.car{transition:transform .22s ease-in-out}
#board text{font-family:var(--display);user-select:none;-webkit-user-select:none}
@media (max-width:820px){
  #app,#app.logOpen{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #rail{flex-direction:row;border-left:none;border-top:1px solid rgba(0,0,0,.2);height:96px;grid-row:2}
  #wheelBox{padding:3px 4px;justify-content:center}
  #wheel{width:72px;height:72px}
  #wheelTxt{display:none}
  #players{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:5px;align-items:stretch}
  .pl{flex:0 0 150px;width:150px;padding:3px 7px;overflow:hidden}
  .pl .job{display:none}
  #tray{min-height:84px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .waitLine{min-height:48px;font-size:15px}
  .opt{flex-basis:140px;padding:7px 9px}
  .spinBtn{flex:1 1 100%;max-width:none;padding:12px}
  #app.logOpen #side{position:fixed;left:0;right:0;bottom:0;height:55%;z-index:6;border-left:none;border-top:3px solid var(--gold);box-shadow:0 -12px 40px rgba(0,0,0,.4);padding-bottom:env(safe-area-inset-bottom)}
  input[type=text],select,textarea{font-size:16px}   /* iOS zooms into any field under 16px */
  .modalBg{padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .modal{padding:16px 14px}
}
/* phones on their side: too short to stack, so the rail stays a column and the tray joins it */
@media (max-height:520px) and (orientation:landscape){
  #app,#app.logOpen{grid-template-columns:minmax(0,1fr) 230px;grid-template-rows:minmax(0,1fr)}
  #rail{flex-direction:column;height:auto;grid-row:auto;border-top:none;border-left:1px solid rgba(0,0,0,.2)}
  #wheelBox{flex-direction:row;justify-content:center}
  #wheel{width:64px;height:64px}
  #players{flex-direction:column;overflow-x:hidden;overflow-y:auto}
  .pl{flex:none;width:100%}
  #tray{max-height:42vh;min-height:0;padding:5px 9px}
  #prompt p{display:none}
  .waitLine{min-height:26px}
}
@media (prefers-reduced-motion:reduce){.car,#card,.opt{transition:none}}
</style>
</head>
<body>

<div id="app">
  <div id="main">
    <div id="stage">
      <svg id="board" viewBox="0 0 1600 1000" role="img" aria-label="The game board: one road from the start to retirement"></svg>
      <div id="topbar"><button id="zoomBtn" title="Follow the action or see the whole road (Z)">Whole road</button><button id="logBtn" aria-expanded="false" aria-controls="side" title="Show the log (L)">Log</button><button id="menuBtn">Menu</button></div>
      <div id="card" aria-live="polite"></div>
      <div id="net" role="status"></div>
    </div>
    <div id="tray" role="region" aria-label="Your choices"><div id="prompt"></div></div>
  </div>
  <aside id="rail" aria-label="Wheel and players">
    <div id="wheelBox"><svg id="wheel" viewBox="0 0 200 200" role="img" aria-label="The spinner, numbered 1 to 10"></svg><div id="wheelTxt"></div></div>
    <div id="players"></div>
  </aside>
  <aside id="side" aria-label="Game log">
    <div class="brand"><h2>Log</h2><button id="logClose" aria-label="Close the log" title="Close the log (L)">×</button></div>
    <div id="log" aria-live="polite"></div>
  </aside>
</div>
<div class="modalBg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
// =====================================================================  constants
const PCOL = ['#e4573f', '#2f7fd1', '#f2b632', '#2f9e5b', '#8a4fbf', '#ec7fb0'];
const BOT_NAMES = ['Marge', 'Dale', 'Rosie', 'Hank', 'Opal'];
const MAX_SEATS = 6;
const START_CASH = 10000;
const LOAN = 20000, LOAN_BACK = 25000;          // borrow this, pay back that
const COLLEGE_LOANS = 5;                        // college costs five loans
const LUCKY_PRICE = 50000, LUCKY_PAY = 10000;   // a lucky number pays out every time anyone's move lands on it
const CAR_INS = 10000, HOME_INS = 25000;
const CHILD_VALUE = 50000, BABY_GIFT = 5000;
const NIGHT_SCHOOL = 100000;
const SPIN_WIN_POT = 150000;
const HEIGHTS_WIN = 400000, HEIGHTS_LOSE = 150000;   // the richest on the Heights, and everybody else up there
const RETIRE_TILES = [3, 2, 1];                 // milestones for the first three home
const TIMER_OPTS = [0, 20, 30, 45, 60, 90, 120];   // seconds per decision; 0 is no limit
let OFFLINE_GRACE = 15;                         // seconds a disconnected player's first decision waits before the game picks for them
const AWAY_GRACE = 3;                           // and each one after that, so one missing friend doesn't stall the table
function cleanRules(r = {}) { return { timer: TIMER_OPTS.includes(+r.timer) ? +r.timer : 0 }; }
const fmt = n => { n = Math.round(+n || 0); return (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US'); };
const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
const short = n => (Math.abs(n) >= 1000 ? Math.round(Math.abs(n) / 1000) + 'K' : String(Math.abs(n)));

// id is what a board space pays ("Pay the Surgeon"); max is as high as a raise can take the salary
const DEGREE_JOBS = [
  { id: 'surgeon', name: 'Surgeon', sal: 65000, max: 85000 },
  { id: 'attorney', name: 'Attorney', sal: 60000, max: 80000 },
  { id: 'architect', name: 'Architect', sal: 55000, max: 75000 },
  { id: 'engineer', name: 'Engineer', sal: 55000, max: 70000 },
  { id: 'vet', name: 'Veterinarian', sal: 50000, max: 70000 },
  { id: 'pilot', name: 'Airline Pilot', sal: 50000, max: 75000 },
  { id: 'professor', name: 'Professor', sal: 40000, max: 60000 },
  { id: 'journalist', name: 'Journalist', sal: 40000, max: 70000 },
];
const PLAIN_JOBS = [
  { id: 'electrician', name: 'Electrician', sal: 40000, max: 55000 },
  { id: 'police', name: 'Police Officer', sal: 35000, max: 55000 },
  { id: 'mechanic', name: 'Mechanic', sal: 35000, max: 50000 },
  { id: 'trucker', name: 'Long-haul Trucker', sal: 35000, max: 50000 },
  { id: 'chef', name: 'Line Chef', sal: 30000, max: 60000 },
  { id: 'sales', name: 'Salesperson', sal: 30000, max: 70000 },
  { id: 'stylist', name: 'Hair Stylist', sal: 30000, max: 50000 },
  { id: 'musician', name: 'Touring Musician', sal: 20000, max: 85000 },
];
const HOUSES = [
  { id: 'cottage', name: 'Starter Cottage', price: 100000, low: 90000, high: 160000 },
  { id: 'bungalow', name: 'Lakeside Bungalow', price: 150000, low: 110000, high: 250000 },
  { id: 'farm', name: 'Old Farmhouse', price: 200000, low: 160000, high: 300000 },
  { id: 'ranch', name: 'Split-level Ranch', price: 250000, low: 200000, high: 360000 },
  { id: 'loft', name: 'Downtown Loft', price: 300000, low: 180000, high: 520000 },
  { id: 'colonial', name: 'Brick Colonial', price: 350000, low: 280000, high: 480000 },
  { id: 'beach', name: 'Beach House', price: 450000, low: 260000, high: 800000 },
  { id: 'mansion', name: 'Hilltop Mansion', price: 600000, low: 400000, high: 950000 },
];
const TILE_TEXT = ['Climbed a real mountain', 'Finished that novel', 'Learned the cello', 'Ran a marathon', 'Coached the kids\' team', 'Planted an orchard', 'Saw the northern lights', 'Sailed around the cape',
  'Built a boat in the garage', 'Started a scholarship', 'Won the county chili cook-off', 'Rescued a greyhound', 'Taught someone to read', 'Hiked the whole trail', 'Opened a neighborhood library', 'Recorded an album',
  'Made a quilt for every cousin', 'Fostered a litter of kittens', 'Learned a third language', 'Restored a \'57 pickup', 'Volunteered at the shelter', 'Grew the giant pumpkin', 'Mentored a new hire', 'Danced at every wedding',
  'Paid off a stranger\'s groceries', 'Took the long way home', 'Saved the town bandstand', 'Taught a grandparent to text', 'Bowled a perfect game', 'Found the family recipe', 'Swam across the lake', 'Painted the mural downtown',
  'Walked across Spain', 'Kept a promise for thirty years', 'Hosted every Thanksgiving', 'Wrote a letter every week', 'Built a treehouse', 'Learned to fly', 'Fixed up the old theater', 'Made a friend for life',
  'Saw a total eclipse', 'Crossed the country by train', 'Delivered a neighbor\'s baby', 'Won the pie contest', 'Started the block party', 'Taught swimming lessons', 'Finished the crossword in ink', 'Forgave an old grudge'];
const TILE_VALUES = [50, 50, 50, 100, 100, 100, 150, 150, 200, 250].map(k => k * 1000);

// =====================================================================  the board
// Each road is a smooth curve through hand-placed points, with its spaces spread evenly along it.
const pay = () => ({ t: 'payday', text: 'Payday! Collect your salary as you pass.' });
const gain = (amt, x) => ({ t: 'gain', amt, text: x });
const lose = (amt, x, more = {}) => ({ t: 'lose', amt, text: x, ...more });
const tile = x => ({ t: 'tile', text: x });
const baby = (n, x) => ({ t: 'baby', n, text: x });
const spinPay = (each, x) => ({ t: 'spinpay', each, text: x });
const sue = (amt, x) => ({ t: 'sue', amt, text: x });
const swap = x => ({ t: 'swap', text: x });
const raise = x => ({ t: 'raise', text: x });
const tax = x => ({ t: 'tax', text: x });
const shop = x => ({ t: 'shop', text: x });
const broker = x => ({ t: 'broker', text: x });
const spinWin = () => ({ t: 'spinwin', text: 'Spin to Win! Everyone picks a number; the spin pays ' + fmt(SPIN_WIN_POT) + '.' });
const party = (amt, x) => ({ t: 'party', amt, text: x });
const stop = (key, label, x) => ({ t: 'stop', key, label, text: x, stop: true });
const ROADS = [
  { id: 'college', from: 'start', to: 'main1', pts: [[90, 150], [150, 80], [300, 58], [470, 66], [600, 96], [700, 150]], spaces: [
    lose(5000, 'Buy your textbooks.'), gain(5000, 'Land a campus job at the library.'), tile('Make the dean\'s list.'), lose(10000, 'Your laptop dies the night before finals.'),
    spinPay(1000, 'Tutor the football team.'), gain(10000, 'Win a science fair scholarship.'), tile('Study abroad for a semester.'), lose(5000, 'Spring break road trip.'),
    stop('graduate', 'GRADUATION', 'Stop here. Choose your career.'),
  ] },
  { id: 'career', from: 'start', to: 'main1', pts: [[90, 150], [170, 226], [340, 252], [520, 238], [630, 196], [700, 150]], spaces: [
    gain(5000, 'Win the first-day raffle.'), pay(), lose(5000, 'Buy your work boots.'), tile('Land your first big client.'), gain(10000, 'Employee of the month.'), pay(), lose(5000, 'Your first apartment needs a couch.'),
  ] },
  { id: 'main1', pts: [[700, 150], [900, 130], [1100, 172], [1300, 130], [1480, 150], [1530, 232]], spaces: [
    pay(), lose(10000, 'Your first car needs a new clutch. Pay the Mechanic.', { to: 'mechanic' }), shop('An insurance agent knocks.'), gain(20000, 'Your side hustle takes off.'), tile('Run your first marathon.'),
    pay(), lose(30000, 'Fender bender at the drive-in.', { ins: 'car' }), broker('A stockbroker has a hot tip.'), spinWin(), lose(5000, 'Speeding ticket. Pay the Police Officer.', { to: 'police' }),
    pay(), tile('Adopt a rescue dog.'), gain(20000, 'A long-lost aunt leaves you her coin jar.'), lose(20000, 'Break your leg skiing. Pay the Surgeon.', { to: 'surgeon' }),
    stop('wedding', 'WEDDING', 'Stop here. Tie the knot, and everyone chips in.'),
  ] },
  { id: 'family', from: 'main1', to: 'main2', pick: 'Family Way', sub: 'Babies, milestones and steady pay.', pts: [[1530, 232], [1440, 322], [1250, 334], [1060, 322], [930, 400]], spaces: [
    baby(1, 'A baby!'), tile('Host the whole family for the holidays.'), pay(), lose(20000, 'Time for a minivan.'), baby(1, 'Another baby!'), gain(10000, 'Grandparents send a savings bond.'),

      return show(p, s.text, 'Half a paycheck, gone.', -amt, 'bad', gen);

    case 'shop': return landShop(p, s, gen);
    case 'broker': return landBroker(p, s, gen);
    case 'spinwin': return landSpinWin(p, gen);

async function landLose(p, s, gen) {

async function landShop(p, s, gen) {

// =====================================================================  asking a player
// Every decision in the game comes through here: a title, some options, and what happens if nobody answers.
async function choose(p, q, gen) {
  const valid = v => q.opts.some(o => o.v === v);
  if (p.bot) {
    const ms = instant() ? 0 : 700 * pace();
    if (ms && q.kind !== 'spin') { G.asking = { pid: p.id, wait: q.wait }; sync(); }
    await hold(ms * (0.6 + Math.random() * 0.8), gen);
    G.asking = null;
    const v = q.bot ? q.bot() : q.def;
    return valid(v) ? v : q.def;
  }
  G.asking = { pid: p.id, wait: q.wait }; G.deadline = G.timer ? Date.now() + G.timer * 1000 : 0;
  sync();
  const args = { title: q.title, text: q.text, opts: q.opts, grid: !!q.grid }, kind = q.kind || 'pick';
  const v = await new Promise(res => {
    let off = 0, settled = false;
    const iv = setInterval(() => {
      if (settled || !live(gen)) return clearInterval(iv);
      off = p.remote && !p.online ? off + 1 : 0;
      if ((off > 0 && off >= (p.away ? AWAY_GRACE : OFFLINE_GRACE)) || (G.deadline && Date.now() >= G.deadline)) { clearInterval(iv); if (p.remote) Host.cancel(p.id); else abortLocal(); }
    }, 1000);
    ask(p, kind, args).then(x => { settled = true; clearInterval(iv); res(x); });
  });
  if (!live(gen)) throw new Stale();
  G.deadline = 0; G.asking = null;
  if (v === undefined) {
    if (p.remote && !p.online) p.away = true;
    log(`${who(p)} ${p.remote && !p.online ? verb(p, 'is away', 'are away') : 'ran out of time'}, so the game picks for ${whom(p)}.`);
    return q.def;
  }
  return v;
}
function ask(p, kind, args) { return p.remote ? Host.ask(p.id, kind, args) : localAsk(kind, args); }

// =====================================================================  bots
const Bot = {
  sloppy: (p, chance = .35) => p.diff === 'easy' && Math.random() < chance,
  spinOrRepay: (p, opts) => opts.some(o => o.v === 'repay') && p.cash >= LOAN_BACK + 60000 ? 'repay' : 'spin',
  college: p => Bot.sloppy(p, .5) ? 'career' : Math.random() < .7 ? 'college' : 'career',
  job: (p, cards) => (Bot.sloppy(p) ? cards[0] : cards.reduce((a, b) => b.sal + b.max / 4 > a.sal + a.max / 4 ? b : a)).id,
  richest: (p, list) => list.reduce((a, b) => b.cash > a.cash ? b : a).id,
  swap: (p, list) => { const q = list.reduce((a, b) => b.salary > a.salary ? b : a); return q.salary > p.salary ? q.id : -1; },
  insure: (p, left) => {
    if (p.cash >= HOME_INS * 2 && left.some(o => o.v === 'home')) return 'home';
    return p.cash >= CAR_INS * 3 && left.some(o => o.v === 'car') ? 'car' : 'none';
  },
  lucky: p => p.cash >= LUCKY_PRICE && p.pos < SPACES.length * .6,
  road: (p, s) => {
    if (Bot.sloppy(p)) return s.fork[randInt(s.fork.length)].to;
    const rivals = Math.max(...others(p).map(worth));
    const risky = s.fork[1].to, calm = s.fork[0].to;
    return Math.random() < (worth(p) < rivals ? .6 : .3) ? risky : calm;   // behind? more likely to swing for it
  },
  house: (p, cards) => {
    const can = cards.filter(h => h.price <= p.cash + LOAN * 3);
    if (!can.length) return 'rent';
    return can.reduce((a, b) => houseAvg(b) - b.price > houseAvg(a) - a.price ? b : a).id;
  },
  nightSchool: p => p.salary <= 35000 && p.cash >= NIGHT_SCHOOL + 20000 && !Bot.sloppy(p) ? 'school' : 'stay',
  retire: p => {
    const up = G.players.filter(q => q.home === 'heights');
    return up.every(q => worth(p) > worth(q)) && (up.length || worth(p) >= Math.max(...others(p).map(worth))) ? 'heights' : 'cove';
  },
};

// =====================================================================  networking (PeerJS)
// The host's browser runs the game. Friends connect straight to it over WebRTC; PeerJS's free public
// server only introduces the browsers to each other. The host sends each player a copy of the game with
// the hidden things taken out, plus the question waiting for them; players send back their answers.
const PEER_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js',
  'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
];
const PeerClass = () => window.Peer || (window.peerjs && (window.peerjs.Peer || window.peerjs.default));
const PEER_OPTS = () => ({ debug: 1 });
let peerLoading = null;
function loadPeer() {
  if (PeerClass()) return Promise.resolve();
  if (peerLoading) return peerLoading;
  peerLoading = new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= PEER_URLS.length) { peerLoading = null; return rej(new Error('PeerJS failed to load')); }
      const s = document.createElement('script'); s.src = PEER_URLS[i++]; s.async = true;
      s.onload = () => PeerClass() ? res() : next();
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
  return peerLoading;
}
async function ensurePeer() {
  try { await loadPeer(); return true; }
  catch (e) { showMessage('Online play unavailable', 'Couldn\'t load the networking library. Check your internet connection and try again.'); return false; }
}
function setNet(text, tone) {
  if (HEADLESS) return;
  const el = $('net'); if (!el) return;
  el.textContent = text || ''; el.classList.toggle('on', !!text); el.classList.toggle('bad', tone === 'bad');
}
const shareLink = room => location.href.split(/[?#]/)[0] + '?join=' + room;

// PeerJS's JSON channel refuses any message of 16300 bytes or more: it drops it and raises an error on the link.
// Longer messages go as their JSON text cut into numbered pieces, which netUnpack puts back together on arrival.
const PART_CHARS = 5000;   // a character is at most 3 bytes once encoded, so a piece stays well under the limit
const PART_MAX = 400;      // pieces in one message (2 MB); anything longer is junk
function netPack(m) {
  const s = JSON.stringify(m);
  if (s.length <= PART_CHARS) return [m];
  const id = randId(8), parts = [];
  for (let i = 0; i < s.length;) {
    let j = Math.min(s.length, i + PART_CHARS);
    const c = s.charCodeAt(j - 1);
    if (j < s.length && c >= 0xd800 && c <= 0xdbff) j--;   // never split an emoji's surrogate pair
    parts.push(s.slice(i, j)); i = j;
  }
  return parts.map((d, i) => ({ t: 'part', id, i, n: parts.length, d }));
}
// one arrival on a link (`box` keeps the pieces so far); the whole message once it's complete, else null
function netUnpack(box, m) {
  if (!m || m.t !== 'part') return m;
  const { id, i, n, d } = m;
  if (typeof d !== 'string' || d.length > PART_CHARS || !Number.isInteger(n) || n < 2 || n > PART_MAX || !Number.isInteger(i) || i < 0 || i >= n) return null;
  if (i === 0) box._mlParts = { id, n, parts: [] };
  const b = box._mlParts;
  if (!b || b.id !== id || b.n !== n || b.parts.length !== i) { box._mlParts = null; return null; }   // a piece went missing
  b.parts.push(d);
  if (b.parts.length < n) return null;
  box._mlParts = null;
  try { return JSON.parse(b.parts.join('')); } catch (e) { return null; }
}

// what one player is allowed to see: the piles are just counts, and other people's milestones stay face down
function viewFor(id) {
  const g = { ...G, tiles: G.tiles.length, degreeJobs: G.degreeJobs.length, plainJobs: G.plainJobs.length, houses: G.houses.length, deadline: 0, left: G.deadline ? Math.max(0, G.deadline - Date.now()) : 0 };
  g.players = G.players.map(p => ({ ...p, cid: null, tiles: p.id === id || G.over ? p.tiles.slice() : p.tiles.map(() => null) }));
  g.logLines = G.logLines.slice(-80);
  return g;
}

const Host = {
  peer: null, room: null, fixed: false, attempts: 0, conns: new Map(), reqs: new Map(), seq: 0, inGame: false, timer: null,

  open(room, fixed) {
    this.room = room; this.fixed = fixed; setHosting(room);
    if (this.peer) { try { this.peer.destroy(); } catch (e) { } }
    setNet(`Opening room ${room}…`);
    const Peer = PeerClass(), peer = new Peer(PEER_PREFIX + room, PEER_OPTS());
    this.peer = peer;
