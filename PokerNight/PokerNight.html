<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a14">
<title>PokerNight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:dark;
  --bg:#0a1a14;--panel:#101b17;--panel2:#16251f;--line:rgba(226,236,230,.12);
  --felt:#16573e;--felt2:#0f4430;--felt3:#0a2f21;--rim:#3d2617;--rim2:#6b4526;
  --ink:#eef2ee;--dim:#97a9a0;--brass:#d9a441;--brass2:#f0c46a;--bad:#e2604f;--good:#7fc98a;--red:#c8372d;
  --display:"Alegreya SC",Georgia,"Times New Roman",serif;--body:"Alegreya Sans",ui-sans-serif,system-ui,-apple-system,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
#app.logOpen{grid-template-columns:minmax(0,1fr) 320px}
#main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 42%,#1c4b3a 0%,#11301f 55%,#0a1a14 100%)}
#stage{position:relative;flex:1;min-height:0;--sx:68px;--srx:43;--sry:38;--brx:27;--bry:22;--betin:0}
#table{position:absolute;inset:12% 10% 14% 10%;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,#21734f 0%,var(--felt) 42%,var(--felt2) 78%,var(--felt3) 100%);box-shadow:0 0 0 12px var(--rim),0 0 0 15px var(--rim2),0 22px 60px rgba(0,0,0,.65),inset 0 0 70px rgba(0,0,0,.45)}
#center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;text-align:center}
#board{display:flex;gap:6px;min-height:76px}
#pot{font:800 20px/1 var(--display);color:var(--brass2);letter-spacing:.04em;min-height:20px}
#pot small{display:block;font:500 12px var(--body);color:#cfe0d6;letter-spacing:.02em;margin-top:4px}
#tinfo{font-size:12px;color:#b8cec2;letter-spacing:.04em}
#logo{font:800 46px/1 var(--display);letter-spacing:.06em;color:rgba(240,196,106,.85);text-shadow:0 2px 0 rgba(0,0,0,.35)}
/* cards */
.cd{width:48px;height:68px;flex:none;box-sizing:border-box;border-radius:6px;background:#fbf8f1;color:#1d1b18;box-shadow:0 2px 6px rgba(0,0,0,.45);position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:3px 5px;font-weight:800;line-height:1}
.cd .r{font-size:19px;font-family:var(--body)}
.cd .s{font-size:24px;align-self:center;margin-bottom:6px}
.cd.red{color:var(--red)}
.cd.back{background:repeating-linear-gradient(45deg,#7a1f22 0 5px,#8f2a2c 5px 10px);border:3px solid #f5efe2}
.cd.slot{background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cd.win{box-shadow:0 0 0 3px var(--brass2),0 2px 10px rgba(0,0,0,.5)}
.cd.dim{filter:brightness(.6)}
/* your own best five, on your screen only */
.cd.best{box-shadow:0 0 0 3px var(--good),0 4px 12px rgba(0,0,0,.5);transform:translateY(-5px)}
.cd.sm.best{box-shadow:0 0 0 2px var(--good);transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.cd.best,.cd.sm.best{transform:none}}
.cd.fresh{animation:flip .45s cubic-bezier(.2,.8,.3,1.1) backwards}
@keyframes flip{from{transform:rotateY(90deg) translateY(-14px);opacity:.2}}
.cd.sm{width:30px;height:42px;padding:2px 3px;border-radius:4px}
.cd.sm .r{font-size:13px}.cd.sm .s{font-size:14px;margin-bottom:2px}
.cd.sm.back{border-width:2px}
.cd.lg{width:66px;height:94px;padding:5px 7px;border-radius:8px}
.cd.lg .r{font-size:25px}.cd.lg .s{font-size:34px;margin-bottom:8px}
/* seats */
.st{position:absolute;transform:translate(-50%,-50%);width:132px;display:flex;flex-direction:column;align-items:center;z-index:2}
.st .hole{display:flex;gap:3px;height:42px;margin-bottom:-10px;position:relative;z-index:0}
.st .plate{position:relative;z-index:1;width:100%;box-sizing:border-box;background:rgba(8,18,14,.92);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:5px 8px 5px 9px;text-align:left}
.st .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.st .stk{font:800 16px/1.15 var(--display);color:var(--brass2);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.st .stk .chip{width:12px;height:12px;flex:none}
.st .rb{font:700 10px var(--body);color:var(--brass2);background:rgba(217,164,65,.18);border-radius:4px;padding:0 4px;vertical-align:1px}
.st .tag{position:absolute;right:6px;top:5px;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--dim)}
.st.cur .plate{border-color:var(--brass2);box-shadow:0 0 0 2px rgba(240,196,106,.35),0 0 18px rgba(240,196,106,.35)}
.st.fold .hole,.st.out .hole{opacity:.25}
.st.fold .plate,.st.out .plate{opacity:.55}
.st.won .plate{border-color:var(--good);box-shadow:0 0 0 2px rgba(127,201,138,.4)}
/* win odds beside each hand, for knocked-out players watching from the rail */
.st .odds{align-self:center;position:relative;top:-6px;margin-left:3px;font:800 12px/1 var(--display);color:var(--ink);background:rgba(8,18,14,.9);border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.st .odds small{display:block;font:600 9px/1.2 var(--body);color:var(--dim);margin-top:1px}
.st .odds.lead{border-color:var(--brass2);color:var(--brass2)}
.st .odds.dead{color:var(--dim)}
.st .act{margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#cfe0d6;min-height:14px;white-space:nowrap}
.st .act.bad{color:#f3a196}
.st .act.good{color:var(--good)}
.st .act.ask{color:var(--brass2)}
.dbtn{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:#f5efe2;color:#1b1408;font:800 11px/20px var(--body);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:1;white-space:nowrap}
.chip{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--brass) 24% 60%,#fff 62% 70%,var(--brass) 72%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.chip.sb{background:radial-gradient(circle,#fff 0 22%,#4f9fd8 24% 60%,#fff 62% 70%,#4f9fd8 72%)}
.chip.bb{background:radial-gradient(circle,#fff 0 22%,#d8574a 24% 60%,#fff 62% 70%,#d8574a 72%)}
#status{position:absolute;left:12px;top:12px;background:rgba(8,18,14,.85);border:1px solid var(--line);color:var(--ink);padding:5px 14px;border-radius:999px;font-size:14px;display:none;white-space:nowrap;max-width:calc(100% - 24px);box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;z-index:3}
#status.on{display:block}
#status.mine{border-color:var(--brass);color:var(--brass2);font-weight:700}
#status .clock{color:var(--brass2);font-weight:800;margin-left:6px;font-variant-numeric:tabular-nums}
#status .clock.low{color:#f3a196}
.tbar{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--brass2);border-radius:2px;transition:width .25s linear}
.tbar i.low{background:var(--bad)}
.myClock{color:var(--brass2);font-weight:800;margin-right:8px;font-variant-numeric:tabular-nums}
.myClock:empty{display:none}
.myClock.low{color:#f3a196}
@media (prefers-reduced-motion:reduce){.tbar i{transition:none}}
#net{position:absolute;right:16px;bottom:16px;max-width:min(360px,calc(100% - 32px));background:rgba(8,18,14,.94);border:1px solid var(--brass);color:var(--brass2);border-radius:10px;padding:8px 12px;font-size:13px;display:none;z-index:4}
#net.on{display:block}
#net.bad{border-color:var(--bad);color:#f3a196}
/* tray: your cards and your buttons */
#tray{flex:none;min-height:132px;display:flex;align-items:center;gap:22px;padding:10px 20px 12px;box-sizing:border-box;background:linear-gradient(180deg,rgba(6,14,11,0) 0%,rgba(6,14,11,.8) 35%,#06100c 100%);border-top:1px solid var(--line)}
#mine{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:150px}
#mine .cards{display:flex;gap:6px}
#mine .hn{font-size:13px;color:var(--brass2);font-weight:700;min-height:18px;text-align:center}
#actions{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#actions .wait{color:var(--dim);font-size:14px}
#actions .row{margin-top:0}
.ab{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 16px;font-weight:800;font-size:15px;min-width:92px}
.ab:hover:not(:disabled){border-color:var(--brass)}
.ab.fold{border-color:rgba(226,96,79,.5)}
.ab.go{background:var(--brass);color:#1b1408;border-color:var(--brass)}
.ab:disabled{opacity:.4;cursor:default}
.pre{display:inline-flex;align-items:center;gap:8px;margin-left:8px;font-weight:700;font-size:14px;cursor:pointer;user-select:none;align-self:center}
.pre input{width:18px;height:18px;margin:0;accent-color:var(--good);cursor:inherit}
.pre:has(input:checked){color:var(--good)}
.pre:has(input:disabled){opacity:.4;cursor:default}
.raise input:disabled{opacity:.4}
.ab small{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;opacity:.7;text-transform:uppercase}
.raise{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.raise input[type=range]{flex:1;min-width:120px;accent-color:var(--brass)}
.raise input[type=number]{width:96px}
.qb{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--dim)}
.qb:hover:not(:disabled){border-color:var(--brass);color:var(--ink)}
.qb:disabled{opacity:.4;cursor:default}
.outBox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--brass);border-radius:10px;padding:10px 12px;background:rgba(217,164,65,.08)}
.outBox b{color:var(--brass2)}
.outBox .btn{flex:none}
.ack{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.4}
.ack input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--brass)}
.ack:has(input:checked){border-color:var(--brass)}
/* side panel */
#side{background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
#app.logOpen #side{display:flex}
.brand{padding:12px 14px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand h2{margin:0;font:800 20px/1 var(--display);letter-spacing:.04em;color:var(--brass2)}
.brand button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;color:var(--dim);font-size:16px;line-height:1.3}
#topbar{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:4}
#topbar button{background:rgba(8,18,14,.85);border:1px solid var(--line);border-radius:999px;padding:5px 14px;color:var(--ink);font-size:14px;font-weight:700}
#topbar button:hover,#topbar button[aria-expanded="true"]{border-color:var(--brass);color:var(--brass2)}
/* the host's buy-back requests sit on the table, where they can't be missed */
#reqs{position:absolute;left:12px;bottom:12px;width:min(320px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;z-index:4}
.req{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--brass);background:rgba(217,164,65,.09);border-radius:8px;padding:8px 10px;margin-bottom:6px}
#reqs .req{margin:0;background:rgba(8,18,14,.95);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.req div{flex:1;min-width:120px;font-size:13px}
.req .btn{padding:5px 10px;font-size:13px}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 5px;background:rgba(217,164,65,.18);color:var(--brass2)}
.badge.you{background:rgba(127,201,138,.16);color:var(--good)}
#log{flex:1;min-height:80px;overflow:auto;padding:8px 14px 12px;font-size:13px;color:#c7d3cd}
#log p{margin:0 0 4px}
#log .hand{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#log .cdt{font-weight:800;white-space:nowrap}
#log .cdt.red{color:#ef7a6e}
/* dialogs */
.modalBg{position:fixed;inset:0;background:rgba(3,10,7,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modalBg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--brass);border-radius:12px;padding:20px 22px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);box-sizing:border-box}
.modal h3{margin:0 0 4px;font:800 24px var(--display);color:var(--brass2)}
.modal p{margin:6px 0 12px;color:#c7d3cd}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn.pri{background:var(--brass);color:#1b1408;border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:default}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.setupGrid{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin-top:10px}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
input[type=text],input[type=number],textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;width:100%;box-sizing:border-box}
textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.menu{display:grid;gap:8px;margin-top:14px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.big:hover{border-color:var(--brass)}
.big b{font:700 19px/1.1 var(--display);color:var(--brass2)}
.big span{font-size:13px;color:var(--dim)}
.share{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px}
.share code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--brass2)}
.share .btn{padding:6px 12px;flex:none}
.code{font:800 32px/1 var(--display);letter-spacing:.18em;color:var(--brass2)}
.seat{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:7px 10px;margin-bottom:6px;min-height:34px}
.seat .sw{width:10px;height:26px;border-radius:3px}
.seat .btn{padding:4px 10px;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--good);vertical-align:1px}
.dot.off{background:var(--bad)}
.note{font-size:13px;color:var(--dim);line-height:1.45}
.note a{color:var(--brass2)}
.resume{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--brass);border-radius:10px;padding:10px 12px;margin-top:12px;background:rgba(217,164,65,.07)}
.resume > div{flex:1;min-width:160px}
.resume .btn{padding:7px 12px}
.stand{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 10px;background:var(--panel2);border-radius:8px;margin-bottom:5px}
.stand b{font:800 16px var(--display);color:var(--brass2)}
@media (hover:none){.keys{display:none}}
/* phones: everything fits one screen with no page scroll, so the betting buttons are always in reach */
@media (max-width:820px),(max-height:520px){
  html,body{height:100%;height:100dvh}
  #app,#app.logOpen{grid-template-columns:minmax(0,1fr);height:100%}
  #main{padding-top:env(safe-area-inset-top)}
  #stage{--sx:46px;--srx:44;--sry:38;--betin:1}
  #table{inset:9% 5% 9% 5%;box-shadow:0 0 0 8px var(--rim),0 0 0 10px var(--rim2),0 14px 40px rgba(0,0,0,.6),inset 0 0 50px rgba(0,0,0,.45)}
  #topbar{top:8px;right:8px}
  #topbar button{padding:4px 11px;font-size:13px}
  #status{left:8px;top:8px;padding:4px 11px;font-size:13px;max-width:calc(100% - 150px)}
  #status.on{display:none}   /* would cover the top seat; the tray and the glowing seat say whose turn it is */
  #logo{font-size:32px}
  #center{gap:5px}
  #board{min-height:45px;gap:3px}
  #pot{font-size:17px;min-height:17px}
  #tinfo{font-size:11px}
  .cd{width:31px;height:45px;padding:2px 3px;border-radius:4px}.cd .r{font-size:14px}.cd .s{font-size:16px;margin-bottom:2px}
  .cd.sm{width:22px;height:31px;padding:1px 2px;border-radius:3px}.cd.sm .r{font-size:10px}.cd.sm .s{font-size:11px;margin-bottom:1px}
  .cd.lg{width:46px;height:66px;padding:3px 5px;border-radius:6px}.cd.lg .r{font-size:19px}.cd.lg .s{font-size:24px;margin-bottom:5px}
  .st{width:82px}
  .st .hole{height:31px;margin-bottom:-8px}
  .st.me .hole{display:none}   /* your own cards are big in the tray */
  .st .plate{padding:3px 5px 3px 6px;border-left-width:3px;border-radius:6px}
  .st .nm{font-size:12px;padding-right:12px}
  .st .stk{font-size:13px;gap:4px}.st .stk .chip{width:10px;height:10px}
  .st .tag{font-size:8px;right:4px;top:4px}
  .st .act{font-size:10px;min-height:12px;margin-top:1px}
  .st .odds{font-size:10px;padding:2px 5px;margin-left:2px;top:-5px}
  .dbtn{width:17px;height:17px;font-size:10px;line-height:17px;right:-4px;top:-7px}
  .inbet{display:inline-flex;align-items:center;gap:3px;margin-right:5px;font-size:12px;color:#fff;letter-spacing:0;vertical-align:-1px}
  .bet{font-size:12px;gap:3px}
  .chip{width:13px;height:13px}
  /* tray: your cards beside the three big buttons, raise sizing full width underneath */
  #tray{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px 12px;min-height:0;padding:8px 12px max(10px,env(safe-area-inset-bottom))}
  #mine{min-width:0;gap:3px}
  #mine .hn{font-size:12px;min-height:16px;max-width:100px;line-height:1.2}
  #actions{display:contents}
  #actions > *{grid-column:1/-1}
  #actions > .row,#actions > .wait{grid-column:2;align-self:center}
  #actions .row{gap:6px}
  .ab{flex:1 1 0;min-width:0;min-height:48px;padding:6px 4px;font-size:15px}
  .pre{flex-basis:100%;margin-left:2px;font-size:13px}
  .raise{gap:6px}
  .raise input[type=range]{flex:1 1 55%;min-width:0;height:28px}
  .raise input[type=number]{flex:0 0 76px;padding:6px 8px}
  .qb{flex:1 1 20%;padding:7px 4px;font-size:13px}
  #actions .note{font-size:12px}
  .outBox{padding:8px 10px;gap:8px}
  /* the log slides up over the table instead of taking a column */
  #app.logOpen #side{position:fixed;left:0;right:0;bottom:0;height:55%;z-index:6;border-left:none;border-top:1px solid var(--brass);box-shadow:0 -12px 40px rgba(0,0,0,.6);padding-bottom:env(safe-area-inset-bottom)}
  #log{max-height:none}
  /* iOS zooms into any field under 16px */
  input[type=text],input[type=number],select,textarea{font-size:16px}
  .modalBg{padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .modal{padding:16px 14px}

    log(p.allIn ? `${say(p, 'calls', 'call')} ${fmt(amt)} and ${verb(p, 'is', 'are')} all in.` : `${say(p, 'calls', 'call')} ${fmt(amt)}.`);
  } else {
    const before = G.curBet;
    put(p, m.to);

    }

    log(p.allIn ? `${say(p, 'is', 'are')} all in for ${fmt(p.bet)}.` : before === 0 ? `${say(p, 'bets', 'bet')} ${fmt(p.bet)}.` : `${say(p, 'raises', 'raise')} to ${fmt(p.bet)}.`);

}

}
function dealStreet() {

  for (let i = 0; i < n; i++) G.board.push(G.deck.pop());
  G.phase = G.board.length === 3 ? 'flop' : G.board.length === 4 ? 'turn' : 'river';
  log(`${G.phase[0].toUpperCase() + G.phase.slice(1)}: ${cardsLog(G.board)}`);

}
// main pot and side pots, from what everyone put in this hand
function buildPots() {

  const levels = [...new Set(G.players.filter(p => inHand(p) && p.totalBet > 0).map(p => p.totalBet))].sort((a, b) => a - b);
  const pots = []; let prev = 0;
  for (const L of levels) {

    for (const p of ps) amount += Math.max(0, Math.min(p.totalBet, L) - prev);
    const eligible = G.players.filter(p => inHand(p) && p.totalBet >= L).map(p => p.id);
    const last = pots[pots.length - 1];
    if (last && last.eligible.join() === eligible.join()) last.amount += amount;
    else if (amount) pots.push({ amount, eligible });
    prev = L;

// order of seats starting left of the button (who gets odd chips first)
const leftOfButton = p => (p.id - G.button - 1 + G.players.length * 2) % G.players.length;
function finishHand() {

    for (const p of live.slice().sort((a, b) => leftOfButton(a) - leftOfButton(b))) log(`${say(p, 'shows', 'show')} ${cardsLog(p.hole)}: ${hands[p.id].name}.`);
  }
  let hi = null;
  pots.forEach((pot, i) => {
    let ws = pot.eligible.map(P);
    if (ws.length === 1 && showdown) { ws[0].stack += pot.amount; log(`${fmt(pot.amount)} uncalled goes back to ${whom(ws[0])}.`); return; }
    if (ws.length > 1) { const top = Math.max(...ws.map(p => hands[p.id].score)); ws = ws.filter(p => hands[p.id].score === top); }

    for (const w of ws) { const amt = share + (odd > 0 ? 1 : 0); if (odd > 0) odd--; w.stack += amt; won[w.id] = (won[w.id] || 0) + amt; }
    const what = pots.length > 1 ? (i === 0 ? 'the main pot' : `side pot ${i}`) : 'the pot';
    const how = showdown ? ` with ${hands[ws[0].id].name.toLowerCase()}` : '';

  }
}

// =====================================================================  buy-backs
function approveBuyback(id) {
  const p = P(id); if (!p || !p.out || p.bot) return false;
  G.buybackReqs = G.buybackReqs.filter(x => x !== id);
  p.out = false; p.stack = G.startStack; p.buybacks++; p.last = ''; p.watch = null;
  const sb = Math.max(G.startSb, Math.floor(G.sb / 2)), bb = Math.max(G.startBb, Math.floor(G.bb / 2)), dropped = sb !== G.sb;
  G.sb = sb; G.bb = bb;
  log(`${say(p, 'buys', 'buy')} back in for ${fmt(G.startStack)}.${dropped ? ` Blinds drop to ${fmt(sb)}/${fmt(bb)}.` : ''}`);
  if (G.over) {   // the game had ended; it picks up again with the newcomer
    G.over = false; G.winner = null; G.phase = 'between'; G.gen = ++GEN;
    log('The game carries on.');
    sync(); runGame();
  } else { wake(); sync(); }
  return true;
}
function declineBuyback(id) {
  const p = P(id); if (!G.buybackReqs.includes(id)) return false;
  G.buybackReqs = G.buybackReqs.filter(x => x !== id);
  log(`The host turned down ${whose(p)} buy-back.`);
  wake(); sync();
  return true;
}
function wake() { const f = tableWake; tableWake = null; if (f) f(); }

// actions anyone can take outside their turn; pid is the player asking
async function doAction(pid, a, d = {}) {
  const p = G && G.players[pid]; if (!p) return { err: 'no game' };
  if (p.bot) return { err: 'bot' };
  const isHost = !p.remote;   // the person at the host's screen, or the solo player, decides buy-backs
  switch (a) {
    case 'buyback':
      if (!p.out) return { err: 'not out' };
      if (G.buybackReqs.includes(pid)) return { err: 'already asked' };
      if (isHost) { approveBuyback(pid); return { ok: true, approved: true }; }
      G.buybackReqs.push(pid); log(`${say(p, 'asks', 'ask')} to buy back in.`); sync();
      return { ok: true };
    case 'cancelBuyback':
      if (!G.buybackReqs.includes(pid)) return { err: 'no request' };
      G.buybackReqs = G.buybackReqs.filter(x => x !== pid); log(`${who(p)} withdrew ${verb(p, 'their', 'your')} buy-back request.`); wake(); sync();
      return { ok: true };
    case 'watch': {   // observer mode on ({on:true}, having agreed to keep the cards to themselves) or off
      if (!G.rail) return { err: 'observer mode is off at this table' };
      if (!p.out) return { err: 'not out' };
      const on = d.on === true, was = p.watch === true;
      p.watch = on;
      if (on && !was) log(`${say(p, 'is', 'are')} watching in observer mode, with every hand face up.`);
      if (!on && was) log(`${who(p)} left observer mode.`);
      sync();
      return { ok: true };
    }
    case 'approve': case 'decline': {
      if (!isHost) return { err: 'only the host can decide' };
      const id = +d.id;
      if (!Number.isInteger(id) || !G.buybackReqs.includes(id)) return { err: 'no request' };
      if (a === 'approve') approveBuyback(id); else declineBuyback(id);
      return { ok: true };
    }
  }
  return { err: 'unknown action' };
}
function act(a, d = {}) { return NET.role === 'client' ? Client.act(a, d) : doAction(ME, a, d); }

// =====================================================================  game loop (host or solo)
const instant = () => HEADLESS || CFG.speed === 'instant';
const pause = ms => new Promise(r => setTimeout(r, ms));
const dealMs = () => instant() ? 0 : 650;
const betweenMs = () => instant() ? 0 : G.results && G.results.showdown ? 4800 : 2400;
function sync() { render(); Host.broadcastSoon(); Host.save(); }

function startGame(seats, speed, rules) {
  stopCurrentGame();
  newGame(seats, speed, rules);
  log(`Everyone starts with ${fmt(G.startStack)}. Blinds start at ${fmt(G.sb)}/${fmt(G.bb)} and double with every knockout.`);
  if (!HEADLESS) closeModal();
  sync();
  return runGame();
}
async function runGame() {
  const gen = G.gen;
  while (G && G.gen === gen && !G.over) {
    if (livePlayers().length < 2) {
      if (G.buybackReqs.length) {   // don't crown a winner while someone is asking to come back
        G.wait = 'buyback'; G.phase = 'between'; sync();
        await new Promise(r => tableWake = r);
        if (!G || G.gen !== gen) return;
        G.wait = null;
        continue;
      }
      return endGame();
    }
    await playHand(gen);
    if (!G || G.gen !== gen) return;
    G.phase = 'between'; sync();
    await pause(betweenMs());
  }
}
async function playHand(gen) {
  if (!startHand()) return;
  sync(); if (dealMs()) await pause(dealMs());
  while (G.gen === gen) {
    if (!(await bettingRound(gen))) return;
    if (contenders().length <= 1 || G.board.length === 5) break;
    endStreet(); dealStreet(); sync();
    if (dealMs()) await pause(dealMs());

}
async function bettingRound(gen) {
  while (G.gen === gen && !roundDone()) {

    const p = P(G.cur);
    sync();
    const m = await getMove(p, gen);
    if (!G || G.gen !== gen) return false;
    applyMove(p, m);
    G.cur = nextIdx(p.id, needsAct);

}

    }, 1000);

function endGame() {

// =====================================================================  bots
const Bot = {
  // share of the pot this hand wins against the others still in, by dealing out the rest at random
  equity(p, iters) {
    const opp = Math.max(1, contenders().filter(q => q !== p).length);
    const known = new Set([...p.hole, ...G.board]), rest = [];
    for (let c = 0; c < 52; c++) if (!known.has(c)) rest.push(c);
    const need = opp * 2 + (5 - G.board.length);
    let win = 0;
    for (let it = 0; it < iters; it++) {
      for (let i = 0; i < need; i++) { const j = i + Math.floor(Math.random() * (rest.length - i)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      const board = G.board.concat(rest.slice(opp * 2, need));
      const mine = bestHand(p.hole.concat(board)).score;
      let ties = 0, lost = false;
      for (let o = 0; o < opp && !lost; o++) { const s = bestHand([rest[2 * o], rest[2 * o + 1], ...board]).score; if (s > mine) lost = true; else if (s === mine) ties++; }
      if (!lost) win += 1 / (ties + 1);
    }
    return win / iters;
  },
  decide(p, L) {
    const d = p.diff, iters = d === 'easy' ? 50 : d === 'hard' ? 220 : 110;
    const opp = Math.max(1, contenders().length - 1), fair = 1 / (opp + 1);
    const e = this.equity(p, iters) + (d === 'easy' ? 0.14 : d === 'hard' ? 0.04 : 0.08) * (Math.random() * 2 - 1);
    const edge = e - fair, odds = L.toCall / (L.pot + L.toCall || 1);
    const unit = G.sb || 1;
    const raiseTo = frac => Math.max(L.minTo, Math.min(L.maxTo, Math.round((L.curBet + frac * (L.pot + L.toCall)) / unit) * unit));
    if (L.canRaise) {
      if (edge > 0.35 && (d === 'hard' || Math.random() < 0.7)) return e > 0.8 && Math.random() < 0.35 ? { a: 'allin' } : { a: 'raise', to: raiseTo(0.75) };
      if (edge > 0.18 && Math.random() < (d === 'easy' ? 0.3 : 0.55)) return { a: 'raise', to: raiseTo(0.5) };
      if (L.canCheck && Math.random() < (d === 'hard' ? 0.1 : d === 'normal' ? 0.05 : 0.02)) return { a: 'raise', to: raiseTo(0.5) };   // the odd bluff
    }
    if (L.canCheck) return { a: 'check' };
    const committing = L.toCall > p.stack * 0.5;
    const margin = d === 'easy' ? -0.06 : d === 'hard' ? 0.03 : 0;
    if (e >= odds + margin && (!committing || edge > (d === 'easy' ? 0 : 0.08))) return { a: 'call' };
    return { a: 'fold' };
  },
};

// =====================================================================  networking (PeerJS)
// The host's browser runs the game. Friends connect straight to it over WebRTC; PeerJS's free public
// server only introduces the browsers to each other. The host sends each player a copy of the game with
// everyone else's cards hidden, plus the question waiting for them; players send back answers and clicks.
const PEER_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js',
  'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',

const PeerClass = () => window.Peer || (window.peerjs && (window.peerjs.Peer || window.peerjs.default));
const PEER_OPTS = () => ({ debug: 1 });
let peerLoading = null;
function loadPeer() {
  if (PeerClass()) return Promise.resolve();
  if (peerLoading) return peerLoading;
  peerLoading = new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= PEER_URLS.length) { peerLoading = null; return rej(new Error('PeerJS failed to load')); }
      const s = document.createElement('script'); s.src = PEER_URLS[i++]; s.async = true;
      s.onload = () => PeerClass() ? res() : next();
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });

}
async function ensurePeer() {
  try { await loadPeer(); return true; }
  catch (e) { showMessage('Online play unavailable', 'Couldn\'t load the networking library. Check your internet connection and try again.'); return false; }
}
function setNet(text, tone) {
  if (HEADLESS) return;
  const el = $('net'); if (!el) return;
  el.textContent = text || ''; el.classList.toggle('on', !!text); el.classList.toggle('bad', tone === 'bad');
}
const shareLink = room => location.href.split(/[?#]/)[0] + '?join=' + room;

// PeerJS's JSON channel refuses any message of 16300 bytes or more: it drops it and raises an error on the link.
// A full table with a long log gets within reach of that, so longer messages go as their JSON text cut into
// numbered pieces, which netUnpack puts back together on arrival.
const PART_CHARS = 5000;   // a character is at most 3 bytes once encoded, so a piece stays well under the limit

function netPack(m) {
  const s = JSON.stringify(m);
  if (s.length <= PART_CHARS) return [m];
  const id = randId(8), parts = [];
  for (let i = 0; i < s.length;) {
    let j = Math.min(s.length, i + PART_CHARS);
    const c = s.charCodeAt(j - 1);
    if (j < s.length && c >= 0xd800 && c <= 0xdbff) j--;   // never split an emoji's surrogate pair
    parts.push(s.slice(i, j)); i = j;
  }

// one arrival on a link (`box` keeps the pieces so far); the whole message once it's complete, else null
function netUnpack(box, m) {
  if (!m || m.t !== 'part') return m;
  const { id, i, n, d } = m;
  if (typeof d !== 'string' || d.length > PART_CHARS || !Number.isInteger(n) || n < 2 || n > PART_MAX || !Number.isInteger(i) || i < 0 || i >= n) return null;
  if (i === 0) box._pnParts = { id, n, parts: [] };
  const b = box._pnParts;
  if (!b || b.id !== id || b.n !== n || b.parts.length !== i) { box._pnParts = null; return null; }   // a piece went missing
  b.parts.push(d);
  if (b.parts.length < n) return null;
  box._pnParts = null;

}

// what one player is allowed to see: their own cards, and anyone's that were shown down
// (or everyone's, for a knocked-out player when the host turned on the rail)
function viewFor(id) {
  const g = { ...G, deck: G.deck.length, deadline: 0, left: G.deadline ? Math.max(0, G.deadline - Date.now()) : 0 };
  const all = onRail(G, id);
  g.players = G.players.map(p => ({ ...p, cid: null, hole: all || p.id === id || G.shown[p.id] ? p.hole.slice() : p.hole.map(() => null) }));
  g.logLines = G.logLines.slice(-80);

let LOBBY = null;   // host only: { seats: [{kind:'host'|'player', name, cid}], stack, sb, timer }
function publicSeats() {
  return LOBBY.seats.map((s, i) => ({ kind: s.kind, color: PCOL[i], name: s.kind === 'host' ? (cleanName(s.name) || 'Host') : (s.name || ''), online: s.kind === 'player' ? !!Host.connFor(s.cid) : true }));
}

const Host = {
  peer: null, room: null, fixed: false, attempts: 0, conns: new Map(), reqs: new Map(), seq: 0, inGame: false, timer: null,

  open(room, fixed) {
    this.room = room; this.fixed = fixed; setHosting(room);
    if (this.peer) { try { this.peer.destroy(); } catch (e) { } }
    setNet(`Opening room ${room}…`);
    const Peer = PeerClass(), peer = new Peer(PEER_PREFIX + room, PEER_OPTS());
    this.peer = peer;
    peer.on('open', () => { if (this.peer !== peer) return; peer._pnOpened = true; this.attempts = 0; setNet(null); refreshLobby(); this.flush(); });
    peer.on('connection', conn => { if (this.peer === peer) this.attach(conn); });
    peer.on('disconnected', () => {
      if (this.peer !== peer || peer.destroyed) return;
      setNet('Lost touch with the matchmaking server. Players already connected can keep playing; reconnecting…');

    });

        setTimeout(() => { if (this.peer === peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) { } }, 5000);
      } else if (t === 'unavailable-id') {
        try { peer.destroy(); } catch (e) { }
        this.attempts++;
        if (!this.fixed && this.attempts < 4) return this.open(randCode(), false);   // a brand-new code happened to be taken
        if (this.attempts > 12) { this.attempts = 0; setNet('That room code is still taken, so this game moved to a new code. Send your friends the new link from the menu.', 'bad'); return this.open(randCode(), false); }
        setNet(`Reclaiming room ${room}… (try ${this.attempts})`);
        setTimeout(() => { if (this.peer === peer) this.open(room, this.fixed); }, 3000);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(t)) {
        setNet('Can\'t reach the matchmaking server. Retrying…', 'bad');
        setTimeout(() => {
          if (this.peer !== peer || peer.destroyed || peer.open) return;
          if (peer._pnOpened) { try { peer.reconnect(); } catch (e) { } }   // never destroy: that would drop connected players
          else this.open(room, this.fixed);
        }, 4000);
      } else if (t === 'browser-incompatible') setNet('This browser doesn\'t support online play.', 'bad');
      else console.warn('PeerJS:', err);
    });
  },
  shutdown(reason = 'The host closed the room.') {
    const peer = this.peer;
    for (const [, c] of this.conns) this.send(c, { t: 'reject', reason });
    setTimeout(() => { try { peer && peer.destroy(); } catch (e) { } }, 400);
    this.peer = null; this.room = null; this.conns.clear(); this.reqs.clear(); this.inGame = false;

  if (!G) { el.dataset.key = ''; el.innerHTML = '<p class="note">Nothing yet. Deal a game from the menu.</p>'; return; }
  const lines = G.logLines.slice(-120), key = G.gid + ':' + ME + ':' + G.logLines.length + ':' + (lines[lines.length - 1] || '');
  if (el.dataset.key !== key) { el.dataset.key = key; el.innerHTML = lines.map(h => `<p>${logText(h, ME)}</p>`).join(''); el.scrollTop = el.scrollHeight; }
}
function renderReqs() {
  const reqs = $('reqs');
  if (G && NET.role === 'host' && G.buybackReqs.length) {
    reqs.innerHTML = G.buybackReqs.map(id => `<div class="req"><div>${nm(P(id))} wants to buy back in for ${fmt(G.startStack)}.</div><button class="btn pri" data-ok="${id}">Approve</button><button class="btn" data-no="${id}">Decline</button></div>`).join('');
    reqs.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => act('approve', { id: +b.dataset.ok }));
    reqs.querySelectorAll('[data-no]').forEach(b => b.onclick = () => act('decline', { id: +b.dataset.no }));
  } else reqs.innerHTML = '';
}
// the log is tucked away until someone wants it
function setLog(open) {
  $('app').classList.toggle('logOpen', open);
  $('logBtn').setAttribute('aria-expanded', String(open));
  if (open) { const el = $('log'); el.scrollTop = el.scrollHeight; }
}
function renderTray() {
  if (HEADLESS) return;
  const mineEl = $('mine'), box = $('actions');
  const me = G && G.players[ME];
  if (!G || !me) { mineEl.innerHTML = ''; box.innerHTML = ''; box.dataset.key = ''; return; }
  const hole = me.hole.length && me.hole[0] !== null ? me.hole : null;
  let hn = '';
  const best = myBest();
  if (hole && G.board.length >= 3) hn = bestHand([...hole, ...G.board]).name;
  else if (hole) { const [a, b] = [rankOf(hole[0]), rankOf(hole[1])].sort((x, y) => y - x); hn = a === b ? `Pocket ${plural(a).toLowerCase()}` : `${RANK_NAME[a]}-${RANK_NAME[b]}${suitOf(hole[0]) === suitOf(hole[1]) ? ' suited' : ''}`; }
  mineEl.innerHTML = `<div class="cards">${hole && (me.inHand || G.shown[me.id]) ? hole.map(c => cardHTML(c, 'lg', me.folded ? 'dim' : best && best.has(c) ? 'best' : '')).join('') : '<div class="cd lg slot"></div><div class="cd lg slot"></div>'}</div><div class="hn">${me.inHand || G.shown[me.id] ? esc(hn) : ''}</div>`;
  // The betting controls stay up for the whole hand: live on your turn, greyed out (showing what you'd face
  // right now) while you wait. Rebuilt only when what they offer changes, so a half-dragged slider survives updates.
  let key, html;
  const live = !!(myAsk && myAsk.kind === 'act');
  const waiting = !live && ['preflop', 'flop', 'turn', 'river'].includes(G.phase) && inHand(me) && !me.allIn && G.cur >= 0;
  if (live || waiting) {
    const L = live ? myAsk.args : legalFor(me), on = !live && preActOn(), cur = G.players[G.cur];
    const showRaise = live ? L.canRaise : L.maxTo > L.curBet, dis = live ? '' : 'disabled';
    key = (live ? 'ask:' : 'wait:' + G.cur + ':' + on + ':') + JSON.stringify(L);
    if (box.dataset.key === key) return;
    const callLbl = L.canCheck ? 'Check' : L.toCall >= L.stack ? `All in<small>${fmt(L.toCall)}</small>` : `Call<small>${fmt(L.toCall)}</small>`;
    const potTo = f => Math.max(L.minTo, Math.min(L.maxTo, Math.round(L.curBet + f * (L.pot + L.toCall))));
    const waitText = cur.id === ME ? 'Your turn…' : `Waiting for ${esc(cur.name)}…`;
    html = `<div class="row">
        <button class="ab fold" id="aFold" ${live && L.canCheck ? 'disabled title="Checking is free"' : dis}>Fold</button>
        <button class="ab" id="aCall" ${dis}>${callLbl}</button>
        ${showRaise ? `<button class="ab go" id="aRaise" ${dis}></button>` : ''}
        <label class="pre" title="${live ? 'For your next turn' : 'Check if nobody bets, otherwise fold'}"><input type="checkbox" id="aPre" ${on ? 'checked' : ''} ${live ? 'disabled' : ''}>Check/Fold</label>
      </div>
      ${showRaise && L.maxTo > L.minTo ? `<div class="raise">
        <input type="range" id="aSlide" min="${L.minTo}" max="${L.maxTo}" step="1" value="${L.minTo}" aria-label="Raise amount" ${dis}>
        <input type="number" id="aNum" min="${L.minTo}" max="${L.maxTo}" value="${L.minTo}" aria-label="Raise to" ${dis}>
        <button class="qb" data-to="${L.minTo}" ${dis}>Min</button><button class="qb" data-to="${potTo(0.5)}" ${dis}>½ pot</button><button class="qb" data-to="${potTo(1)}" ${dis}>Pot</button><button class="qb" data-to="${L.maxTo}" ${dis}>All in</button>
      </div>` : ''}
      <div class="note">${live
        ? `<span class="myClock" id="myClock"></span>${L.toCall ? `${fmt(L.toCall)} to call · ` : ''}pot ${fmt(L.pot)}<span class="keys"> · keys: F fold, C ${L.canCheck ? 'check' : 'call'}${L.canRaise ? ', R raise' : ''}, L log</span>`
        : `${waitText}${on ? ' When it\'s your turn you\'ll check if you can, otherwise fold.' : ''} · pot ${fmt(L.pot)}`}</div>`;
    box.innerHTML = html; box.dataset.key = key;
    let to = L.minTo;
    const setTo = v => {
      to = Math.max(L.minTo, Math.min(L.maxTo, Math.round(+v) || L.minTo));
      if ($('aSlide')) { $('aSlide').value = to; $('aNum').value = to; }
      if ($('aRaise')) $('aRaise').innerHTML = to >= L.maxTo ? `All in<small>${fmt(L.maxTo)}</small>` : `${L.open ? 'Bet' : 'Raise to'}<small>${fmt(to)}</small>`;
    };
    setTo(L.minTo);
    if (!live) { $('aPre').onchange = e => setPreAct(e.target.checked); return; }
    const ask = myAsk;
    if ($('aSlide')) { $('aSlide').oninput = e => setTo(e.target.value); $('aNum').onchange = e => setTo(e.target.value); }
    box.querySelectorAll('[data-to]').forEach(b => b.onclick = () => setTo(b.dataset.to));
    $('aFold').onclick = () => ask.done({ a: 'fold' });
    $('aCall').onclick = () => ask.done({ a: L.canCheck ? 'check' : 'call' });
    if ($('aRaise')) $('aRaise').onclick = () => ask.done(to >= L.maxTo ? { a: 'allin' } : { a: 'raise', to });
    return;
  }
  const pending = G.buybackReqs.includes(ME);
  if (G.over) { key = 'over'; html = '<div class="wait">The game is over.</div>'; }
  else if (me.out) {
    const watching = me.watch === true;
    key = 'out:' + pending + ':' + (G.rail ? me.watch : '');
    html = `<div class="outBox"><div><b>You're out.</b> ${pending ? 'You asked to buy back in. Waiting for the host…' : `Buy back in for ${fmt(G.startStack)}? It halves the blinds.`}${watching ? '<div class="note">Observer mode: every hand is face up, with each player\'s chance to win.</div>' : ''}</div>
      ${pending ? '<button class="btn" id="bbCancel">Cancel</button>' : `<button class="btn pri" id="bbGo">${NET.role === 'client' ? 'Ask to buy back in' : 'Buy back in'}</button>`}
      ${G.rail ? `<button class="btn" id="obToggle">${watching ? 'Hide the cards' : 'Observer mode'}</button>` : ''}</div>`;
  } else {
    const cur = G.cur >= 0 ? G.players[G.cur] : null;
    const text = !me.inHand && ['preflop', 'flop', 'turn', 'river'].includes(G.phase) ? 'You\'re dealt in from the next hand.'
      : me.folded ? 'You folded this hand.'
      : me.allIn && me.inHand ? 'You\'re all in. Good luck!'
      : cur ? `Waiting for ${esc(cur.name)}…` : G.wait === 'buyback' ? 'Waiting on a buy-back decision…' : 'Next hand coming up…';
    key = 'idle:' + text; html = `<div class="wait">${text}</div>`;
  }
  if (box.dataset.key === key) return;
  box.innerHTML = html; box.dataset.key = key;
  if ($('bbGo')) $('bbGo').onclick = async e => { e.target.disabled = true; const r = await act('buyback'); if (r && r.err) { e.target.disabled = false; render(); } };
  if ($('bbCancel')) $('bbCancel').onclick = () => act('cancelBuyback');
  if ($('obToggle')) $('obToggle').onclick = () => me.watch === true ? act('watch', { on: false }) : observePrompt();
}

// =====================================================================  boot
function boot() {
  $('menuBtn').onclick = () => {
    if (modalBg().classList.contains('on')) return;
    if (G && G.over) { overShown = ''; return renderOver(); }   // reopen the results
    gameMenu();
  };
  $('logBtn').onclick = () => setLog(!$('app').classList.contains('logOpen'));
  $('logClose').onclick = () => setLog(false);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || modalBg().classList.contains('on') || /^(INPUT|SELECT|TEXTAREA)$/.test((e.target && e.target.tagName) || '')) return;
    if (e.key.toLowerCase() === 'l') { e.preventDefault(); return setLog(!$('app').classList.contains('logOpen')); }
    if (!myAsk) return;
    const k = e.key.toLowerCase(), b = k === 'f' ? $('aFold') : k === 'c' ? $('aCall') : k === 'r' ? $('aRaise') : null;
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  });
  addEventListener('beforeunload', e => { if (NET.role === 'host' && Host.inGame && G && !G.over && !window.__pokerNoUnloadPrompt) { e.preventDefault(); e.returnValue = ''; } });
  setInterval(tickClock, 250);
  addEventListener('resize', () => renderTable());   // turning a phone reshapes the table
  render();
  const q = new URLSearchParams(location.search);
  if (q.has('test')) return;
  const join = (q.get('join') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  const hosting = ss.get('pn_hosting');
  if (join) {
    // a refresh mid-game reconnects straight away; a fresh visit asks for a name first
    const name = cleanName(ss.get('pn_name')) || savedName();
    if (ss.get('pn_join') === join && name) ensurePeer().then(ok => { if (ok) { openModal(`<h3>Rejoining room ${esc(join)}</h3><p class="note" id="jMsg">Connecting…</p><div class="row"><button class="btn" id="leave">Leave</button></div>`, 'join'); $('leave').onclick = backToMenu; Client.start(join, name); } });
    else joinScreen(join);
  } else if (hosting) {
    // the host refreshed: pick the game (or lobby) straight back up
    const save = loadSave();
    if (save && save.room === hosting) resumeHosted(save);
    else startHosting(hosting);
  } else mainMenu();
}
window.__poker = {
  GAME_VERSION, BUILD, get G() { return G; }, get ME() { return ME; }, NET, Host, Client, Bot,
  newGame, startGame, runGame, startHand, applyMove, cleanMove, legalFor, roundDone, needsAct, endStreet, dealStreet, finishHand, buildPots,
  score5, bestHand, handName, equities, pct, railOdds, onRail, renderObserve, logText, doAction, act, viewFor, approveBuyback, cleanRules, encodeSave, decodeSave, resetHandForResume,
  setHeadless: v => HEADLESS = v, setAuto: f => TEST_AUTO = f, setSpeed: v => CFG.speed = v, setGrace: s => OFFLINE_GRACE = s,
};
boot();
</script>
