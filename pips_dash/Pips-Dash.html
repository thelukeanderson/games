<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dag's Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#16122a;--panel:#221c3c;--line:#3a3160;--ink:#efe8ff;--dim:#a59cc8;--accent:#f08a3a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 0%,#2e2458 0%,transparent 65%)}
/* the game fills the window at 4:3; --below is the room kept for the help line or touch buttons */
.wrap{--below:30px;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.frame{position:relative;box-sizing:border-box;width:min(100vw,calc((100vh - var(--below) - 4px)*4/3 + 4px));width:min(100vw,calc((100dvh - var(--below) - 4px)*4/3 + 4px));border:2px solid #0b0816;box-shadow:0 0 0 2px var(--line),0 24px 50px #0009;background:#000}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none}
.fs{position:absolute;right:6px;bottom:6px;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:#0b0816a0;color:var(--ink);font-size:16px;line-height:1;cursor:pointer;opacity:.45}
.fs:hover,.fs:focus-visible{opacity:1}
.help{font-size:11px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100vw;padding-inline:16px;box-sizing:border-box}
:fullscreen .wrap{--below:0px}:fullscreen .help{display:none}:fullscreen .frame{border:0;box-shadow:none}
kbd{font-family:inherit;background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink);font-size:11px}
.touch{display:none;width:100%;max-width:520px;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.touch .grp{display:flex;gap:10px}
.touch button{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-family:"Fredoka",sans-serif;font-weight:600;font-size:20px;box-shadow:0 4px 0 #0b0816;touch-action:none}
.touch button.a{background:var(--accent);color:#2a1408;border-color:#b35a1c}
.touch button:active{transform:translateY(2px);box-shadow:0 2px 0 #0b0816}
@media (hover:none),(max-width:640px){.wrap{--below:84px}.touch{display:flex}.help{display:none}}
/* phones on their side: buttons float over the side bars so the game keeps the full height */
@media (hover:none) and (orientation:landscape){.wrap{--below:0px}.touch{position:fixed;left:0;right:0;bottom:12px;max-width:none;padding-inline:12px;box-sizing:border-box;pointer-events:none}.touch button{pointer-events:auto;opacity:.8}}
</style>
</head><body>

<div class="wrap">
  <div class="frame"><canvas id="game" width="320" height="240" tabindex="0" aria-label="Dag's Dash game screen"></canvas><button class="fs" id="fs" title="Fullscreen (F)" aria-label="Toggle fullscreen">⛶</button></div>
  <div class="touch" id="touch">
    <div class="grp"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div>
    <div class="grp"><button data-k="run" aria-label="Run or throw leaf">B</button><button class="a" data-k="jump" aria-label="Jump">A</button></div>
  </div>
  <div class="help">
    <kbd>←</kbd><kbd>→</kbd> move · <kbd>Z</kbd> jump · <kbd>X</kbd> run &amp; leaves · <kbd>Enter</kbd> pause · <kbd>M</kbd> music · <kbd>F</kbd> fullscreen · stomp beetles, kick shells, avoid thornbacks
  </div>
</div>

<script>
(()=>{
const W=320,H=240,T=16;
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const FONT='"Fredoka", "Trebuchet MS", sans-serif';

/* ---------- art ---------- */
// Everything is drawn with vector shapes in game units (320x240), scaled up to the canvas's real pixel
// size (S device pixels per unit), so the picture stays sharp however big the window is.
let S=1;
const MAX_S=7,TAU=Math.PI*2,OUT='#1c1030';
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const h1=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function grad(g,x0,y0,x1,y1,cols){const gr=g.createLinearGradient(x0,y0,x1,y1);cols.forEach((c,i)=>gr.addColorStop(i/(cols.length-1),c));return gr}
function rgrad(g,x,y,r,cols){const gr=g.createRadialGradient(x,y,0,x,y,r);cols.forEach((c,i)=>gr.addColorStop(i/(cols.length-1),c));return gr}
function ell(g,x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,TAU)}
function rrect(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function poly(g,pts){g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath()}
// fill the current path, then outline it
function fs(g,fill,stroke=OUT,lw=0.55){g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
// k<0 darkens a #rrggbb colour, k>0 lightens it
function shade(c,k){const n=parseInt(c.slice(1),16),f=v=>Math.round(k<0?v*(1+k):v+(255-v)*k);
  return '#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}

const PAL_HERO={skin:'#f6c9a0',beard:'#f2cd6a',beardD:'#c8963a',wool:'#24386e',woolD:'#16224a',yoke:'#f4efe2',hat:'#f4efe2',hatD:'#2f7f7a',pants:'#7a5a3c',sock:'#e6dcc8',boot:'#3a2418'};
const PAL_LEAF={skin:'#f6c9a0',beard:'#f2cd6a',beardD:'#c8963a',wool:'#3f9a44',woolD:'#22632e',yoke:'#e8f2b0',hat:'#e8f2b0',hatD:'#3f9a44',pants:'#6a4a30',sock:'#fff4e2',boot:'#2a1830'};
// Dag, a little Norwegian man, with feet at (0,0), facing +x. pose: stand|walk|jump|skid; t: stride phase; k: frame count for idle motion
function drawHero(g,pose,t,k,pal){
  g.lineJoin=g.lineCap='round';
  const sw=pose==='walk'?Math.sin(t):0,air=pose==='jump';
  const bob=pose==='walk'?-Math.abs(Math.cos(t))*0.5:pose==='stand'?Math.sin(k*0.06)*0.15:0;
  const leg=(x,a,far)=>{g.save();g.translate(x,-4.4+bob);g.rotate(a);
    rrect(g,-1.5,-0.4,3,3,1);fs(g,far?shade(pal.pants,-0.3):pal.pants);
    rrect(g,-1.15,1.9,2.3,1.4,0.4);fs(g,far?shade(pal.sock,-0.2):pal.sock,null);
    rrect(g,-1.3,3,3.5,1.5,0.7);fs(g,pal.boot);g.restore()};
  const arm=(x,a,far)=>{g.save();g.translate(x,-7.8+bob);g.rotate(a);
    rrect(g,-1.1,-0.4,2.2,4,1);fs(g,far?pal.woolD:pal.wool);
    ell(g,0,3.8,1.2,1.15);fs(g,far?shade(pal.hatD,-0.3):pal.hatD);g.restore()};
  const A=air?[0.8,-0.7]:pose==='skid'?[0.35,-0.55]:[sw*0.65,-sw*0.65];
  const H=air?[-2.3,1.9]:pose==='skid'?[-1.1,1.1]:[-sw*0.8,sw*0.8];
  arm(2.6,H[1],1);leg(1,-A[0],1);
  // knitted sweater: dark wool with a pale patterned yoke and hem
  const body=()=>rrect(g,-4.3,-9.6+bob,8.6,6.4,2.6);
  body();fs(g,grad(g,0,-9.6,0,-3.2,[pal.wool,pal.woolD]));
  g.save();body();g.clip();g.fillStyle=pal.yoke;g.fillRect(-5,-10+bob,10,3);g.fillRect(-5,-4.2+bob,10,1.1);
  g.fillStyle=pal.wool;for(let x=-4;x<=4;x+=2){poly(g,[[x,-7.9+bob],[x+0.7,-7.2+bob],[x,-6.5+bob],[x-0.7,-7.2+bob]]);g.fill()}
  g.restore();body();g.strokeStyle=OUT;g.lineWidth=0.55;g.stroke();
  leg(-1,A[0],0);arm(-1.8,H[0],0);
  // head
  g.save();g.translate(1.2,-11+bob*1.2);if(air)g.rotate(-0.08);
  // long knitted hat flopping out behind, with a pompom on the end
  const fl=Math.sin(k*0.25)*0.7,lift=air?-2.6:pose==='walk'?-0.7:1.2;
  const hx=-8.2,hy=-1.4+lift+fl;
  g.beginPath();g.moveTo(1,-5.6);g.quadraticCurveTo(-5,-6.4,hx,hy);g.quadraticCurveTo(-4.6,-2.2,-3.6,-1.8);g.closePath();
  fs(g,grad(g,1,0,hx,0,[pal.hat,pal.hatD,pal.hat,pal.hatD]));
  ell(g,hx,hy,1.5,1.5);fs(g,'#fff');
  // face and big beard
  ell(g,0.2,-0.6,3.5,3.2);fs(g,pal.skin);
  g.beginPath();g.moveTo(-3.3,-0.5);g.bezierCurveTo(-3.6,3.4,-0.8,5.6,2.4,5.2);g.bezierCurveTo(4.6,4.2,4.8,1.6,3.8,0.6);g.quadraticCurveTo(0.6,1.5,-0.5,-0.4);g.quadraticCurveTo(-1.8,-1,-3.3,-0.5);g.closePath();
  fs(g,grad(g,0,-0.5,0,5.4,[pal.beard,pal.beardD]));
  g.strokeStyle=pal.beardD;g.lineWidth=0.35;for(const [x,y] of [[-1.2,2.2],[0.6,3.2],[2.2,2.4]]){g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+0.3,y+0.8,x+0.1,y+1.3);g.stroke()}
  ell(g,3.5,0,1.2,1);fs(g,'#ee9a7c');
  if(k%220<6){g.beginPath();g.moveTo(0.8,-1.2);g.quadraticCurveTo(1.5,-0.7,2.2,-1.2);g.strokeStyle=OUT;g.lineWidth=0.5;g.stroke()}
  else{ell(g,1.6,-1.2,0.65,0.9);g.fillStyle=OUT;g.fill();ell(g,1.8,-1.55,0.25,0.3);g.fillStyle='#fff';g.fill()}
  // hat crown and folded brim
  g.beginPath();g.moveTo(-3.6,-2.8);g.bezierCurveTo(-3.6,-7.2,3.4,-7.2,3.8,-2.8);g.closePath();fs(g,grad(g,0,-6,0,-2,[pal.hatD,shade(pal.hatD,-0.25)]));
  rrect(g,-4,-4,8.2,1.8,0.8);fs(g,pal.hat);
  g.restore();
}
function drawBeetle(g,k,flat){
  g.save();if(flat)g.scale(1.15,0.45);
  const st=Math.sin(k*0.3);
  if(!flat)for(const [x,p] of [[-4,0],[0,1],[4,0]]){g.save();g.translate(x,-3);g.rotate((p?st:-st)*0.35);
    g.beginPath();g.moveTo(0,0);g.lineTo(0.8,3);g.lineTo(2,3);g.strokeStyle=OUT;g.lineWidth=0.9;g.stroke();g.restore()}
  g.beginPath();g.moveTo(-7,-2.6);g.bezierCurveTo(-7,-10,-2,-12.4,1,-12.2);g.bezierCurveTo(5,-12,7.4,-8,7,-3.4);g.quadraticCurveTo(0,-1.2,-7,-2.6);g.closePath();
  fs(g,rgrad(g,-1.5,-10,11,['#e2b8ff','#9a5ce0','#5a2a98']));
  g.beginPath();g.moveTo(0.6,-12.1);g.quadraticCurveTo(-0.4,-7,0.4,-2.2);g.strokeStyle='#3a1a68';g.lineWidth=0.5;g.stroke();
  for(const [x,y,r] of [[-3.6,-6,1.1],[-1.6,-9.4,0.8],[3,-7.2,1],[4.4,-4.4,0.7]]){ell(g,x,y,r,r);g.fillStyle='#c89af0';g.fill()}
  ell(g,-2.4,-10,2,0.9,-0.5);g.fillStyle='rgba(255,255,255,.55)';g.fill();
  // head in front of the shell
  ell(g,6.4,-4,2.6,2.5);fs(g,'#2a1a40');
  ell(g,6.9,-4.7,1.2,1.35);fs(g,'#ffe45a',OUT,0.4);ell(g,7.3,-4.8,0.55,0.75);g.fillStyle=OUT;g.fill();ell(g,7.5,-5.2,0.22,0.25);g.fillStyle='#fff';g.fill();
  g.beginPath();g.moveTo(8.6,-3.2);g.quadraticCurveTo(9.8,-2.6,9.2,-1.6);g.strokeStyle=OUT;g.lineWidth=0.6;g.stroke();
  g.restore();
}
// a snail shell, sitting on (0,0)
function drawShell(g,rot){
  g.save();g.translate(0,-5.4);g.rotate(rot);
  ell(g,0,0,5.4,5.4);fs(g,rgrad(g,-1.6,-1.8,7,['#ffd890','#f0a040','#9a4a18']));
  g.beginPath();for(let a=0;a<4.5*Math.PI;a+=0.2){const r=4.6-a*0.3;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.strokeStyle='#7a3a18';g.lineWidth=0.7;g.stroke();
  ell(g,-2,-2.6,1.6,0.8,-0.6);g.fillStyle='rgba(255,255,255,.5)';g.fill();
  g.restore();
}
function drawSnail(g,k){
  const s=Math.sin(k*0.2)*0.4;
  g.beginPath();g.moveTo(-7,0);g.lineTo(5.5+s,0);g.quadraticCurveTo(8.2,0,7.8,-3);g.lineTo(7.2,-7.4);g.quadraticCurveTo(6,-9.4,4.2,-7.6);g.lineTo(3.4,-2.6);g.quadraticCurveTo(-3,-3.2,-7,0);g.closePath();
  fs(g,grad(g,0,-9,0,0,['#c4f090','#8ad060','#4e9a36']));
  for(const [x,y] of [[6.2,-12],[8.6,-11]]){g.beginPath();g.moveTo(6.2,-8);g.quadraticCurveTo(x-0.4,y+2,x,y+s);g.strokeStyle='#4e9a36';g.lineWidth=0.8;g.stroke();
    ell(g,x,y+s,1.15,1.15);fs(g,'#fff',OUT,0.4);ell(g,x+0.35,y+s,0.5,0.6);g.fillStyle=OUT;g.fill()}
  g.beginPath();g.moveTo(6.4,-4.8);g.quadraticCurveTo(7.2,-4.2,7.8,-4.8);g.strokeStyle=OUT;g.lineWidth=0.4;g.stroke();
  g.save();g.translate(-1.4,-1.2);drawShell(g,0);g.restore();
}
function drawSpiky(g,k){
  const st=Math.sin(k*0.3);
  for(const [x,p] of [[-3.5,0],[3,1]]){ell(g,x+(p?st:-st)*0.8,-1,2.2,1.3);fs(g,'#f2c68a')}
  for(let i=0;i<5;i++){const a=Math.PI*(1.12+i*0.19),nx=Math.cos(a),ny=Math.sin(a),cx=nx*6.4,cy=-4.5+ny*6.4;
    poly(g,[[cx-ny*1.5,cy+nx*1.5],[cx+nx*3.4,cy+ny*3.4],[cx+ny*1.5,cy-nx*1.5]]);fs(g,grad(g,cx,cy,cx+nx*3.4,cy+ny*3.4,['#d8cdb8','#fff8ea']),OUT,0.45)}
  g.beginPath();g.moveTo(-7,-2);g.bezierCurveTo(-7.4,-9,-3,-11.2,0.5,-11);g.bezierCurveTo(4.6,-10.8,7.6,-7.6,7,-2.4);g.quadraticCurveTo(0,-0.4,-7,-2);g.closePath();
  fs(g,rgrad(g,-2,-8.5,11,['#ff9a90','#d8323c','#7a1420']));
  ell(g,4.4,-3.8,3,2.4);fs(g,'#f6d8a8');
  ell(g,5,-4.6,0.75,1);g.fillStyle=OUT;g.fill();ell(g,5.2,-5,0.28,0.3);g.fillStyle='#fff';g.fill();
  g.beginPath();g.moveTo(3.6,-6.4);g.lineTo(6,-5.8);g.strokeStyle=OUT;g.lineWidth=0.6;g.stroke();
  g.beginPath();g.moveTo(5.2,-2.6);g.lineTo(6.6,-2.9);g.lineWidth=0.45;g.stroke();
  ell(g,-2.6,-8.6,2.2,1,-0.4);g.fillStyle='rgba(255,255,255,.4)';g.fill();
}
function drawBerry(g){
  ell(g,0,-5.6,5.4,5.2);fs(g,rgrad(g,-1.8,-7.6,7.5,['#f0b0ff','#a43cc8','#561670']));
  for(const [x,y] of [[-2,-4],[1.6,-3],[0.4,-6.4],[2.8,-6],[-2.8,-7]]){ell(g,x,y,0.35,0.5);g.fillStyle='#ffd8ff';g.fill()}
  ell(g,-2,-7.8,1.6,1,-0.6);g.fillStyle='rgba(255,255,255,.7)';g.fill();
  g.beginPath();g.moveTo(0,-10.4);g.quadraticCurveTo(-2.2,-14.4,-5,-12);g.quadraticCurveTo(-2.8,-9.4,0,-10.4);fs(g,'#5ec05a',OUT,0.45);
  g.beginPath();g.moveTo(0,-10.4);g.quadraticCurveTo(2,-14.8,4.8,-12.6);g.quadraticCurveTo(2.8,-9.6,0,-10.4);fs(g,'#3aa84a',OUT,0.45);
}
// a thrown leaf, centred on (0,0), rocking as it flies
function drawLeaf(g,k){
  g.save();g.rotate(Math.sin(k*0.3)*0.8);
  g.beginPath();g.moveTo(-4.4,0);g.quadraticCurveTo(-0.6,-3.8,4.2,0);g.quadraticCurveTo(-0.6,3.8,-4.4,0);g.closePath();
  fs(g,grad(g,0,-2.6,0,2.6,['#c8f07a','#4ec04a','#2f8a36']),OUT,0.45);
  g.beginPath();g.moveTo(-5.6,0.5);g.lineTo(3,0);g.strokeStyle='#22632e';g.lineWidth=0.4;g.stroke();
  g.restore();
}
function drawFlower(g,k){
  g.beginPath();g.moveTo(0,0);g.lineTo(0,-6);g.strokeStyle='#2f8a36';g.lineWidth=1.1;g.stroke();
  for(const s of [-1,1]){g.beginPath();g.moveTo(0,-2);g.quadraticCurveTo(s*4.6,-4.6,s*5,-1.6);g.quadraticCurveTo(s*2.4,-0.8,0,-2);fs(g,'#4ec04a',OUT,0.45)}
  const alt=Math.floor(k/6)%2;
  g.save();g.translate(0,-9);
  for(let i=0;i<8;i++){g.save();g.rotate(k*0.05+i*TAU/8);ell(g,0,-3.4,1.7,2.4);fs(g,(i+alt)%2?'#4ec04a':'#b6ec6a',OUT,0.4);g.restore()}
  ell(g,0,0,2.9,2.9);fs(g,rgrad(g,-0.8,-0.8,3.6,['#fffbe0','#ffe07a']));
  ell(g,-0.9,-0.3,0.4,0.7);g.fillStyle=OUT;g.fill();ell(g,0.9,-0.3,0.4,0.7);g.fill();
  g.beginPath();g.arc(0,0.6,1,0.2,Math.PI-0.2);g.strokeStyle=OUT;g.lineWidth=0.4;g.stroke();
  g.restore();
}
// a spinning golden gem centred on (x,y)
function drawGem(g,x,y,t,sc=1){
  const sx=Math.cos(t);
  g.save();g.translate(x,y);g.scale(sc*Math.max(0.12,Math.abs(sx)),sc);
  poly(g,[[-4,-2.2],[-2,-5],[2,-5],[4,-2.2],[0,5.2]]);fs(g,grad(g,-4,-5,4,5,['#fff6b0','#ffcc2a','#c07a10']),'#6a3a08',0.5);
  poly(g,[[-2,-5],[2,-5],[1.2,-2.2],[-1.2,-2.2]]);g.fillStyle=sx>=0?'#fff8d0':'#ffe680';g.fill();
  poly(g,[[-4,-2.2],[4,-2.2],[0,5.2]]);g.fillStyle='rgba(176,110,16,.35)';g.fill();
  poly(g,[[-1.2,-2.2],[1.2,-2.2],[0,5.2]]);g.fillStyle='rgba(255,255,255,.35)';g.fill();
  g.restore();
  if(sx>0.75){g.save();g.translate(x-1.6*sc,y-3.4*sc);g.rotate(t*0.6);g.fillStyle='rgba(255,255,255,.9)';g.fillRect(-0.3,-1.4,0.6,2.8);g.fillRect(-1.4,-0.3,2.8,0.6);g.restore()}
}
// background pieces
const CLOUD=[[-14,0,7],[-5,-5,9],[7,-4,8],[16,1,6],[0,2,8]];
function cloud(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='rgba(140,180,225,.45)';for(const [cx,cy,r] of CLOUD){ell(g,cx,cy+2.2,r,r);g.fill()}
  g.fillStyle='#ffffff';for(const [cx,cy,r] of CLOUD){ell(g,cx,cy,r,r);g.fill()}g.restore()}
function tree(g,x,base,s,col){g.fillStyle='#7a4a2a';g.fillRect(x-0.8*s,base-6*s,1.6*s,6*s);

/* ---------- collision ---------- */
function solidAt(tx,ty){if(ty<0||ty>=15)return false;if(tx<0||tx>=L.len)return true;return SOLID.has(L.rows[ty][tx])}

  if(e.vx>0){const c=Math.floor((e.x+e.w-0.01)/T);for(let r=t0;r<=t1;r++)if(solidAt(c,r)){e.x=c*T-e.w;return 1}}
  else if(e.vx<0){const c=Math.floor(e.x/T);for(let r=t0;r<=t1;r++)if(solidAt(c,r)){e.x=(c+1)*T;return -1}}
  return 0;
}
function collideY(e){
  const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-0.01)/T);e.on=false;
  if(e.vy>0){const rr=Math.floor((e.y+e.h-0.01)/T);for(let c=l;c<=r;c++)if(solidAt(c,rr)){e.y=rr*T-e.h;e.vy=0;e.on=true;return null}}
  else if(e.vy<0){const rr=Math.floor(e.y/T);const hits=[];for(let c=l;c<=r;c++)if(solidAt(c,rr))hits.push(c);
    if(hits.length){e.y=(rr+1)*T;e.vy=0;const cc=Math.floor((e.x+e.w/2)/T);return {tx:hits.includes(cc)?cc:hits[0],ty:rr}}}
  return null;
}

function bumpTile(tx,ty){

  else if(c==='B'){if(P.size>0){L.rows[ty][tx]=' ';SFX.brk();addScore(50);
      for(const [dx,dy,vx,vy] of [[0,0,-1.2,-5],[8,0,1.2,-5],[0,8,-1,-3.5],[8,8,1,-3.5]])parts.push({k:'debris',x:tx*T+dx,y:ty*T+dy,vx,vy,t:90});}
    else SFX.bump()}
  else {SFX.bump();return}
  if(L.rows[ty][tx]!==' ')bumps.set(key,8);

  for(const it of items)if(it.rise<=0&&it.x+it.w>tx*T&&it.x<tx*T+T&&Math.abs(it.y+it.h-ty*T)<4){it.vy=-4;it.vx=it.x+it.w/2<tx*T+8?-1:1}

}
function coinPop(tx,ty){parts.push({k:'gem',x:tx*T+4,y:ty*T-8,vy:-5,t:28});gems++;SFX.coin();if(gems>=100){gems-=100;lives++;SFX.oneup()}addScore(200)}

  const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-0.01)/T);return L.rows[ty][l]==='I'||L.rows[ty][r]==='I'}
function updatePlayer(){
  const p=P,run=inp.run,max=run?2.7:1.6,slip=p.on&&onIce(p),acc=p.on?(slip?0.04:run?0.11:0.08):0.07;

    if(Math.abs(p.vx)>max)p.vx-=Math.sign(p.vx)*0.05;if(p.on||!p.skid)p.face=dir}
  else{const f=p.on?(slip?0.012:0.09):0.02;p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f}
  if(inp.jp&&p.on){p.vy=-(5.4+Math.abs(p.vx)*0.25);p.on=false;SFX.jump()}
  p.vy+=(inp.jump&&p.vy<0)?0.22:0.6;if(p.vy>5.5)p.vy=5.5;
  if(p.size===2&&inp.rp&&leaves.length<2){leaves.push({x:p.face>0?p.x+p.w:p.x-6,y:p.y+6,w:6,h:6,vx:p.face*3.5,vy:0,t:0});SFX.leaf()}
  p.x+=p.vx;if(collideX(p))p.vx=0;

  p.y+=p.vy;const hit=collideY(p);if(hit)bumpTile(hit.tx,hit.ty);

    if(ty>=0&&ty<15&&L.rows[ty][tx]==='C'){L.rows[ty][tx]=' ';addGem()}

function updateEnemies(){
  for(const e of enemies){
    if(!e.active){if(e.x<camX+W+24)e.active=true;else continue}
    if(e.state==='flip'){e.vy+=0.35;e.y+=e.vy;e.x+=e.vx;if(e.y>H+32)e.dead=true;continue}
    if(e.state==='flat'){if(--e.t<=0)e.dead=true;continue}
    e.vy=Math.min(e.vy+0.4,5);e.x+=e.vx;
    if(collideX(e)){e.vx=-e.vx;if(e.state==='kicked'&&e.x>camX-16&&e.x<camX+W)SFX.bump()}
    e.y+=e.vy;collideY(e);
    if(e.y>H+32||e.x<camX-96)e.dead=true;
    if(e.grace>0)e.grace--;
    if(e.state==='shell'){if(--e.t<=0){e.state='walk';e.vx=e.x>P.x?-0.5:0.5}}
    if(e.state==='kicked'){for(const o of enemies)if(o!==e&&o.active&&o.state!=='flip'&&!o.dead&&overlap(e,o)){flipKill(o,[500,800,1000,2000,4000][Math.min(e.chain||0,4)]);e.chain=(e.chain||0)+1}}
    if(!P.dead&&state==='play'&&overlap(P,e))touchEnemy(e);
  }
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(!a.active||a.state!=='walk')continue;
    for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(!b.active||(b.state!=='walk'&&b.state!=='shell')||!overlap(a,b))continue;
      if(a.x<b.x){a.vx=-Math.abs(a.vx);if(b.state==='walk')b.vx=Math.abs(b.vx)}else{a.vx=Math.abs(a.vx);if(b.state==='walk')b.vx=-Math.abs(b.vx)}}}
  enemies=enemies.filter(e=>!e.dead);
}
function touchEnemy(e){

  if(e.state==='walk'){

      if(e.type==='beetle'){e.state='flat';e.t=30}else{e.state='shell';e.vx=0;e.t=480}}

function updateItems(){

    if(it.type==='berry'){it.vy=Math.min(it.vy+0.4,5);it.x+=it.vx;if(collideX(it))it.vx=-it.vx;it.y+=it.vy;collideY(it);if(it.y>H+16)it.dead=true}

function updateLeaves(){
  for(const f of leaves){
    f.t++;f.vy=0.2+Math.sin(f.t*0.3)*0.5;f.x+=f.vx;if(collideX(f)){f.dead=true;parts.push({k:'puff',x:f.x+3,y:f.y+3,t:10})}
    f.y+=f.vy;if(!f.dead&&collideY(f)){f.dead=true;parts.push({k:'puff',x:f.x+3,y:f.y+3,t:10})}
    if(f.x<camX-16||f.x>camX+W+16||f.y>H)f.dead=true;
    for(const e of enemies)if(!f.dead&&e.active&&e.state!=='flip'&&overlap(f,e)){flipKill(e);f.dead=true;parts.push({k:'puff',x:f.x+3,y:f.y+3,t:10})}

function updateParts(){
  for(const p of parts){p.t--;
    if(p.k==='debris'){p.vy+=0.3;p.x+=p.vx;p.y+=p.vy}
    else if(p.k==='gem'){p.vy+=0.4;p.y+=p.vy;if(p.t===0)parts.push({k:'txt',x:p.x-camX-2,y:p.y,vy:-0.6,t:35,text:'200'})}
    else if(p.k==='txt'){p.y+=p.vy}}
  parts=parts.filter(p=>p.t>0);

}

  state='flag';flagPhase=0;P.vx=0;P.vy=0;P.x=L.flag*T+8-P.w;P.face=1;
  const h=12*T-(P.y+P.h);const pts=h>150?5000:h>110?2000:h>70?800:h>35?400:100;addScore(pts,P.x-camX+14,P.y);SFX.flag();
}
function updateFlag(){
  if(flagPhase===0){
    let done=true;if(P.y+P.h<12*T){P.y=Math.min(P.y+2,12*T-P.h);done=false}
    if(flagY<11*T-2){flagY+=2;done=false}
    if(done){flagPhase=1;flagT=24}
  }else if(flagPhase===1){if(--flagT<=0){flagPhase=2;P.face=1}}
  else if(flagPhase===2){
    P.vx=1.2;P.vy=Math.min(P.vy+0.6,5);P.x+=P.vx;collideX(P);P.y+=P.vy;collideY(P);P.anim+=0.15;
    if(P.x+P.w/2>L.hut*T+32){P.hidden=true;flagPhase=3}
  }else if(flagPhase===3){
    if(time>0){const d=Math.min(time,2);time-=d;addScore(50*d);if(frameN%3===0)SFX.tick()}
    else{flagPhase=4;flagT=90}
  }else if(flagPhase===4){if(--flagT<=0){levelIdx++;if(levelIdx>=LEVELS.length){state='win';endT=0;clearSave()}else{loadLevel(levelIdx,false);startCard(130)}}}
  updateParts();updateCamera();
}

function step(){
  frameN++;
  if(inp.sp){
    if(state==='title')titleChoose();else if(state==='over'||state==='win')toTitle();
    else if(state==='play'){paused=!paused;SFX.pause()}
    else if(paused)paused=false;
  }
  if(!paused)switch(state){
    case 'title':if(inp.mp&&saved)titleSel^=1;if(inp.jp)titleChoose();break;
    case 'card':if(--cardT<=0)state='play';break;
    case 'play':
      if(frameN%24===0){time--;if(time<=0){time=0;kill(false)}}
      updatePlayer();if(state==='play'||state==='dying'){updateEnemies();updateItems();updateLeaves()}updateParts();updateCamera();break;
    case 'dying':
      if(P.freeze>0)P.freeze--;else{P.vy+=0.3;P.y+=P.vy}
      updateParts();
      if(--dieT<=0){lives--;if(lives<=0)gameOver();else{loadLevel(levelIdx,checkpoint);startCard(110)}}
      break;
    case 'flag':updateFlag();break;
    case 'over':case 'win':endT++;break;
  }
  inp.jp=inp.rp=inp.sp=inp.mp=0;
}

    fs(g,grad(g,px-19,0,px,0,[shade(th.banner,-0.25),th.banner,shade(th.banner,0.25)]),OUT,0.5);
    const cy=flagY+7.4+wv(1)*0.5;g.fillStyle='rgba(255,255,255,.9)';ell(g,px-7.5,cy+0.8,1.6,1.25);g.fill();
    for(const [dx,dy] of [[-1.6,-1],[0,-1.8],[1.6,-1]]){ell(g,px-7.5+dx,cy+dy-0.4,0.6,0.7);g.fill()}
  }
  const hx=L.hut*T-camX,hy=13*T;
  if(hx>-90&&hx<W+90){
    for(let i=0;i<4;i++){const t=(frameN*0.008+i/4)%1;ell(g,hx+48+Math.sin(t*6+i)*3,hy-74-t*34,2.5+t*5,2.2+t*4);g.fillStyle=`rgba(235,235,245,${(1-t)*0.5})`;g.fill()}
    rrect(g,hx+44,hy-72,8,18,1);fs(g,grad(g,hx+44,0,hx+52,0,[th.sLight,th.stone,th.sDark]));
    rrect(g,hx+4,hy-44,56,44,1);fs(g,grad(g,0,hy-44,0,hy,[shade(th.hut,0.1),th.hut,shade(th.hut,-0.18)]));
    g.strokeStyle='rgba(60,30,20,.25)';g.lineWidth=0.5;for(let y=hy-38;y<hy-6;y+=6){g.beginPath();g.moveTo(hx+4.5,y);g.lineTo(hx+59.5,y);g.stroke()}
    for(let x=hx+5,i=0;x<hx+59;x+=7,i++){rrect(g,x,hy-6,6.4,6,1.6);fs(g,grad(g,0,hy-6,0,hy,[th.sLight,th.stone]),th.sDark,0.4)}
    poly(g,[[hx-6,hy-40],[hx+32,hy-70],[hx+70,hy-40]]);fs(g,grad(g,0,hy-70,0,hy-40,[shade(th.roof,0.2),th.roof,shade(th.roof,-0.25)]));
    g.save();poly(g,[[hx-6,hy-40],[hx+32,hy-70],[hx+70,hy-40]]);g.clip();g.strokeStyle=shade(th.roof,-0.35);g.lineWidth=0.5;
    for(let y=hy-64,r=0;y<hy-40;y+=5,r++)for(let x=hx-8+(r%2)*3;x<hx+72;x+=6){g.beginPath();g.arc(x,y,3,0,Math.PI);g.stroke()}g.restore();
    g.beginPath();g.moveTo(hx-6,hy-40);g.lineTo(hx+70,hy-40);g.strokeStyle=shade(th.roof,0.35);g.lineWidth=1.2;g.stroke();
    g.beginPath();g.moveTo(hx+24,hy);g.lineTo(hx+24,hy-20);g.arc(hx+32,hy-20,8,Math.PI,0);g.lineTo(hx+40,hy);g.closePath();fs(g,grad(g,0,hy-28,0,hy,['#8a5a32','#4a2a14']));
    g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=0.5;for(const x of [28,32,36]){g.beginPath();g.moveTo(hx+x,hy-25);g.lineTo(hx+x,hy);g.stroke()}
    ell(g,hx+37,hy-12,0.9,0.9);g.fillStyle='#ffd040';g.fill();
    for(const wx of [hx+10,hx+45]){g.fillStyle=rgrad(g,wx+4.5,hy-29.5,14,['rgba(255,220,120,.4)','rgba(255,220,120,0)']);g.fillRect(wx-10,hy-44,29,29);
      rrect(g,wx,hy-34,9,9,1);fs(g,rgrad(g,wx+4.5,hy-29.5,7,['#fff6c0','#ffc050']));
      g.beginPath();g.moveTo(wx+4.5,hy-34);g.lineTo(wx+4.5,hy-25);g.moveTo(wx,hy-29.5);g.lineTo(wx+9,hy-29.5);g.strokeStyle=OUT;g.lineWidth=0.6;g.stroke()}
  }
}
function drawPlayer(){
  if(P.hidden)return;if(P.inv>0&&Math.floor(frameN/3)%2)return;
  let pose='stand';
  if(state==='dying'||(!P.on&&state!=='flag'))pose='jump';else if(P.skid)pose='skid';else if(Math.abs(P.vx)>0.1)pose='walk';
  inBox(P.x,P.y,P.w,P.h,P.face,state==='dying'&&P.freeze<999,P.size?1.4:0.92,g=>drawHero(g,pose,P.anim*Math.PI/2,frameN,P.size===2?PAL_LEAF:PAL_HERO));
}
function drawEnemies(){
  for(const e of enemies){if(!e.active)continue;const face=e.vx>0?1:-1,flip=e.state==='flip';
    if(e.type==='beetle')inBox(e.x,e.y,e.w,e.h,face,flip,1,g=>drawBeetle(g,frameN,e.state==='flat'));
    else if(e.type==='snail'){
      if(e.state==='walk')inBox(e.x,e.y,e.w,e.h,face,flip,1,g=>drawSnail(g,frameN));
      // a resting shell twitches before the snail climbs back out
      else inBox(e.x,e.y,e.w,e.h,1,flip,1,g=>{if(e.state==='shell'&&e.t<100&&Math.floor(frameN/4)%2){ell(g,0,-1,6,1.8);fs(g,'#8ad060')}drawShell(g,e.state==='kicked'?e.x*0.25:0)});
    }
    else inBox(e.x,e.y,e.w,e.h,face,flip,1,g=>drawSpiky(g,frameN));
  }
}
function drawItems(behind){
  for(const it of items){if((it.rise>0)!==behind)continue;inBox(it.x,it.y,it.w,it.h,1,false,1,g=>it.type==='berry'?drawBerry(g):drawFlower(g,frameN))}
}
function drawFx(){
  const g=ctx;
  for(const f of leaves)inBox(f.x,f.y,f.w,3,f.vx<0?-1:1,false,1.1,g=>drawLeaf(g,f.t));
  for(const p of parts){
    if(p.k==='debris'){const th=THEMES[L.theme];g.save();g.translate(p.x+3-camX,p.y+3);g.rotate(p.t*0.2*Math.sign(p.vx||1));
      rrect(g,-3,-2.5,6,5,1);fs(g,grad(g,0,-2.5,0,2.5,[th.brickLight,th.brick]),th.mortar,0.5);g.restore()}
    else if(p.k==='gem')drawGem(g,p.x+4-camX,p.y+6,frameN*0.4);
    else if(p.k==='puff'){const r=(12-p.t)*0.8+2;ell(g,p.x-camX,p.y,r,r);g.fillStyle=`rgba(255,230,170,${p.t/10*0.8})`;g.fill()}
    else if(p.k==='txt')txt(p.text,p.x,p.y,'#fff','left',8);
  }
}
function drawHUD(){
  const g=ctx;rrect(g,4,4,W-8,27,7);g.fillStyle='rgba(14,8,32,.42)';g.fill();
  const lab=(s,x)=>txt(s,x,7,'#d8d0f0','left',6.5);
  lab('SCORE',12);txt(String(score).padStart(6,'0'),12,15,'#fff','left',10);
  drawGem(g,94,18,frameN*0.06,1.3);txt('×'+String(gems).padStart(2,'0'),102,12,'#fff','left',11);
  drawAt(150,27,0.72,c=>drawHero(c,'stand',0,frameN,P&&P.size===2?PAL_LEAF:PAL_HERO));txt('×'+lives,160,12,'#fff','left',11);
  lab('WORLD',206);txt(L.name,206,15,'#fff','left',10);
  lab('TIME',266);txt(String(time).padStart(3,'0'),266,15,time<60&&frameN%30<15?'#ff7a70':'#fff','left',10);
}
function drawCenterCard(lines){
  const g=ctx;g.fillStyle=rgrad(g,W/2,H/2,220,['#2e2458','#0b0816']);g.fillRect(0,0,W,H);
  for(let i=0;i<30;i++){ell(g,(i*97)%W,(i*57)%H,0.6,0.6);g.fillStyle=`rgba(255,255,255,${0.15+0.3*Math.abs(Math.sin(frameN/50+i))})`;g.fill()}
  lines.forEach(([s,y,col,size])=>txt(s,W/2,y,col||'#fff','center',size||8));
}
function render(){
  fitCanvas();
  ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  if(state==='card'){drawCenterCard([['WORLD '+L.name,78,'#fff',22],[THEMES[L.theme].label,108,'#a59cc8',10]]);
    drawAt(W/2-14,160,1.7,g=>drawHero(g,'walk',frameN*0.15,frameN,PAL_HERO));txt('× '+lives,W/2+4,141,'#f08a3a','left',13);return}
  if(state==='over'){drawCenterCard([['GAME OVER',86,'#ff7a70',24],['SCORE '+score,124,'#fff',10],['BEST '+best,140,'#a59cc8',9],[frameN%60<40?'PRESS ENTER':'',172,'#f08a3a',9]]);return}
  if(state==='win'){drawCenterCard([['YOU MADE IT HOME!',58,'#ffe05a',20],['All three worlds cleared.',90,'#fff',10],['SCORE '+score,112,'#fff',10],['BEST '+best,128,'#a59cc8',9],[frameN%60<40?'PRESS ENTER':'',206,'#f08a3a',9]]);
    const hop=Math.abs(Math.sin(frameN*0.08))*14;drawAt(W/2,186-hop,1.8,g=>drawHero(g,hop>2?'jump':'stand',0,frameN,PAL_HERO));return}
  const sx=camX;camX=Math.round(camX*S)/S;
  drawBG();drawItems(true);drawTiles();drawGoal();drawItems(false);drawEnemies();drawPlayer();drawFx();
  camX=sx;
  if(state==='title'){
    ctx.fillStyle=grad(ctx,0,0,0,H,['rgba(11,8,22,.78)','rgba(11,8,22,.4)']);ctx.fillRect(0,0,W,H);
    txt("DAG'S",W/2,22,'#ffe05a','center',18);txt('DASH',W/2,40,grad(ctx,0,44,0,84,['#ffd27a','#f08a3a','#c84a1a']),'center',42);
    txt('A little Norwegian man, three worlds, one long run home.',W/2,92,'#fff','center',9);
    if(saved){
      const blink=frameN%60<40,opts=['CONTINUE '+LEVELS[saved.level]().name,'NEW GAME'];
      opts.forEach((s,i)=>{const on=i===titleSel;txt(on&&blink?'› '+s+' ‹':s,W/2+(i?66:-66),114,on?'#ffe05a':'#8a82aa','center',10)});
      txt('LEFT / RIGHT TO CHOOSE,  ENTER TO START',W/2,131,'#a59cc8','center',7);
    }else if(frameN%60<40)txt('PRESS ENTER  OR  TAP TO START',W/2,118,'#fff','center',10);
    txt('Z JUMP     X RUN / LEAVES     ARROWS MOVE',W/2,150,'#d8d0f0','center',8);
    txt('F FULLSCREEN     M MUSIC     ENTER PAUSE',W/2,163,'#8a82aa','center',7);
    txt('BEST '+String(best).padStart(6,'0'),W/2,180,'#a59cc8','center',8);
    return}
  drawHUD();
  if(paused){ctx.fillStyle='rgba(11,8,22,.7)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,96,'#fff','center',22);txt('ENTER TO RESUME     M MUSIC '+(muted?'OFF':'ON'),W/2,128,'#a59cc8','center',9)}
}

/* ---------- boot ---------- */
toTitle();
let acc=0,last=performance.now(),halted=false;
function frame(t){acc+=Math.min(t-last,100);last=t;if(!halted)while(acc>=1000/60){step();acc-=1000/60}else acc=0;render();requestAnimationFrame(frame)}
// for tests.html: drive the game a frame at a time and read or set its state
const VARS={state:[()=>state,v=>state=v],levelIdx:[()=>levelIdx,v=>levelIdx=v],score:[()=>score,v=>score=v],gems:[()=>gems,v=>gems=v],lives:[()=>lives,v=>lives=v],
  carrySize:[()=>carrySize,v=>carrySize=v],checkpoint:[()=>checkpoint,v=>checkpoint=v],paused:[()=>paused,v=>paused=v],saved:[()=>saved,v=>saved=v],titleSel:[()=>titleSel,v=>titleSel=v],
  flagPhase:[()=>flagPhase,v=>flagPhase=v],flagT:[()=>flagT,v=>flagT=v],dieT:[()=>dieT,v=>dieT=v],P:[()=>P],L:[()=>L],enemies:[()=>enemies,v=>enemies=v],items:[()=>items,v=>items=v],leaves:[()=>leaves,v=>leaves=v]};
window.__pips={drawHero,PAL_HERO,PAL_LEAF,toggleFullscreen,LEVELS,THEMES,SONGS,SOLID,SAVE_KEY,inp,step,render,press,newGame,continueGame,loadSave,saveProgress,clearSave,toTitle,loadLevel,updatePlayer,onIce,kill,tilesFor,bgFor,fitCanvas,scale:()=>S,
  halt(on=true){halted=on},get(k){return VARS[k][0]()},set(o){for(const k in o)VARS[k][1](o[k])}};
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load)document.fonts.load('600 8px Fredoka').catch(()=>{});
cvs.focus();
})();
</script>
