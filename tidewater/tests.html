<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater Tests</title>
<style>
:root{color-scheme:dark;--bg:#0b2532;--panel:#101d25;--ink:#e8eef0;--dim:#93a6ae;--good:#7fc98a;--bad:#e2604f;--line:rgba(220,232,236,.12)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{margin:0 0 4px;font-size:22px}
#summary{margin:0 0 12px;color:var(--dim)}
#summary.pass{color:var(--good)}#summary.fail{color:var(--bad)}
#results{list-style:none;margin:0 0 16px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
#results li{padding:5px 10px;border-top:1px solid var(--line)}
#results li:first-child{border-top:none}
#results .ok::before{content:"✓ ";color:var(--good);font-weight:700}
#results .bad::before{content:"✗ ";color:var(--bad);font-weight:700}
#results .ms{color:var(--dim);font-size:12px;margin-left:6px}
#results pre{margin:4px 0 0 18px;color:#f3a196;white-space:pre-wrap;font-size:12px}
#results .grp{background:rgba(255,255,255,.04);font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
iframe{width:min(1000px,100%);height:640px;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<h1>Tidewater tests</h1>
<p id="summary">Loading the game…</p>
<ul id="results"></ul>
<!-- the real game runs in this frame; tests drive it through its globals and window.__tide -->
<iframe id="game" src="Tidewater.html" title="Game under test"></iframe>
<script>
'use strict';
// ---------------------------------------------------------------- tiny test harness
const tests = [];
let group = '';
const groups = [];
const describe = (name, fn) => groups.push([name, fn]);          // bodies run in declare(), once the map list is known
function declare() { for (const [name, fn] of groups) { group = name; fn(); group = ''; } }
const test = (name, fn) => tests.push({ group, name, fn });
class AssertionError extends Error {}
const assert = (cond, msg = 'assertion failed') => { if (!cond) throw new AssertionError(msg); };
const eq = (got, want, msg = 'values differ') => { if (got !== want) throw new AssertionError(`${msg}: got ${JSON.stringify(got)}, expected ${JSON.stringify(want)}`); };
const deepEq = (got, want, msg = 'values differ') => eq(JSON.stringify(got), JSON.stringify(want), msg);
const throws = (fn, msg = 'expected an error') => { try { fn(); } catch (e) { return; } throw new AssertionError(msg); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const withTimeout = (p, ms, what) => Promise.race([p, wait(ms).then(() => { throw new AssertionError(`${what} took longer than ${ms} ms`); })]);

let W, T;                                   // the game's window and its test API
// tests are declared before the game frame loads, so the map list is read from the game's source up front
let MAPS_SRC = null;
const W_MAPS = () => W ? W.eval('MAPS') : MAPS_SRC;
const G = () => T.G;
const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
const sum = h => RES.reduce((t, r) => t + (h[r] || 0), 0);
const hand = (o = {}) => Object.assign({ wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 }, o);

// A fresh game in the setup phase, nothing on the board. Seat 0 is a person (answered by `auto`), the rest bots.
function fresh({ map = 'classic', players = 3, human = true, headless = true } = {}) {
  W.stopCurrentGame();
  T.setHeadless(headless); T.setAuto(null);
  W.eval("NET.role = 'solo'; ME = 0;");
  const seats = Array.from({ length: players }, (_, i) => i === 0 && human ? { kind: 'local', name: 'You' } : { kind: 'bot', name: 'Bot' + i, diff: 'normal' });
  W.newGame(seats, 'instant', map);
  return G();
}
const P = i => G().players[i];
// answers every question a person would be asked, the simplest legal way
function autoAnswer(over = {}) {
  T.setAuto((kind, a) => {
    if (over[kind]) return over[kind](a);
    if (kind === 'pick') return [...a.legal][0];
    if (kind === 'choose') return a.options[0].value;
    if (kind === 'confirm') return false;
    if (kind === 'plenty') return hand({ wheat: a.k });
    if (kind === 'discard') { const h = hand(), me = T.me; let k = a.k; for (const r of RES) { const n = Math.min(k, me.res[r]); h[r] = n; k -= n; } return h; }
  });
}
// total of each resource across the bank and every hand never changes
function totals() { const t = hand(); for (const r of RES) t[r] = G().bank[r] + G().players.reduce((s, p) => s + p.res[r], 0); return t; }
// a simple path of n roads starting at vertex v (no vertex repeated)
function pathFrom(v, n, avoid = [], ok = () => true) {
  const seen = new Set([v, ...avoid]), edges = [];
  const go = (at) => {
    if (edges.length === n) return true;
    for (const e of G().verts[at].edges) {
      const E = G().edges[e], to = E.a === at ? E.b : E.a;
      if (seen.has(to) || !ok(e)) continue;
      seen.add(to); edges.push(e);
      if (go(to)) return true;
      seen.delete(to); edges.pop();
    }
    return false;
  };
  return go(v) ? edges : null;
}
const otherEnd = (e, v) => { const E = G().edges[e]; return E.a === v ? E.b : E.a; };
// a numbered hex (not the robber's) with every other hex of that number blanked, so production is easy to predict
function soloNumberHex() {
  const g = G(), hi = g.hexes.findIndex((h, i) => h.num && h.res && i !== g.robber), h = g.hexes[hi];
  g.hexes.forEach((x, i) => { if (i !== hi && x.num === h.num) x.num = 0; });
  return { hi, h };
}
// waits for something the game does on its own time
async function until(cond, ms = 3000, what = 'condition') {
  const t0 = performance.now();
  while (!cond()) { if (performance.now() - t0 > ms) throw new AssertionError(`timed out waiting for ${what}`); await wait(1); }
}
const setVar = (name, v) => W.eval(`(v) => { ${name} = v; }`)(v);          // assign one of the game's top-level variables
const SAVE_KEY = 'tidewater_host_save';
// seat `pid` is mid-turn, as if the game loop had opened it
const mainTurn = (pid = 0, rolled = true) => Object.assign(G(), { phase: 'main', cur: pid, turnOpen: true, rolled, turn: 1 });
// runs fn with the game's Math.random replaced by a fixed sequence
async function withRandom(vals, fn) {
  const real = W.Math.random; let i = 0;
  W.Math.random = () => vals[i++ % vals.length];
  try { return await fn(); } finally { W.Math.random = real; }
}
const diceFor = n => { const a = Math.min(6, n - 1), b = n - a; return [(a - 0.5) / 6, (b - 0.5) / 6]; };   // random values that roll n
const edgeBetween = (a, b) => G().edges.findIndex(E => (E.a === a && E.b === b) || (E.a === b && E.b === a));
const vertsOf = (v, path) => { const out = [v]; for (const e of path) out.push(otherEnd(e, out.at(-1))); return out; };
const logHas = text => G().logLines.some(e => (typeof e === 'string' ? e : e.h + e.ph).includes(text));
// a corner touching two producing tiles with different resources; both get number 9 and no other tile does
function twoHexCorner() {
  const g = G();
  for (let v = 0; v < g.verts.length; v++) {
    const hs = g.verts[v].hexes.filter(h => g.hexes[h].res && h !== g.robber);
    for (const a of hs) for (const b of hs) if (g.hexes[a].res !== g.hexes[b].res) {
      g.hexes.forEach(x => { if (x.num === 9) x.num = 3; });
      g.hexes[a].num = g.hexes[b].num = 9;
      return { v, A: g.hexes[a], B: g.hexes[b] };
    }
  }
  throw new AssertionError('no corner with two different resources');
}
// every seat is a person at this screen (answered by `auto`); returns once setup is done and the first turn is open
async function humansAtMain(n = 3, map = 'classic') {
  fresh(); autoAnswer();
  W.startGame(Array.from({ length: n }, (_, i) => ({ kind: 'local', name: 'P' + i })), 'instant', map);
  await until(() => G().phase === 'main' && G().turnOpen, 3000, 'setup to finish');
  return G();
}
// a bot (seat 1) whose only possible goal is a city: one settlement, no roads left, no cards in the deck, no ports
function cityBot(diff = 'normal') {
  fresh(); const p = P(1);
  p.diff = diff; W.placeSettlement(p, 10); p.roadsLeft = 0; G().deck = []; G().verts.forEach(V => V.port = null);
  return p;
}

// ---- stand-ins for PeerJS, so hosting and joining can be tested without a network
function fakeConn({ lite = false } = {}) {
  return {
    open: true, sent: [], states: 0, h: {},
    send(m) { if (m.t === 'state') { this.states++; if (lite) return; } this.sent.push(JSON.parse(JSON.stringify(m))); },
    close() { this.open = false; }, on(e, f) { this.h[e] = f; },
    of(t) { return this.sent.filter(m => m.t === t); },
  };
}
function fakePeer() {
  const made = [];
  W.Peer = class {
    constructor(id) { this.id = id; this.h = {}; this.open = false; this.conns = []; made.push(this); }
    on(e, f) { this.h[e] = f; } emit(e, v) { if (this.h[e]) this.h[e](v); }
    destroy() { this.destroyed = true; } reconnect() { }
    connect(to) { const c = fakeConn(); c.open = false; c.to = to; this.conns.push(c); return c; }
  };
  return made;
}
// this screen hosts room TEST; the seats after the host's are 'open', 'closed' or 'bot-<difficulty>'
function hostRoom(kinds = ['open', 'open', 'open']) {
  fresh(); W.closeModal(); autoAnswer();
  const H = T.Host; H.conns.clear(); H.reqs.clear(); H.inGame = false; H.room = 'TEST'; H.attempts = 0;
  setVar('LOBBY', { seats: [{ kind: 'host', name: 'Hana' }, ...kinds.map(k => k.startsWith('bot') ? { kind: 'bot', diff: k.slice(4) } : { kind: k })], speed: 'instant', map: 'classic', win: 10, limit: 7 });
  W.eval("NET.role = 'host'");
  return H;
}
const lobby = () => W.eval('LOBBY');
const VER = () => ({ v: T.GAME_VERSION, b: T.BUILD });       // what an up-to-date copy of the game says about itself
const join = (cid, name, extra = {}, c = fakeConn()) => { T.Host.onMsg(c, { t: 'hello', ...VER(), cid, name, ...extra }); return c; };
function closeRoom() { W.stopCurrentGame(); T.Host.shutdown(); T.Host.clearSave(); T.Host.attempts = 0; T.setAuto(null); }

// ---------------------------------------------------------------- boards
describe('Boards', () => {
  test('every map parses into the expected number of land and water tiles', () => {
    for (const [id, m] of Object.entries(W.eval('MAPS'))) {
      const chars = m.rows.join('');
      const land = [...chars].filter(c => c !== '.' && c !== ' ' && c !== '~').length, water = [...chars].filter(c => c === '~').length;
      const b = W.genBoard(id);
      eq(b.hexes.length, land, `${id} land tiles`); eq(b.water.length, water, `${id} water tiles`); eq(b.map, id, `${id} id`);
    }
  });
  test('every map has a name, a description and a desert for the robber', () => {
    const MAPS = W.eval('MAPS'), ids = Object.keys(MAPS);
    assert(ids.filter(id => !MAPS[id].sea).length >= 10, 'at least 10 base boards'); assert(ids.filter(id => MAPS[id].sea).length >= 8, 'at least 8 Seafarers boards');
    eq(new Set(ids.map(id => MAPS[id].name)).size, ids.length, 'names are unique');
    for (const id of ids) {
      const m = MAPS[id], free = m.rows.join('').split('?').length - 1;
      assert(m.name && m.desc.length > 20, `${id}: named and described`);
      if (m.bag) { eq(m.bag.length, free, `${id}: one terrain in the bag per random tile`); assert([...m.bag].every(c => 'FHPGM'.includes(c)), `${id}: the bag only holds resource terrain`); }
      for (let k = 0; k < 20; k++) { const b = W.genBoard(id); assert(b.robber >= 0 && b.hexes[b.robber].ter === 'desert', `${id}: the robber starts on a desert`); assert(b.hexes.every(h => h.ter in W.eval('TER')), `${id}: every tile has terrain`); }
    }
  });
  test('unknown map ids fall back to the classic board', () => {
    const b = W.genBoard('atlantis'); eq(b.map, 'classic'); eq(b.hexes.length, 19);
  });
  test('classic board has the standard terrain, tokens and graph', () => {
    for (let k = 0; k < 20; k++) {
      const b = W.genBoard('classic'), count = {};
      b.hexes.forEach(h => count[h.ter] = (count[h.ter] || 0) + 1);
      deepEq(Object.keys(count).sort().map(k => k + ':' + count[k]), ['desert:1', 'fields:4', 'forest:4', 'hills:3', 'mountains:3', 'pasture:4'], 'terrain mix');
      deepEq(b.hexes.map(h => h.num).filter(Boolean).sort((a, c) => a - c), [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12], 'number tokens');
      eq(b.verts.length, 54, 'vertices'); eq(b.edges.length, 72, 'edges'); eq(b.ports.length, 9, 'ports');
    }
  });
  test('fixed-terrain maps keep their terrain (United States)', () => {
    const rows = W.eval('MAPS').states.rows, letters = rows.join('').replace(/[.~ ]/g, '');
    const L = W.eval('LAND');
    const b = W.genBoard('states');
    deepEq(b.hexes.map(h => h.ter), [...letters].map(c => L[c]), 'terrain follows the map rows');
  });
  for (const id of Object.keys(W_MAPS()).filter(id => !W_MAPS()[id].sea)) test(`${id}: 100 random boards are all legal`, () => {
    for (let k = 0; k < 100; k++) {
      const b = W.genBoard(id);
      assert(b.robber >= 0 && b.hexes[b.robber].ter === 'desert', 'robber starts on a desert');
      for (const h of b.hexes) {
        if (h.ter === 'desert') { eq(h.num, 0, 'desert has no number'); eq(h.res, null, 'desert has no resource'); }
        else assert(h.num >= 2 && h.num <= 12 && h.num !== 7, `bad number ${h.num}`);
      }
      const hot = b.hexes.map((h, i) => [6, 8].includes(h.num) ? i : -1).filter(i => i >= 0);
      for (const i of hot) for (const j of hot) if (i < j) assert(b.hexes[i].verts.filter(v => b.hexes[j].verts.includes(v)).length < 2, '6 and 8 tiles never touch');
      assert(b.ports.length >= 9, 'at least 9 ports');
      const pv = b.ports.flatMap(p => [b.edges[p.edge].a, b.edges[p.edge].b]);
      eq(new Set(pv).size, pv.length, 'no two ports share a corner');
      for (const p of b.ports) { eq(b.edges[p.edge].hexes.length, 1, 'ports sit on the coast'); eq(b.verts[b.edges[p.edge].a].port, p.type, 'port marks its corners'); }
      for (const V of b.verts) { assert(V.adj.length >= 2 && V.adj.length <= 3, 'corner has 2-3 neighbours'); assert(V.hexes.length >= 1 && V.hexes.length <= 3, 'corner touches 1-3 tiles'); }
      const xs = [...b.hexes, ...b.water].map(t => t.x), ys = [...b.hexes, ...b.water].map(t => t.y);
      assert(Math.abs(Math.min(...xs) + Math.max(...xs)) < 1e-9 && Math.abs(Math.min(...ys) + Math.max(...ys)) < 1e-9, 'board is centred');
    }
  });
  test('the bank grows with bigger maps', () => {
    eq(fresh({ map: 'classic' }).bank.wood, 19);
    eq(fresh({ map: 'states' }).bank.wood, Math.max(19, Math.round(G().hexes.length * 0.75)));
  });
});

// ---------------------------------------------------------------- building rules
describe('Building rules', () => {
  test('the distance rule blocks a corner and its neighbours', () => {
    fresh(); const v = 10;
    W.placeSettlement(P(0), v);
    const legal = W.legalSettlements(P(1), true);
    assert(!legal.includes(v), 'occupied corner'); for (const a of G().verts[v].adj) assert(!legal.includes(a), 'neighbouring corner');
    eq(P(0).settLeft, 4, 'settlement used up');
  });
  test('outside setup, settlements need one of your roads', () => {
    fresh(); const v = 10;
    W.placeSettlement(P(0), v);
    eq(W.legalSettlements(P(0)).length, 0, 'no roads yet');
    const path = pathFrom(v, 2); path.forEach(e => W.placeRoad(P(0), e));
    const end = otherEnd(path[1], otherEnd(path[0], v));
    assert(W.legalSettlements(P(0)).includes(end), 'two roads out is a legal spot');
  });
  test('roads connect to your network and stop at an opponent\'s building', () => {
    fresh(); const v = 10, [e1] = pathFrom(v, 1), b = otherEnd(e1, v);
    W.placeSettlement(P(0), v);
    for (const e of G().verts[v].edges) assert(W.legalRoads(P(0)).includes(e), 'every road out of your settlement');
    W.placeRoad(P(0), e1); W.placeSettlement(P(1), b);
    for (const e of G().verts[b].edges) if (e !== e1) assert(!W.legalRoads(P(0)).includes(e), 'cannot build through an opponent');
  });
  test('cities replace settlements', () => {
    fresh(); W.placeSettlement(P(0), 10); W.placeCity(P(0), 10);
    assert(G().verts[10].city, 'is a city'); eq(P(0).cityLeft, 3); eq(P(0).settLeft, 5, 'settlement piece comes back'); eq(T.vp(P(0)), 2);
    deepEq(W.legalCities(P(0)), [], 'cannot upgrade twice');
  });
  test('running out of pieces stops building', () => {
    fresh(); W.placeSettlement(P(0), 10); P(0).roadsLeft = 0; P(0).settLeft = 0; P(0).cityLeft = 0;
    deepEq(W.legalRoads(P(0)), []); deepEq(W.legalSettlements(P(0), true), []); deepEq(W.legalCities(P(0)), []);
  });
});

// ---------------------------------------------------------------- longest road / largest army / points
describe('Awards and points', () => {
  test('five roads in a row earn Longest Road, and a rival settlement can break it', () => {
    fresh(); G().phase = 'main';
    const v = 10, path = pathFrom(v, 5);
    assert(path, 'found a path'); W.placeSettlement(P(0), v);
    path.slice(0, 4).forEach(e => W.placeRoad(P(0), e));
    eq(G().longest, -1, 'four roads is not enough'); eq(T.roadLength(0), 4);
    W.placeRoad(P(0), path[4]);
    eq(G().longest, 0, 'five roads wins it'); eq(T.roadLength(0), 5);
    let at = v; for (const e of path.slice(0, 2)) at = otherEnd(e, at);     // middle of the road
    W.placeSettlement(P(1), at);
    eq(G().longest, -1, 'road is cut in two'); assert(T.roadLength(0) < 5, 'shorter now');
  });
  test('Largest Army needs 3 knights and more than the holder', () => {
    fresh();
    P(0).knights = 2; W.updateArmy(P(0)); eq(G().army, -1);
    P(0).knights = 3; W.updateArmy(P(0)); eq(G().army, 0);
    P(1).knights = 3; W.updateArmy(P(1)); eq(G().army, 0, 'a tie keeps the holder');
    P(1).knights = 4; W.updateArmy(P(1)); eq(G().army, 1);
  });
  test('points: settlements, cities, awards and hidden VP cards', () => {
    fresh(); W.placeSettlement(P(0), 10); W.placeSettlement(P(0), 30); W.placeCity(P(0), 30);
    G().longest = 0; G().army = 0; P(0).devs.push({ type: 'vp', bought: -1 });
    eq(T.vp(P(0)), 1 + 2 + 2 + 2 + 1); eq(T.vp(P(0), false), 7, 'VP cards are hidden from others');
  });
  test('reaching 10 points ends the game', () => {
    fresh(); G().phase = 'main';
    P(1).devs = Array.from({ length: 9 }, () => ({ type: 'vp', bought: -1 }));
    assert(!W.checkWin(P(1)), '9 points'); P(1).devs.push({ type: 'vp', bought: -1 });
    assert(W.checkWin(P(1)), '10 points'); assert(G().over); eq(G().winner, 1);
  });
});

// ---------------------------------------------------------------- house rules
describe('House rules', () => {
  const withRules = (rules, opts = {}) => { const g = fresh(opts); W.stopCurrentGame(); W.newGame(g.players.map((p, i) => i === 0 ? { kind: 'local', name: 'You' } : { kind: 'bot', name: p.name, diff: 'normal' }), 'instant', opts.map || 'classic', rules); return G(); };
  test('defaults are 10 points to win and a 7-card hand limit', () => {
    const g = fresh(); eq(g.win, 10); eq(g.handLimit, 7);
    deepEq(W.eval('cleanRules')({}), { win: 10, limit: 7 });
    deepEq(W.eval('cleanRules')({ win: 99, limit: -3 }), { win: 10, limit: 7 }, 'junk falls back to defaults');
    deepEq(W.eval('cleanRules')({ win: '8', limit: '10' }), { win: 8, limit: 10 }, 'values from a <select> are accepted');
    deepEq(W.eval('cleanRules')({ win: 6, limit: 4 }), { win: 10, limit: 7 }, 'below the ranges falls back to defaults');
    deepEq(W.eval('cleanRules')({ win: 16, limit: 11 }), { win: 10, limit: 7 }, 'above the ranges falls back to defaults');
    deepEq(W.eval('cleanRules')({ win: 15, limit: 0 }), { win: 15, limit: 7 }, 'there is no "no limit" option');
  });
  test('the game is won at the chosen points', () => {
    withRules({ win: 7 }); G().phase = 'main';
    P(1).devs = Array.from({ length: 6 }, () => ({ type: 'vp', bought: -1 }));
    assert(!W.checkWin(P(1)), '6 of 7'); P(1).devs.push({ type: 'vp', bought: -1 });
    assert(W.checkWin(P(1)), '7 of 7');
  });
  test('a higher target keeps the game going past 10', () => {
    withRules({ win: 15 }); G().phase = 'main';
    P(1).devs = Array.from({ length: 14 }, () => ({ type: 'vp', bought: -1 }));
    assert(!W.checkWin(P(1)), '14 of 15');
  });
  test('a raised hand limit lets bigger hands keep their cards', async () => {
    withRules({ limit: 10 }); G().phase = 'main'; autoAnswer({ pick: a => [...a.legal].find(h => G().hexes[h].verts.every(v => G().verts[v].owner < 0)) });
    P(1).res = hand({ wheat: 10 }); P(2).res = hand({ ore: 11 });
    await W.handleSeven(P(0));
    eq(sum(P(1).res), 10, '10 cards is within a 10-card limit'); eq(sum(P(2).res), 6, '11 cards discards 5');
  });
  test('a lowered hand limit makes smaller hands discard', async () => {
    withRules({ limit: 5 }); G().phase = 'main'; autoAnswer({ pick: a => [...a.legal].find(h => G().hexes[h].verts.every(v => G().verts[v].owner < 0)) });
    P(1).res = hand({ wheat: 5 }); P(2).res = hand({ ore: 6 });
    await W.handleSeven(P(0));
    eq(sum(P(1).res), 5, '5 cards is within a 5-card limit'); eq(sum(P(2).res), 3, '6 cards discards 3');
  });
  test('rules are part of the shared game state and survive a save', () => {
    withRules({ win: 8, limit: 9 });
    eq(W.viewFor(1).win, 8); eq(W.viewFor(1).handLimit, 9);
    const back = T.decodeSave(T.encodeSave({ v: 1, room: 'ABCD', lobby: { seats: [] }, me: 0, at: 1, g: G() }));
    eq(back.g.win, 8); eq(back.g.handLimit, 9);
  });
  test('bot games finish with custom rules', async () => {
    for (const rules of [{ win: 7, limit: 5 }, { win: 15, limit: 10 }]) {
      fresh({ human: false });
      const seats = ['normal', 'hard', 'hard'].map((d, i) => ({ kind: 'bot', name: 'Bot' + i, diff: d }));

// ---------------------------------------------------------------- versions
describe('Versions', () => {
  test('versions compare part by part as numbers', () => {
    const cmp = W.eval('compareVersions'), sign = (a, b) => Math.sign(cmp(a, b));
    eq(sign('2026.10.9', '2026.10.14'), -1, 'the 9th comes before the 14th, unlike comparing text');
    eq(sign('2026.10.14', '2026.10.9'), 1);
    eq(sign('2026.9.30', '2026.10.1'), -1, 'months are numbers too');
    eq(sign('2027.1.1', '2026.12.31'), 1);
    eq(sign('2026.10.14', '2026.10.14'), 0);
    eq(sign('2026.10', '2026.10.0'), 0, 'a missing part counts as zero');
    eq(sign('2026.10', '2026.10.1'), -1);
    eq(sign('', '2026.10.14'), -1, 'no version is older than any version'); eq(sign(undefined, '1'), -1);
    eq(sign('2026.10.14', ''), 1); eq(sign('', undefined), 0);
    eq(sign('abc', '1'), -1, 'junk counts as zero rather than throwing');
  });
  test('labels and messages name both copies', () => {
    const label = W.eval('versionLabel'), why = W.eval('versionMismatchText');
    eq(label('2026.10.14', 'k3x9'), 'version 2026.10.14 (build k3x9)');
    eq(label('2026.10.14', ''), 'version 2026.10.14');
    eq(label('', ''), 'an older version without a version number');
    const older = why('2026.10.9', 'aa', '2026.10.14', 'bb');
    assert(older.startsWith('Your copy of Tidewater is out of date.') && older.includes('You have version 2026.10.9 (build aa); the host has version 2026.10.14 (build bb).'), older);
    assert(why('2026.10.14', 'aa', '2026.10.9', 'bb').startsWith('The host\'s copy of Tidewater is out of date.'));
    assert(why('2026.10.14', 'aa', '2026.10.14', 'bb').startsWith('Your copy of Tidewater doesn\'t match the host\'s.'), 'same name, different code');
    assert(why('', '', '2026.10.14', 'bb').includes('You have an older version without a version number'));
  });
  test('only the same version and build count as a match', () => {
    const same = W.eval('sameVersion');
    assert(same(VER())); assert(!same({ ...VER(), b: T.BUILD + 'x' })); assert(!same({ ...VER(), v: '2000.1.1' }));
    assert(!same({})); assert(!same(null)); assert(!same(undefined));
  });
});

// A Seafarers game in the main phase. Everyone counts the home island as already settled, so only other islands pay a bonus.
function seaGame(map = 'shores', opts = {}) {
  const g = fresh({ map, ...opts }); g.phase = 'main';
  if (g.homeIsle >= 0) g.players.forEach(p => p.isles = [g.homeIsle]);
  return g;
}
const isSea = e => G().edges[e].sea > 0, isLand = e => G().edges[e].hexes.length > 0;
const isleAt = v => { const h = G().verts[v].hexes[0]; return h === undefined ? -1 : G().hexes[h].isle; };
// a cape: a corner with one land tile and open water on the other two sides (two shoreline edges and one out to sea)
const cape = (isle = G().homeIsle, not = []) => G().verts.findIndex((V, v) => V.hexes.length === 1 && V.edges.length === 3 && (isle < 0 || isleAt(v) === isle) && !not.includes(v) && V.adj.every(a => !not.includes(a)));
const shoreEdges = v => G().verts[v].edges.filter(e => isSea(e) && isLand(e)), openEdge = v => G().verts[v].edges.find(e => !isLand(e));
const seaPath = (v, n) => pathFrom(v, n, [], e => !isLand(e));           // out over open water
const sorted = a => [...a].sort((x, y) => x - y);
// the pirate starts on a random sea tile; park it where it cannot touch these corners (it blocks ships beside it)
const pirateAway = vs => { G().pirate = G().water.findIndex(w => w.verts.every(v => !vs.includes(v))); };

  test('base boards have no sailing, Seafarers boards put the water on the map', () => {

      if (!m.sea) { eq(b.pirate, -1); eq(b.homeIsle, -1); assert(b.edges.every(E => E.sea === 0 && !E.ship) && b.water.every(w => !w.verts), `${id}: no sea edges`); continue; }
      assert(b.water.every(w => w.verts.length === 6 && w.edges.length === 6), `${id}: every water tile has corners and sides`);
      for (const E of b.edges) { const n = E.hexes.length + E.sea; assert(n >= 1 && n <= 2, `${id}: an edge lies between at most two tiles`); eq(E.owner, -1); }
      assert(b.edges.some(E => !E.hexes.length) && b.edges.some(E => !E.sea && E.hexes.length === 2) && b.edges.some(E => E.sea && E.hexes.length), `${id}: open sea, inland and shoreline edges`);
      eq(b.edges.filter(E => E.sea).length, new Set(b.water.flatMap(w => w.edges)).size, `${id}: sea edges are exactly the sides of water tiles`);
      assert(b.verts.some(V => !V.hexes.length), `${id}: some corners are out at sea`);
    }

      $('sM').value = 'states'; $('sM').onchange(); drawnProperly(c, 'states');
      eq($('sPrevNote').textContent, 'Terrain is fixed; numbers and ports are shuffled each game');
      $('sG').value = 'sea'; $('sG').onchange(); drawnProperly(c, 'shores'); assert(c._board.sea);
      $('sM').value = 'lagoon'; $('sM').onchange(); drawnProperly(c, 'lagoon');
      const before = c._board; $('sPrevAgain').click(); drawnProperly(c, 'lagoon'); assert(c._board !== before, 'Another layout draws a fresh sample');
      assert(G() === g && !g.preview, 'previewing never touches the game in progress');
    } finally { ls.removeItem('tidewater_cfg'); W.closeModal(); }
  });
  test('host lobby: the preview follows the host\'s choice', async () => {
    const made = fakePeer();
    try {
      fresh({ headless: false }); W.closeModal(); await W.startHosting();
      drawnProperly($('hPrev'), 'classic');
      $('hMap').value = 'grand'; $('hMap').onchange({ target: $('hMap') }); drawnProperly($('hPrev'), 'grand');
      $('hGame').value = 'sea'; $('hGame').onchange(); drawnProperly($('hPrev'), 'shores');
      const before = $('hPrev')._board; $('hPrevAgain').click(); assert($('hPrev')._board !== before);
      join('c1', 'Zed'); drawnProperly($('hPrev'), 'shores');
    } finally { closeRoom(); delete W.Peer; W.closeModal(); }
  });
  test('friends see the board too, and it does not reshuffle on every update', () => {
    const C = T.Client, lobbyMsg = map => ({ t: 'lobby', ...VER(), room: 'ABCD', you: 1, map, rules: { win: 10, limit: 7 }, seats: [{ kind: 'host', name: 'Hana', color: '#f00', online: true }, { kind: 'player', name: 'Zed', color: '#0f0', online: true }] });
    try {
      fresh({ headless: false }); W.closeModal(); W.eval("NET.role = 'client'"); C.preview = null;
      C.onMsg(lobbyMsg('crossroads')); const first = drawnProperly($('cPrev'), 'crossroads');
      C.onMsg(lobbyMsg('crossroads')); C.onMsg(lobbyMsg('crossroads'));
      eq(drawnProperly($('cPrev'), 'crossroads'), first, 'the same sample while the host changes nothing');
      $('cPrevAgain').click(); assert($('cPrev')._board !== first, 'unless they ask for another');
      C.onMsg(lobbyMsg('archipelago')); drawnProperly($('cPrev'), 'archipelago');
      C.onMsg(lobbyMsg('atlantis')); eq($('cPrev'), null, 'no preview for a board this copy of the game does not know');
    } finally { C.preview = null; W.closeModal(); fresh(); }
  });
});

// ---------------------------------------------------------------- whole games
function checkFinished(map) {
  const g = G(); assert(g.over, `${map}: game finished`);
  assert(T.vp(g.players[g.winner]) >= g.win, `winner has ${g.win}+ points`);
  const bankN = Math.max(19, Math.round(g.hexes.length * 0.75));
  for (const r of RES) eq(totals()[r], bankN, `${map}: every ${r} card accounted for`);
  for (const p of g.players) {
    for (const r of RES) assert(p.res[r] >= 0, 'no negative hands');
    const mine = g.verts.filter(V => V.owner === p.id);
    eq(mine.filter(V => !V.city).length, 5 - p.settLeft, 'settlement pieces match the board');
    eq(mine.filter(V => V.city).length, 4 - p.cityLeft, 'city pieces match the board');
    eq(g.edges.filter(E => E.owner === p.id && !E.ship).length, 15 - p.roadsLeft, 'road pieces match the board');
    eq(g.edges.filter(E => E.owner === p.id && E.ship).length, 15 - p.shipsLeft, 'ship pieces match the board');
    assert(mine.length >= 2, 'everyone placed 2 settlements in setup');
  }
}
describe('Full games', () => {
  for (const map of Object.keys(W_MAPS())) test(`${map}: four bots play a game to the end`, async () => {
    for (let k = 0; k < 2; k++) {
      fresh({ map, players: 4, human: false });
      const seats = ['easy', 'normal', 'hard', 'hard'].map((d, i) => ({ kind: 'bot', name: 'Bot' + i, diff: d }));
      await withTimeout(W.startGame(seats, 'instant', map, { win: W_MAPS()[map].win || 10 }), 30000, 'game');
      checkFinished(map);
    }
  });
  test('a person who only rolls and ends turns can play a whole game', async () => {
    fresh(); autoAnswer();
    const seats = [{ kind: 'local', name: 'You' }, { kind: 'bot', name: 'Ada', diff: 'normal' }, { kind: 'bot', name: 'Bram', diff: 'hard' }];
    const drive = setInterval(() => {
      const g = G(); if (!g || g.over || g.cur !== 0 || g.phase !== 'main' || !g.turnOpen || g.busy) return;
      T.doAction(0, g.rolled ? 'end' : 'roll');
    }, 1);
    try { await withTimeout(W.startGame(seats, 'instant', 'classic'), 60000, 'game'); } finally { clearInterval(drive); }
    checkFinished('classic');
  });
  test('actions out of turn are refused', async () => {
    fresh(); G().phase = 'main'; G().cur = 1;
    eq((await T.doAction(0, 'roll')).err, 'not your turn');
  });
});

// ---------------------------------------------------------------- runner
async function loadMapList() {
  const src = await (await fetch('Tidewater.html', { cache: 'no-store' })).text();
  const start = src.indexOf('const MAPS = {'), end = src.indexOf('\n};', start);
  MAPS_SRC = Function(`'use strict'; return ${src.slice(start + 'const MAPS = '.length, end + 3)}`)();
}
async function run() {
  const frame = document.getElementById('game');
  try {
    await new Promise((res, rej) => { const t = setTimeout(() => rej(new Error('game did not load')), 15000); const ok = () => { try { if (frame.contentWindow.__tide) { clearTimeout(t); res(); return; } } catch (e) { clearTimeout(t); rej(e); return; } setTimeout(ok, 50); }; ok(); });
  } catch (e) {
    const s = document.getElementById('summary'); s.className = 'fail';
    s.textContent = location.protocol === 'file:' ? 'Open this page through a local web server (python run_tests.py does it for you); browsers block tests from reaching into a file:// frame.' : 'Could not load the game: ' + e.message;
    report([{ name: 'load game', ok: false, err: s.textContent }]);
    return;
  }
  W = frame.contentWindow; T = W.__tide;
  W.closeModal && W.closeModal();
  const out = [], list = document.getElementById('results');
  let lastGroup = null;
  for (const t of tests) {
    if (t.group !== lastGroup) { lastGroup = t.group; list.insertAdjacentHTML('beforeend', `<li class="grp">${t.group}</li>`); }
    const t0 = performance.now(); let err = null;
    try { await t.fn(); } catch (e) { err = (e && e.stack && !(e instanceof AssertionError) ? e.stack : String(e && e.message || e)); }
    const ms = Math.round(performance.now() - t0);
    out.push({ name: `${t.group} › ${t.name}`, ok: !err, err, ms });
    const li = document.createElement('li'); li.className = err ? 'bad' : 'ok';
    li.textContent = t.name; li.insertAdjacentHTML('beforeend', `<span class="ms">${ms} ms</span>`);
    if (err) { const pre = document.createElement('pre'); pre.textContent = err; li.appendChild(pre); }
    list.appendChild(li);
    document.getElementById('summary').textContent = `Running… ${out.length}/${tests.length}`;
  }
  try { W.stopCurrentGame(); T.setAuto(null); T.setHeadless(false); W.previewBoard(); W.mainMenu(); } catch (e) { }
  const failed = out.filter(r => !r.ok).length, s = document.getElementById('summary');
  s.className = failed ? 'fail' : 'pass';
  s.textContent = failed ? `${failed} of ${out.length} tests failed` : `All ${out.length} tests passed`;
  report(out);
}
// when started by run_tests.py, send the results back to it
function report(results) {
  if (!new URLSearchParams(location.search).has('ci')) return;
  fetch('/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(results) }).catch(() => { });
}
// map-driven tests are declared once the map list is known
loadMapList().then(declare, e => { MAPS_SRC = {}; declare(); console.error(e); }).then(run);
</script>
