<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;
  --sea:#0b2532;--sea2:#123a4b;--panel:#101d25;--panel2:#16272f;--line:rgba(220,232,236,.12);
  --ink:#e8eef0;--dim:#93a6ae;--brass:#d9a441;--brass2:#f0c46a;--bad:#e2604f;--good:#7fc98a;
  --wood:#2f6b3a;--brick:#b5532f;--sheep:#8fc25a;--wheat:#e2b33c;--ore:#7d8794;
  --display:"Alegreya SC",Georgia,"Times New Roman",serif;--body:"Alegreya Sans",ui-sans-serif,system-ui,-apple-system,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
#app{display:grid;grid-template-columns:1fr 360px;height:100%}
#boardWrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#1a5266 0%,#123a4b 45%,#0b2532 100%)}
#stage{position:relative;flex:1;min-height:0}
#board{position:absolute;inset:0;width:100%;height:100%;display:block}
#prompt{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(10,24,31,.88);border:1px solid var(--brass);color:var(--brass2);padding:7px 16px;border-radius:999px;font-weight:700;display:none;align-items:center;gap:12px;white-space:nowrap;max-width:calc(100% - 32px)}
#prompt.on{display:flex}
#prompt button{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink);font-weight:500}
#dice{position:absolute;left:16px;bottom:16px;display:flex;gap:8px}
.die{width:44px;height:44px;background:#f5efe2;border-radius:8px;box-shadow:0 3px 0 #b9ad95,0 6px 14px rgba(0,0,0,.4);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-sizing:border-box}
.die i{width:8px;height:8px;border-radius:50%;background:#2a2622;place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.red i{background:#b0352a}
#dice{perspective:420px;align-items:center}
/* toss lasts ROLL_MS (.9s); faces flicker underneath via animateDice() */
#dice.rolling .die{animation:toss1 .9s cubic-bezier(.3,.6,.5,1)}
#dice.rolling .die.red{animation-name:toss2}
#dice.settle .die{animation:land .32s ease-out}
@keyframes toss1{0%{transform:none}18%{transform:translateY(-38px) rotateX(35deg) rotate(-170deg) scale(1.1)}40%{transform:translateY(-22px) rotateX(-25deg) rotate(-380deg) scale(1.06)}62%{transform:translateY(-2px) rotateX(15deg) rotate(-560deg)}78%{transform:translateY(-12px) rotate(-650deg)}100%{transform:rotate(-720deg)}}
@keyframes toss2{0%{transform:none}22%{transform:translateY(-44px) rotateY(-35deg) rotate(200deg) scale(1.1)}45%{transform:translateY(-20px) rotateY(25deg) rotate(420deg) scale(1.05)}66%{transform:translateY(-1px) rotateY(-12deg) rotate(590deg)}82%{transform:translateY(-9px) rotate(675deg)}100%{transform:rotate(720deg)}}
@keyframes land{0%{transform:scale(1.14)}55%{transform:scale(.93)}100%{transform:none}}
#diceSum{min-width:30px;height:30px;padding:0 8px;box-sizing:border-box;border-radius:999px;background:rgba(10,24,31,.88);border:1px solid var(--brass);color:var(--brass2);font-weight:800;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.6,1)}
#diceSum.on{opacity:1;transform:none}
#diceSum.seven{border-color:var(--bad);color:#f3a196}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font:800 26px/1 var(--display);letter-spacing:.04em;color:var(--brass2)}
.brand button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;color:var(--dim);font-size:13px}
#rules{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;font-size:12px;color:var(--dim)}
#rules span{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
#rules b{color:var(--brass2);font-weight:800}
#handCount{letter-spacing:.06em;margin-left:4px}
#handCount.over{color:#f3a196}
#players{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:7px 10px}
.pl.cur{border-color:var(--brass)}
.pl .sw{width:10px;height:34px;border-radius:3px}
.pl .nm{font-weight:700}
.pl .meta{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.pl .vp{font:800 26px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.pl .vp small{display:block;font:500 10px var(--body);color:var(--dim);letter-spacing:.08em}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 5px;background:rgba(217,164,65,.18);color:var(--brass2)}
.sec{padding:8px 12px;border-top:1px solid var(--line)}
.sec h2{margin:0 0 6px;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
/* hand tray: your cards fanned along the bottom of the table */
#tray{flex:none;height:128px;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:36px;padding:0 24px 10px;box-sizing:border-box;background:linear-gradient(180deg,rgba(8,20,27,0) 0%,rgba(8,20,27,.75) 40%,#08141b 100%);border-top:1px solid var(--line)}
#tray > h2{position:absolute;left:16px;top:10px;margin:0;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#hand,#devs{display:flex;align-items:flex-end;min-height:84px}
#tray .empty{color:var(--dim);font-size:13px;align-self:center}
.hc{--r:0deg;--y:0px;width:58px;height:84px;flex:none;box-sizing:border-box;border-radius:7px;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 10px rgba(0,0,0,.45);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 2px 5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);transform-origin:50% 100%;transform:translateY(var(--y)) rotate(var(--r));transition:transform .15s ease-out}
.hc:hover{transform:translateY(calc(var(--y) - 16px)) rotate(var(--r));z-index:5}
.hc svg{width:30px;height:30px}
.hc .nm{font-size:10px;font-weight:700;letter-spacing:.04em;line-height:1.1;text-align:center}
.hc .ct{position:absolute;top:-9px;left:-7px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#0b1a21;border:1px solid var(--brass);color:var(--brass2);font:800 12px/18px var(--body);text-align:center;text-shadow:none}
.hc.fresh{animation:deal .45s cubic-bezier(.2,.8,.3,1.15) backwards}
@keyframes deal{from{transform:translateY(-70px) rotate(calc(var(--r) - 25deg)) scale(.7);opacity:0}}
button.hc{font:inherit}
.hc.dv{background:linear-gradient(160deg,#3b2e5c,#251c3d);border-color:#9c88d8}
.hc.dv.vpcard{background:linear-gradient(160deg,#5a4818,#3a2e10);border-color:#e0c46a}
.hc.dv:disabled{cursor:default;filter:saturate(.55) brightness(.75)}
.hc.dv:not(:disabled){box-shadow:0 0 0 2px var(--brass2),0 4px 10px rgba(0,0,0,.45)}
.hc.dv .new{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.08em;background:var(--brass);color:#1b1408;border-radius:4px;padding:0 4px;text-shadow:none}
@media (prefers-reduced-motion:reduce){.hc.fresh{animation:none}.hc{transition:none}}
.card{border-radius:6px;padding:6px 0 4px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4);position:relative}
.card b{display:block;font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.card span{font-size:11px;letter-spacing:.04em}
.card.zero{opacity:.35}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.act:hover:not(:disabled){border-color:var(--brass)}
.act:disabled{opacity:.38;cursor:default}
.act .t{font-weight:700}
.act .c{display:flex;gap:3px}
.pip{width:10px;height:10px;border-radius:2px;display:inline-block}
.act.primary{background:var(--brass);color:#1b1408;border-color:var(--brass)}
.act.primary .t{color:#1b1408}
#log{flex:1;min-height:80px;overflow:auto;padding:6px 12px 12px;font-size:13px;color:#c7d3d7;border-top:1px solid var(--line)}
#log p{margin:0 0 4px}
#log b{font-weight:700}
.modalBg{position:fixed;inset:0;background:rgba(4,12,16,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modalBg.on{display:flex}
.mapPrev{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#0e3442;overflow:hidden}
.mapPrev canvas{display:block;width:100%;height:230px}
.mapPrev small{position:absolute;left:8px;bottom:7px;color:#b9c9cf;font-size:11px;text-shadow:0 1px 2px #000}
.mapPrev .btn{position:absolute;right:6px;bottom:6px;font-size:12px;padding:3px 9px}
.modal{background:var(--panel);border:1px solid var(--brass);border-radius:12px;padding:20px 22px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 4px;font:800 24px var(--display);color:var(--brass2)}
.modal p{margin:6px 0 12px;color:#c7d3d7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn.pri{background:var(--brass);color:#1b1408;border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:default}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px}
.step .card{width:100%}
.step .ctl{display:flex;gap:4px}
.step .ctl button{width:28px;height:26px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.setupGrid{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin-top:10px}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.diffHelp{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.5}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{border:2px solid transparent}
.choice button.sel{border-color:#fff}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100%}
  #side{border-left:none;border-top:1px solid var(--line)}
  #log{max-height:220px}
  #boardWrap{min-height:440px}
}
@media (prefers-reduced-motion:reduce){#dice .die{animation:none!important}#diceSum{transition:none}}
/* ---------- multiplayer additions ---------- */
#status{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(10,24,31,.82);border:1px solid var(--line);color:var(--ink);padding:5px 14px;border-radius:999px;font-size:14px;display:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#status.on{display:block}
#prompt.on ~ #status{display:none}
#net{position:absolute;right:16px;bottom:16px;max-width:min(360px,calc(100% - 140px));background:rgba(10,24,31,.92);border:1px solid var(--brass);color:var(--brass2);border-radius:10px;padding:8px 12px;font-size:13px;display:none}
#net.on{display:block}
#net.bad{border-color:var(--bad);color:#f3a196}
.badge.you{background:rgba(127,201,138,.16);color:var(--good)}
.menu{display:grid;gap:8px;margin-top:14px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.big:hover{border-color:var(--brass)}
.big b{font:700 19px/1.1 var(--display);color:var(--brass2)}
.big span{font-size:13px;color:var(--dim)}
input[type=text],textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;width:100%;box-sizing:border-box}
input[type=text]:focus-visible,textarea:focus-visible{outline:2px solid var(--brass2);outline-offset:1px}
textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.share{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px}
.share code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--brass2)}
.share .btn{padding:6px 12px;flex:none}
.code{font:800 32px/1 var(--display);letter-spacing:.18em;color:var(--brass2)}
.seat{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:7px 10px;margin-bottom:6px;min-height:34px}
.seat .sw{width:10px;height:26px;border-radius:3px}
.seat .btn{padding:4px 10px;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--good);vertical-align:1px}
.dot.off{background:var(--bad)}
.note{font-size:13px;color:var(--dim);line-height:1.45}
.note a{color:var(--brass2)}
.resume{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--brass);border-radius:10px;padding:10px 12px;margin-top:12px;background:rgba(217,164,65,.07)}
.resume > div{flex:1;min-width:160px}
.resume .btn{padding:7px 12px}
</style>
</head>
<body>


<div id="app">
  <div id="boardWrap">

    <canvas id="board" aria-label="Game board"></canvas>

    <div id="net" role="status"></div>
   </div>
   <div id="tray" role="region" aria-label="Your hand"><h2>Your hand <span id="handCount"></span></h2><div id="hand"></div><div id="devs"></div></div>
  </div>
  <aside id="side">
    <div class="brand"><h1>Tidewater</h1><button id="newGameBtn">Menu</button></div>
    <div id="rules" aria-label="Game rules"></div>
    <div id="players"></div>
    <div class="sec"><h2>Actions</h2><div id="actions"></div></div>
    <div id="log" aria-live="polite"></div>
  </aside>
</div>
<div class="modalBg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>

const WIN_OPTS = [7, 8, 9, 10, 11, 12, 13, 14, 15], WIN_DEFAULT = 10;

  const r = { wood: 4, brick: 4, sheep: 4, wheat: 4, ore: 4 };
  for (const V of G.verts) if (V.owner === p.id && V.port) { if (V.port === 'any') { for (const k of RES) r[k] = Math.min(r[k], 3); } else r[V.port] = 2; }
  return r;
}
function checkWin(p) {
  if (G.over) return true;
  if (vp(p) >= winPts()) {
    G.over = true; G.winner = p.id; G.wait = null;
    log(`${nm(p)} ${vb(p, 'reach', 'reaches')} ${vp(p)} points and ${vb(p, 'win', 'wins')}!`);
    if (NET.role === 'host') Host.clearSave();
    if (endTurnResolve) endTurn();
    render();
    return true;
  }
  return false;
}

// production
function produce(n) {
  const gains = G.players.map(() => emptyHand());
  const demand = emptyHand();
  G.hexes.forEach((h, hi) => {
    if (h.num !== n || hi === G.robber || !h.res) return;
    for (const v of h.verts) { const V = G.verts[v]; if (V.owner >= 0) { const k = V.city ? 2 : 1; gains[V.owner][h.res] += k; demand[h.res] += k; } }
  });
  for (const r of RES) {
    if (demand[r] <= G.bank[r]) continue;
    const who = gains.filter(g => g[r] > 0);
    if (who.length === 1) who[0][r] = G.bank[r]; else gains.forEach(g => g[r] = 0);
    if (demand[r]) log(`The bank is short of ${RN[r]}.`);
  }
  gains.forEach((g, i) => { for (const r of RES) if (g[r]) give(P(i), r, g[r]); if (sum(g)) log(`${nm(P(i))} ${vb(P(i), 'receive', 'receives')} ${resList(g)}.`); });
}

// Seafarers: a gold field pays any resource the owner chooses (1 per settlement, 2 per city)
async function payGold(n) {
  if (!G.sea) return;
  const due = G.players.map(() => 0);
  G.hexes.forEach((h, hi) => {
    if (h.ter !== 'gold' || h.num !== n || hi === G.robber) return;
    for (const v of h.verts) { const V = G.verts[v]; if (V.owner >= 0) due[V.owner] += V.city ? 2 : 1; }
  });
  const who = G.players.filter(q => due[q.id]);
  if (!who.length) return;
  const waiting = new Set(who.filter(q => !q.bot).map(q => q.id));
  const upd = () => { G.wait = waiting.size ? `Waiting for ${[...waiting].map(i => P(i).name).join(', ')} to choose gold` : null; render(); };
  upd();
  await Promise.all(who.map(async q => {
    const k = Math.min(due[q.id], sum(G.bank));
    const pickd = !k ? emptyHand() : q.bot ? Bot.plentyPick(q, k) : cleanHand(await ask(q.id, 'plenty', { title: 'Gold!', text: `Your gold field pays out. Take any ${k} resource${k > 1 ? 's' : ''} from the bank.`, k }));
    const got = emptyHand(); let left = due[q.id];
    for (const r of RES) { const want = Math.min(pickd[r], left); if (want) { got[r] = give(q, r, want); left -= got[r]; } }
    log(`${nm(q)} ${vb(q, 'take', 'takes')} ${resList(got) || 'nothing'} for gold.`);
    waiting.delete(q.id); upd();
  }));
}

function stealFrom(thief, victim) {
  const pool = []; for (const r of RES) for (let k = 0; k < victim.res[r]; k++) pool.push(r);
  if (!pool.length) return null;
  const r = pool[Math.floor(Math.random() * pool.length)];
  victim.res[r]--; thief.res[r]++;
  const verb = vb(thief, 'steal', 'steals');
  log(`${nm(thief)} ${verb} a card from ${nm(victim)}.`, { to: [thief.id, victim.id], html: `${nm(thief)} ${verb} a ${RN[r]} from ${nm(victim)}.` });
  return r;
}

// =====================================================================  asking players for decisions
// Every human decision goes through ask(). On the host, a remote player's question is sent to their
// browser; everything else (solo play, the host's own seat, a client answering) shows the local UI.
// kinds: pick {kind:'vertex'|'edge'|'hex', legal, text, cancellable} · discard {k} · plenty {title,text,k}
//        choose {title, text, options:[{label, value, color}]} · confirm {title, text, yes, no}
function rawAsk(pid, kind, args) {
  if (NET.role === 'host' && P(pid).remote) return Host.ask(pid, kind, args);
  return localAsk(kind, args);
}
async function ask(pid, kind, args) {
  const gen = G.gen;
  const v = await rawAsk(pid, kind, args);
  if (!G || G.gen !== gen) throw ABORT;
  return v;
}
async function askTimed(pid, kind, args, ms, dflt) {
  const gen = G.gen; let timer;
  const to = new Promise(r => { timer = setTimeout(() => r(TIMEOUT), ms); });
  const v = await Promise.race([rawAsk(pid, kind, args), to]);
  clearTimeout(timer);
  if (!G || G.gen !== gen) throw ABORT;
  if (v === TIMEOUT) { cancelAsk(pid); return dflt; }
  return v === undefined ? dflt : v;
}
function cancelAsk(pid) { if (NET.role === 'host' && P(pid).remote) Host.cancel(pid); else abortLocal(); }
function localAsk(kind, a) {
  if (TEST_AUTO) return Promise.resolve(TEST_AUTO(kind, a));
  switch (kind) {
    case 'pick': return pick(a.kind, a.legal, a.text, a.cancellable);
    case 'discard': return discardDialog(a.k);
    case 'plenty': return pickResourcesDialog(a.title, a.text, a.k);
    case 'choose': return chooseDialog(a.title, a.text, a.options);
    case 'confirm': return confirmDialog(a.title, a.text, a.yes, a.no);
  }
  return Promise.resolve(undefined);
}
// the host checks a remote answer before using it; undefined means "not acceptable, ask again"
function validReply(r, v, p) {
  const a = r.args;
  switch (r.kind) {
    case 'pick': if (v === null) return a.cancellable ? null : undefined; return Number.isInteger(v) && a.legal.includes(v) ? v : undefined;
    case 'discard': { const h = cleanHand(v); return sum(h) === a.k && RES.every(x => h[x] <= p.res[x]) ? h : undefined; }
    case 'plenty': { const h = cleanHand(v); return sum(h) === a.k && RES.every(x => h[x] <= G.bank[x]) ? h : undefined; }
    case 'choose': return a.options.some(o => o.value === v) ? v : undefined;
    case 'confirm': return typeof v === 'boolean' ? v : undefined;
  }
  return undefined;
}
// what a bot answers when it takes over a seat that still had a question open
function botAnswer(p, kind, a) {
  switch (kind) {
    case 'pick':
      if (a.cancellable) return null;
      if (a.kind === 'vertex' && G.phase === 'setup') return Bot.pickSetupVertex(p);
      if (a.kind === 'hex') return Bot.robberHex(p);
      return a.legal[Math.floor(Math.random() * a.legal.length)];
    case 'discard': return Bot.discard(p, a.k);
    case 'plenty': return Bot.plentyPick(p);
    case 'choose': return a.options[0].value;
    case 'confirm': return false;
  }
}

// =====================================================================  turn flow
const sleep = ms => ms ? new Promise(r => setTimeout(r, ms)) : Promise.resolve();
async function botWait() { const gen = G.gen; await sleep(SPEED_MS[CFG.speed] ?? 400); if (!G || G.gen !== gen) throw ABORT; }
const checkpoint = () => { if (NET.role === 'host') Host.save(); };

async function runGame() {
  try { await gameLoop(); }
  catch (e) { if (e !== ABORT) { console.error(e); throw e; } }
}
// The loop keeps all of its progress in G, so a saved game can pick up where it stopped.
async function gameLoop() {
  const gen = G.gen, n = G.players.length, alive = () => G && G.gen === gen;
  if (G.phase === 'setup') {
    if (!G.setup) {
      const start = Math.floor(Math.random() * n), order = [];
      for (let i = 0; i < n; i++) order.push((start + i) % n);
      for (let i = n - 1; i >= 0; i--) order.push((start + i) % n);
      G.setup = { order, k: 0, start };
      log(`A new island rises from the tide. ${nm(P(start))} ${vb(P(start), 'go', 'goes')} first.`);
    }
    const S = G.setup;
    while (S.k < S.order.length) {
      if (!alive()) return;
      G.cur = S.order[S.k]; checkpoint(); render();
      await setupPlace(P(G.cur), S.k >= n);
      if (!alive()) return;
      S.k++;
    }
    G.phase = 'main'; G.cur = S.start; G.turnStarted = false;
    log(`Setup complete. Let the trading begin.`);
  }
  while (alive() && !G.over) {
    if (!G.turnStarted) { G.turn++; G.stats.turns++; G.rolled = false; G.devPlayed = false; G.shipMoved = false; G.offer = null; G.turnStarted = true; }
    const p = P(G.cur); checkpoint(); render();
    if (p.bot) await botTurn(p);
    else if (await humanTurn(p) === 'bot') await botTurn(p);   // a bot took over mid-turn
    if (!alive() || G.over) return;
    if (G.turn > 600) { G.over = true; log('Game stopped after 600 turns.'); render(); return; }
    G.cur = (G.cur + 1) % n; G.turnStarted = false;
  }
}

async function setupPlace(p, second) {
  let v;
  if (p.bot) { await botWait(); v = Bot.pickSetupVertex(p, second); }
  else v = await ask(p.id, 'pick', { kind: 'vertex', legal: legalSettlements(p, true), text: second ? 'Place your second settlement (it collects starting resources)' : 'Place your first settlement' });
  placeSettlement(p, v);
  if (second) { const got = emptyHand(); for (const h of G.verts[v].hexes) { const r = G.hexes[h].res; if (r) got[r] += give(p, r, 1); } if (sum(got)) log(`${nm(p)} ${vb(p, 'collect', 'collects')} ${resList(got)}.`); }
  render();
  let r;
  if (p.bot) { await botWait(); r = { e: Bot.pickSetupRoad(p, v), ship: false }; }
  else r = await askRoute(p, legalRoads(p, v), legalShips(p, v), G.sea ? 'Place a road or a ship next to it' : 'Place a road next to it');
  if (!r) return;
  if (r.ship) placeShip(p, r.e); else placeRoad(p, r.e);
  render();
}
// ask a person for an edge that may take a road or a ship; a shoreline that could take either gets a follow-up question
async function askRoute(p, roads, ships, text, cancellable = false) {
  const e = await ask(p.id, 'pick', { kind: 'edge', legal: [...new Set([...roads, ...ships])], text, cancellable });
  if (e === null || e === undefined) return null;
  let ship = !roads.includes(e);
  if (!ship && ships.includes(e)) ship = await ask(p.id, 'choose', { title: 'Road or ship?', text: 'This shoreline can take either.', options: [{ label: 'Road', value: 'road' }, { label: 'Ship', value: 'ship' }] }) === 'ship';
  return { e, ship };
}

const ROLL_MS = 900;           // keep in sync with the toss keyframes' duration
async function rollPause() {
  if (HEADLESS || CFG.speed === 'instant') return;
  const gen = G.gen; await sleep(ROLL_MS); if (!G || G.gen !== gen) throw ABORT;
}

async function rollDice(p) {
  const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6), n = a + b;
  G.dice = [a, b]; G.rolled = true; G.rollSeq++;
  render();                      // starts the tumble on every screen
  await rollPause();             // let the dice land before paying out
  log(`${nm(p)} ${vb(p, 'roll', 'rolls')} <b>${n}</b>.`);
  render();
  if (n === 7) await handleSeven(p); else { produce(n); await payGold(n); }
  render();
}

// everyone over the hand limit discards at the same time
async function handleSeven(p) {
  const need = G.players.filter(q => sum(q.res) > handLimit()).map(q => ({ q, k: Math.floor(sum(q.res) / 2) }));
  const waiting = new Set(need.filter(x => !x.q.bot).map(x => x.q.id));
  const upd = () => { G.wait = waiting.size ? `Waiting for ${[...waiting].map(i => P(i).name).join(', ')} to discard` : null; render(); };
  upd();
  await Promise.all(need.map(async ({ q, k }) => {
    const lose = q.bot ? Bot.discard(q, k) : cleanHand(await ask(q.id, 'discard', { k }));
    for (const r of RES) { const n = Math.min(lose[r] || 0, q.res[r]); q.res[r] -= n; G.bank[r] += n; }
    const verb = vb(q, 'discard', 'discards');
    log(`${nm(q)} ${verb} ${k} cards.`, { to: [q.id], html: `${nm(q)} ${verb} ${k} cards (${resList(lose)}).` });
    waiting.delete(q.id); upd();
  }));
  await moveRobber(p);
}

async function moveRobber(p) {
  // Seafarers: a person may send the pirate out instead (bots always use the robber)
  if (G.sea && G.pirate >= 0 && !p.bot && await ask(p.id, 'choose', { title: 'Robber or pirate?', text: 'The robber blocks a land tile and robs a neighbour. The pirate blocks ships beside a sea tile and robs a ship owner.', options: [{ label: 'Move the robber', value: 'robber' }, { label: 'Move the pirate', value: 'pirate' }] }) === 'pirate') return movePirate(p);
  let h;
  const legal = G.hexes.map((x, i) => i).filter(i => i !== G.robber);
  if (p.bot) { await botWait(); h = Bot.robberHex(p); }
  else h = await ask(p.id, 'pick', { kind: 'hex', legal, text: 'Move the robber to a new tile' });
  G.robber = h; log(`${nm(p)} ${vb(p, 'move', 'moves')} the robber to ${TER_NAME[G.hexes[h].ter]}${G.hexes[h].num ? ' ' + G.hexes[h].num : ''}.`);
  render();
  await robOneOf(p, G.hexes[h].verts.map(v => G.verts[v].owner));
}
async function movePirate(p) {
  const legal = G.water.map((x, i) => i).filter(i => i !== G.pirate);
  const w = await ask(p.id, 'pick', { kind: 'water', legal, text: 'Move the pirate to a new sea tile' });
  if (w === null || w === undefined) return;
  G.pirate = w; log(`${nm(p)} ${vb(p, 'move', 'moves')} the pirate.`);
  render();
  await robOneOf(p, G.water[w].edges.filter(e => G.edges[e].ship).map(e => G.edges[e].owner));
}
// steal one card from one of these players (the thief chooses when there are several)
async function robOneOf(p, owners) {
  const victims = [...new Set(owners)].filter(o => o >= 0 && o !== p.id && sum(P(o).res) > 0).map(P);
  if (!victims.length) return;
  let v;
  if (victims.length === 1) v = victims[0];
  else if (p.bot) v = Bot.stealTarget(p, victims);
  else v = P(await ask(p.id, 'choose', { title: 'Steal from whom?', text: 'Pick a player to rob.', options: victims.map(x => ({ label: `${esc(x.name)} (${sum(x.res)} cards)`, value: x.id, color: x.color })) }));
  stealFrom(p, v);
}

async function playDev(p, idx) {
  const card = p.devs[idx];
  if (!card || card.type === 'vp' || card.bought === G.turn || G.devPlayed) return false;
  p.devs.splice(idx, 1); G.devPlayed = true;
  log(`${nm(p)} ${vb(p, 'play', 'plays')} <b>${DEV_NAME[card.type]}</b>.`);
  if (card.type === 'knight') { p.knights++; updateArmy(p); await moveRobber(p); }
  else if (card.type === 'road') {
    for (let k = 0; k < 2; k++) {
      const roads = legalRoads(p), ships = legalShips(p); if (!roads.length && !ships.length) break;
      let r;
      if (p.bot) { await botWait(); r = roads.length ? { e: Bot.roadTarget(p) ?? roads[0], ship: false } : { e: Bot.shipTarget(p) ?? ships[0], ship: true }; }
      else { r = await askRoute(p, roads, ships, `Place free ${G.sea ? 'road or ship' : 'road'} ${k + 1} of 2`, true); if (!r) break; }
      if (r.ship) placeShip(p, r.e); else placeRoad(p, r.e);
      render();
    }
  } else if (card.type === 'plenty') {
    const got = p.bot ? Bot.plentyPick(p) : cleanHand(await ask(p.id, 'plenty', { title: 'Year of Plenty', text: 'Take any 2 resources from the bank.', k: 2 }));
    const g2 = emptyHand(); for (const r of RES) if (got[r]) g2[r] = give(p, r, got[r]);
    log(`${nm(p)} ${vb(p, 'take', 'takes')} ${resList(g2) || 'nothing'}.`);
  } else if (card.type === 'mono') {
    const r = p.bot ? Bot.monoPick(p) : await ask(p.id, 'choose', { title: 'Monopoly', text: 'Name a resource. Every other player hands you all of theirs.', options: RES.map(x => ({ label: RN[x], value: x, color: RC[x] })) });
    let n = 0; for (const q of G.players) if (q !== p) { n += q.res[r]; p.res[r] += q.res[r]; q.res[r] = 0; }
    log(`${nm(p)} ${vb(p, 'collect', 'collects')} ${n} ${RN[r]}.`);
  }
  render(); checkWin(p);
  return true;
}

function buyDev(p) {
  if (!G.deck.length || !canAfford(p, COST.dev)) return null;
  pay(p, COST.dev); const t = G.deck.pop(); p.devs.push({ type: t, bought: G.turn });
  const verb = vb(p, 'buy', 'buys');
  log(`${nm(p)} ${verb} a development card.`, { to: [p.id], html: `${nm(p)} ${verb} a development card (${DEV_NAME[t]}).` });
  checkWin(p); return t;
}

function bankTrade(p, giveR, getR) {
  if (!RES.includes(giveR) || !RES.includes(getR)) return false;
  const rate = portRates(p)[giveR];
  if (p.res[giveR] < rate || G.bank[getR] < 1 || giveR === getR) return false;
  p.res[giveR] -= rate; G.bank[giveR] += rate; G.bank[getR]--; p.res[getR]++;
  log(`${nm(p)} ${vb(p, 'trade', 'trades')} ${rate} ${RN[giveR]} with the bank for 1 ${RN[getR]}.`);
  return true;
}
function doTrade(a, b, aGives, bGives) {
  for (const r of RES) { a.res[r] -= aGives[r] || 0; b.res[r] += aGives[r] || 0; b.res[r] -= bGives[r] || 0; a.res[r] += bGives[r] || 0; }
  log(`${nm(a)} ${vb(a, 'trade', 'trades')} ${resList(aGives)} to ${nm(b)} for ${resList(bGives)}.`);
}

// A player offers cards to the table. Bots answer at once; people get a popup and have 45 seconds.
// Returns {msg, takers, done}: with one taker the trade happens right away, with several the offerer picks.
async function offerTrade(p, give, want) {
  give = cleanHand(give); want = cleanHand(want);
  if (!sum(give) || !sum(want) || RES.some(r => give[r] && want[r]) || !canAfford(p, give)) return { msg: 'That offer isn\'t valid.', takers: [] };
  const others = G.players.filter(q => q !== p), replies = {}, people = [];
  for (const q of others) {
    if (!canAfford(q, want)) replies[q.id] = 'can\'t';
    else if (q.bot) replies[q.id] = Bot.acceptTrade(q, p, give, want) ? 'yes' : 'no thanks';
    else if (q.remote && q.online === false) replies[q.id] = 'away';
    else people.push(q);
  }
  if (people.length) {
    log(`${nm(p)} ${vb(p, 'offer', 'offers')} ${resList(give)} for ${resList(want)}.`);
    const waiting = new Set(people.map(q => q.id));
    const upd = () => { G.wait = waiting.size ? `Waiting for ${[...waiting].map(i => P(i).name).join(', ')} to answer ${p.name}'s offer` : null; render(); };
    upd();
    await Promise.all(people.map(async q => {
      const ok = await askTimed(q.id, 'confirm', { title: `${esc(p.name)} offers a trade`, text: `${nm(p)} offers <b>${resList(give)}</b> for your <b>${resList(want)}</b>.`, yes: 'Accept', no: 'Decline' }, OFFER_TIMEOUT, null);
      replies[q.id] = ok === true ? 'yes' : ok === false ? 'no thanks' : 'no reply';
      waiting.delete(q.id); upd();
    }));
  }
  const takers = others.filter(q => replies[q.id] === 'yes' && canAfford(q, want)).map(q => q.id);
  const summary = others.map(q => `${esc(q.name)}: ${replies[q.id]}`).join(' · ');
  G.offer = takers.length ? { from: p.id, give, want, takers } : null;
  if (!takers.length) { log(`${nm(p)}'s offer of ${resList(give)} for ${resList(want)} finds no takers.`); return { msg: `Nobody accepted. (${summary})`, takers: [] }; }
  if (takers.length === 1) { const ok = completeOffer(p, takers[0]); return { msg: ok ? `${esc(P(takers[0]).name)} accepted. (${summary})` : 'The trade fell through.', takers: [], done: ok }; }
  return { msg: `More than one player accepted. Pick who to trade with. (${summary})`, takers };
}
function completeOffer(p, qid) {
  const o = G.offer; G.offer = null;
  if (!o || o.from !== p.id || !o.takers.includes(qid)) return false;
  const q = P(qid);
  if (!canAfford(p, o.give) || !canAfford(q, o.want)) return false;
  doTrade(p, q, o.give, o.want);
  return true;
}
// =====================================================================  BOT AI
const Bot = {
  D(p) { return { easy: 0, normal: 1, hard: 2 }[p.diff] ?? 1; },
  // production per resource (expected pips)
  income(p) {
    const inc = emptyHand();
    G.verts.forEach(V => { if (V.owner !== p.id) return; for (const h of V.hexes) { const H = G.hexes[h]; if (H.res) inc[H.res] += pips(H.num) * (V.city ? 2 : 1); } });
    return inc;
  },
  vertexValue(p, v, setup) {
    const V = G.verts[v], inc = this.income(p), d = this.D(p), early = vp(p) < winPts() / 2;
    let s = 0; const seen = new Set();
    for (const h of V.hexes) {
      const H = G.hexes[h];
      if (H.ter === 'gold') { s += pips(H.num) * 1.3; continue; }
      if (!H.res) continue;
      let w = 1;
      if (d >= 1) { if (early && (H.res === 'wood' || H.res === 'brick')) w = 1.15; if (!early && (H.res === 'wheat' || H.res === 'ore')) w = 1.2; if (H.res === 'wheat') w *= 1.08; }
      if (d === 2) { const scarcity = 1 + (5 - this.totalPips(H.res)) * 0.04; w *= scarcity; }
      let val = pips(H.num) * w;
      if (h === G.robber && d >= 1) val *= 0.4;
      s += val;
      if (!inc[H.res] && !seen.has(H.res)) s += d === 2 ? 3 : d === 1 ? 2.2 : 1; // diversity
      seen.add(H.res);
    }
    if (V.port && d >= 1) {
      if (V.port === 'any') s += 1.2;
      else s += Math.min(3.5, (inc[V.port] + (V.hexes.some(h => G.hexes[h].res === V.port) ? 4 : 0)) * 0.35);
    }
    if (d === 0) s = s * rnd(0.4, 1.6) + rnd(0, 3);
    return s;
  },
  _tp: null,
  totalPips(r) { let t = 0; for (const H of G.hexes) if (H.res === r) t += pips(H.num); return t / 3; },
  pickSetupVertex(p, second) {
    const legal = legalSettlements(p, true);
    return legal.reduce((b, v) => (this.vertexValue(p, v, true) > this.vertexValue(p, b, true) ? v : b), legal[0]);
  },
  pickSetupRoad(p, v) {
    const legal = legalRoads(p, v);
    if (this.D(p) === 0) return legal[Math.floor(Math.random() * legal.length)];

async function botTurn(p) {

  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js',
  'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
];
const PeerClass = () => window.Peer || (window.peerjs && (window.peerjs.Peer || window.peerjs.default));

    let i = 0;
    const next = () => {
      if (i >= PEER_URLS.length) { peerLoading = null; return rej(new Error('PeerJS failed to load')); }
      const s = document.createElement('script'); s.src = PEER_URLS[i++]; s.async = true;
      s.onload = () => PeerClass() ? res() : next();

}

}
const shareLink = room => location.href.split(/[?#]/)[0] + '?join=' + room;

// what one player is allowed to see
function viewFor(seat) {
  const g = { ...G };
  g.deck = new Array(G.deck.length).fill(0);
  g.players = G.players.map(p => (p.id === seat || G.over)
    ? { ...p, cid: null }
    : { ...p, cid: null, res: emptyHand(), resCount: sum(p.res), devs: p.devs.map(c => ({ type: 'hidden', bought: c.bought })) });
  g.logLines = G.logLines.slice(-80).map(e => logText(e, seat));

}

let LOBBY = null;   // host only: { seats: [{kind:'host'|'player'|'open'|'bot'|'closed', name, cid, diff, online}], speed }

  return LOBBY.seats.map((s, i) => ({ kind: s.kind, color: PCOL[i], diff: s.diff || '',
    name: s.kind === 'host' ? (cleanName(s.name) || 'Host') : s.kind === 'bot' ? lobbyBotName(i) : (s.name || ''),
    online: s.kind === 'player' ? !!Host.connFor(s.cid) : true }));
}

const Host = {
  peer: null, room: null, fixed: false, attempts: 0, conns: new Map(), reqs: new Map(), seq: 0, inGame: false, timer: null,

  open(room, fixed) {
    this.room = room; this.fixed = fixed; setHosting(room);
    if (this.peer) { try { this.peer.destroy(); } catch (e) { } }
    setNet(`Opening room ${room}…`);
    const Peer = PeerClass(), peer = new Peer(PEER_PREFIX + room, PEER_OPTS());
    this.peer = peer;
    peer.on('open', () => { if (this.peer !== peer) return; peer._twOpened = true; this.attempts = 0; setNet(null); refreshLobby(); this.flush(); });
    peer.on('connection', conn => { if (this.peer === peer) this.attach(conn); });
    peer.on('disconnected', () => {
      if (this.peer !== peer || peer.destroyed) return;
      setNet('Lost touch with the matchmaking server. Players already connected can keep playing; reconnecting…');
      setTimeout(() => { if (this.peer === peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) { } }, 3000);
    });
    peer.on('error', err => {
      if (this.peer !== peer) return;
      const t = err && err.type;
      if (t === 'unavailable-id' && peer._twOpened) {   // the server hasn't let go of our old id yet; keep our live links
        setTimeout(() => { if (this.peer === peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) { } }, 5000);
      } else if (t === 'unavailable-id') {
        try { peer.destroy(); } catch (e) { }
        this.attempts++;
        if (!this.fixed && this.attempts < 4) return this.open(randCode(), false);   // a brand-new code happened to be taken
        if (this.attempts > 12) { this.attempts = 0; setNet('That room code is still taken, so this game moved to a new code. Send your friends the new link from the menu.', 'bad'); return this.open(randCode(), false); }
        setNet(`Reclaiming room ${room}… (try ${this.attempts})`);
        setTimeout(() => { if (this.peer === peer) this.open(room, this.fixed); }, 3000);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(t)) {
        setNet('Can\'t reach the matchmaking server. Retrying…', 'bad');
        setTimeout(() => {
          if (this.peer !== peer || peer.destroyed || peer.open) return;
          if (peer._twOpened) { try { peer.reconnect(); } catch (e) { } }   // never destroy: that would drop connected players
          else this.open(room, this.fixed);
        }, 4000);
      } else if (t === 'browser-incompatible') setNet('This browser doesn\'t support online play.', 'bad');

  },
  shutdown(reason = 'The host closed the room.') {

    setTimeout(() => { try { peer && peer.destroy(); } catch (e) { } }, 400);
    this.peer = null; this.room = null; this.conns.clear(); this.reqs.clear(); this.inGame = false;
    clearTimeout(this.timer); this.timer = null;
    NET.role = 'solo'; LOBBY = null; ss.del('tw_hosting'); setNet(null);
  },
  attach(conn) {

  send(conn, m) { try { if (conn && conn.open) conn.send(m); } catch (e) { } },
  connFor(cid) { const c = cid && this.conns.get(cid); return c && c.open ? c : null; },
  playerByCid(cid) { return this.inGame && G && cid ? G.players.find(p => p.remote && p.cid === cid) || null : null; },

  onMsg(conn, m) {

  hello(conn, m) {

      }
      if (!p) {

  onClose(conn) {

  },
  save() {

  },

function setHosting(room) { ss.set('tw_hosting', room); }
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && s.g && !s.g.over && s.room ? s : null; } catch (e) { return null; }
}
const encodeSave = s => 'TW1:' + btoa(unescape(encodeURIComponent(JSON.stringify(s))));
function decodeSave(code) {
  const t = String(code).trim().replace(/\s+/g, '');

  if (!s || !s.g || !Array.isArray(s.g.hexes) || !Array.isArray(s.g.players) || !s.lobby || !s.room) throw new Error('bad');

async function startHosting(room) {
  if (!(await ensurePeer())) return;
  NET.role = 'host'; Host.inGame = false;
  LOBBY = { seats: [{ kind: 'host', name: savedName() || 'Host' }, { kind: 'open' }, { kind: 'open' }, { kind: 'open' }], speed: 'normal', map: 'classic', win: WIN_DEFAULT, limit: LIMIT_DEFAULT };
  Host.room = room || randCode();
  openHostLobby();
  Host.open(Host.room, !!room);
}
function startHostedGame() {
  const seats = [];
  LOBBY.seats.forEach((s, i) => {
    if (s.kind === 'host') seats.push({ kind: 'local', name: cleanName(s.name) || 'Host', color: i, seat: i });
    else if (s.kind === 'player') seats.push({ kind: 'remote', name: s.name, cid: s.cid, online: !!Host.connFor(s.cid), color: i, seat: i });
    else if (s.kind === 'bot') seats.push({ kind: 'bot', name: lobbyBotName(i), diff: s.diff, color: i, seat: i });
  });
  if (seats.length < 2) return;
  ME = seats.findIndex(s => s.kind === 'local');
  Host.inGame = true; Host.reqs.clear();
  closeModal();
  startGame(seats, LOBBY.speed, LOBBY.map, LOBBY);
  Host.flush();
}
function stopCurrentGame() {
  if (G) G.gen = ++GEN;          // stale game loops notice and stop
  abortLocal(); pending = null; setPrompt(null); endTurnResolve = null;
  Host.reqs.clear();
}
function backToLobby() {
  stopCurrentGame();
  Host.inGame = false; Host.clearSave();
  if (G) { G.wait = null; G.turnOpen = false; render(); }
  openHostLobby(); Host.flush();
}
function resumeHosted(save) {
  return ensurePeer().then(ok => {
    if (!ok) return;
    stopCurrentGame();
    NET.role = 'host'; LOBBY = save.lobby; ME = save.me;
    G = save.g; G.gen = ++GEN; G.busy = false; G.turnOpen = false; G.wait = null;
    for (const p of G.players) if (p.remote) p.online = false;
    Host.inGame = true; Host.conns.clear(); Host.reqs.clear();
    closeModal();
    if (!HEADLESS) resize();
    log('The host resumed the game. Waiting for everyone to reconnect…');
    render();
    Host.open(save.room, true);
    runGame();
  });
}

const Client = {
  peer: null, conn: null, room: null, name: '', claim: undefined, rid: 0, acks: new Map(), connected: false,
  everConnected: false, curReq: null, retryT: null, stopped: true,

  cid() { let c = ss.get('tw_cid'); if (!c) { c = randId(16); ss.set('tw_cid', c); } return c; },
  start(room, name) {
    this.room = room; this.name = name; this.stopped = false; this.everConnected = false; this.claim = undefined; this.curReq = null;
    NET.role = 'client'; ss.set('tw_join', room); ss.set('tw_name', name);
    try { history.replaceState(null, '', '?join=' + room); } catch (e) { }
    this.connect();
  },
  stop() {
    this.stopped = true; clearTimeout(this.retryT);
    const peer = this.peer; this.peer = null; this.conn = null; this.connected = false;
    try { peer && peer.destroy(); } catch (e) { }
    for (const [, r] of this.acks) r({ err: 'offline' }); this.acks.clear();
    ss.del('tw_join'); setNet(null);
  },
  retry(ms) { clearTimeout(this.retryT); if (!this.stopped) this.retryT = setTimeout(() => this.connect(), ms); },
  status(text, tone) {
    setNet(text, tone);
    const el = $('jMsg'); if (el && (modalOwner === 'join' || modalOwner === 'clientLobby')) el.textContent = text || '';
  },
  connect() {
    if (this.stopped || (this.conn && this.conn.open)) return;
    clearTimeout(this.retryT);
    if (this.peer && !this.peer.destroyed) { if (this.peer.open) return this.dial(); try { this.peer.destroy(); } catch (e) { } }
    const Peer = PeerClass(), peer = new Peer('tw-' + randId(14), PEER_OPTS());
    this.peer = peer;
    peer.on('open', () => { if (this.peer === peer) this.dial(); });
    peer.on('disconnected', () => {
      if (this.peer !== peer || peer.destroyed) return;
      setTimeout(() => { if (this.peer === peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) { } }, 2000);
    });
    peer.on('error', err => {
      if (this.peer !== peer || this.stopped) return;
      const t = err && err.type;
      if (t === 'peer-unavailable') {
        this.status(this.everConnected ? 'The host is away. Waiting for them to come back…' : `No game is open in room ${this.room} yet. Still trying…`, this.everConnected ? '' : 'bad');
        this.retry(3000);
      } else if (t === 'browser-incompatible') this.status('This browser doesn\'t support online play.', 'bad');
      else if (this.conn && this.conn.open) { /* matchmaking hiccup; our link to the host is still fine */ }
      else {
        if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(t)) this.status('Can\'t reach the matchmaking server. Retrying…', 'bad');
        if (!peer.open) { try { peer.destroy(); } catch (e) { } }
        this.retry(t === 'unavailable-id' ? 300 : 4000);
      }
    });
  },
  dial() {
    if (this.stopped) return;
    const conn = this.peer.connect(PEER_PREFIX + this.room, { reliable: true, serialization: 'json' });
    this.conn = conn; let opened = false;
    const timer = setTimeout(() => { if (!opened && this.conn === conn) { try { conn.close(); } catch (e) { } this.conn = null; this.retry(1000); } }, 12000);
    conn.on('open', () => {
      if (this.conn !== conn) return;
      opened = true; clearTimeout(timer); this.connected = true; this.everConnected = true; this.status(null);
      conn.send({ t: 'hello', cid: this.cid(), name: this.name, claim: this.claim });
    });
    conn.on('data', m => { if (this.conn === conn) try { this.onMsg(m); } catch (e) { console.error(e); } });
    const lost = () => {
      if (this.conn !== conn) return;
      clearTimeout(timer); this.conn = null;
      const was = this.connected; this.connected = false;
      for (const [, r] of this.acks) r({ err: 'offline' }); this.acks.clear();
      if (this.stopped) return;
      this.status(was ? 'Lost the connection to the host. Reconnecting…' : 'Connecting…', was ? 'bad' : '');
      this.retry(was ? 1000 : 3000);
    };
    conn.on('close', lost); conn.on('error', lost);
  },
  send(m) { try { if (this.conn && this.conn.open) this.conn.send(m); } catch (e) { } },
  onMsg(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'lobby': this.claim = undefined; showClientLobby(m); break;
      case 'state': this.claim = undefined; applyState(m); break;
      case 'claim': showClaim(m); break;
      case 'reject': this.stop(); NET.role = 'solo'; showMessage('Can\'t join', esc(m.reason)); break;
      case 'ack': { const r = this.acks.get(m.rid); if (r) { this.acks.delete(m.rid); r(m.r || {}); } break; }
    }
  },
  act(a, d = {}) {
    if (!this.connected) return Promise.resolve({ err: 'offline' });
    const rid = ++this.rid;
    return new Promise(res => {
      this.acks.set(rid, res);
      this.send({ ...d, t: 'act', a, rid });
      setTimeout(() => { if (this.acks.has(rid)) { this.acks.delete(rid); res({ err: 'timeout' }); } }, 120000);
    });
  },
  // the host's state says whether a question is waiting for us; show it once, answer once
  handleReq(req) {
    const cur = this.curReq;
    if ((req ? req.id : null) === (cur ? cur.id : null)) return;
    if (cur && !cur.done) abortLocal();
    this.curReq = req ? { id: req.id } : null;
    if (!req) return;
    const mine = this.curReq;
    Promise.resolve(localAsk(req.kind, req.args)).then(v => {
      if (this.curReq !== mine || v === undefined) return;
      mine.done = true; this.send({ t: 'res', id: req.id, v });
    });
  },
};
function applyState(m) {
  const fresh = !G || G.gid !== m.g.gid;
  G = m.g; ME = m.you;
  if (['join', 'clientLobby', 'claim'].includes(modalOwner)) closeModal();
  if (fresh && !HEADLESS) resize();
  render();
  if (tradeRedraw) tradeRedraw();
  Client.handleReq(m.req);
}

// =====================================================================  dialogs
const modalBg = () => $('modalBg'), modalEl = () => $('modal');
function openModal(html, owner = 'misc') { modalEl().innerHTML = html; modalBg().classList.add('on'); modalOwner = owner; }
function closeModal() { modalBg().classList.remove('on'); modalEl().innerHTML = ''; modalOwner = null; tradeRedraw = null; }
// question dialogs resolve undefined if they're withdrawn (timed out, or the host moved on)
function askDialog(build) {
  return new Promise(res => {
    const done = v => { localAbort = null; if (modalOwner === 'ask') closeModal(); res(v); };
    localAbort = () => done(undefined);
    build(done);
  });
}
function confirmDialog(title, text, yes, no) {

    openModal(`<h3>${title}</h3><p>${text}</p><div class="row"><button class="btn pri" id="mYes">${yes}</button><button class="btn" id="mNo">${no}</button></div>`, 'ask');

}

  });
}

function stepperGrid(id, sel, max) {
  return `<div class="steps" id="${id}">${RES.map(r => `<div class="step">${cardHTML(r, sel[r])}<div class="ctl"><button data-r="${r}" data-d="-1" aria-label="Less ${RN[r]}">−</button><button data-r="${r}" data-d="1" aria-label="More ${RN[r]}">+</button></div><small style="color:var(--dim)">${max ? 'have ' + max[r] : ''}</small></div>`).join('')}</div>`;
}
function discardDialog(k) {
  return askDialog(done => {
    const sel = emptyHand();

        <div class="row"><button class="btn pri" id="offer" ${canOffer ? '' : 'disabled'}>Offer to players</button><button class="btn" id="done" ${dis}>Done</button></div>`, 'trade');

      modalEl().querySelectorAll('#bt button').forEach(b => b.onclick = () => { bankGet = b.dataset.r; draw(); });

function drawMapPreview(c, mapId, b = genBoard(mapId)) {
  if (!c) return null;
  const dpr = Math.min(devicePixelRatio || 1, 2), w = c.clientWidth || 476, h = c.clientHeight || 230;

  const tiles = [...b.hexes, ...b.water], xs = tiles.map(t => t.x), ys = tiles.map(t => t.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min((w - 16) / (x1 - x0 + 1.9), (h - 22) / (y1 - y0 + 2.2)), ox = w / 2 - (x0 + x1) / 2 * s, oy = (h - 6) / 2 - (y0 + y1) / 2 * s;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);

  for (const pt of b.ports) {
    const E = b.edges[pt.edge], A = b.verts[E.a], B = b.verts[E.b], Hx = b.hexes[E.hexes[0]];
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, l = Math.hypot(mx - Hx.x, my - Hx.y);
    const [px, py] = at({ x: mx + (mx - Hx.x) / l * 0.45, y: my + (my - Hx.y) / l * 0.45 });
    ctx.beginPath(); ctx.arc(px, py, Math.max(2.5, s * 0.17), 0, 7); ctx.fillStyle = pt.type === 'any' ? '#f1ead8' : RC[pt.type]; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#3a2f1c'; ctx.stroke();
  }
  for (const H of b.hexes) {
    const [x, y] = at(H);
    hexPath(ctx, x, y, s * 0.97); ctx.fillStyle = TER_COL[H.ter]; ctx.fill();
    if (s > 14) drawTerrainArt(ctx, H, x, y, s);
    if (H.num && s > 9) {
      ctx.beginPath(); ctx.arc(x, y, s * 0.34, 0, 7); ctx.fillStyle = '#f6efdc'; ctx.fill();
      ctx.fillStyle = H.num === 6 || H.num === 8 ? '#b3261e' : '#2a2418'; ctx.font = `800 ${Math.round(s * 0.38)}px ${getComputedStyle(document.body).getPropertyValue('--display')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(H.num, x, y + s * 0.02);
    }
  }

  return b;
}

// style for card i of n in a fan that fits in `room` px: overlap, tilt and arc
function fanPos(i, n, room, w = 58, maxStep = 46) {
  const step = n > 1 ? Math.max(12, Math.min(maxStep, (room - w) / (n - 1))) : 0, t = n > 1 ? i / (n - 1) * 2 - 1 : 0;
  return `margin-left:${i ? step - w : 0}px;--r:${(t * Math.min(12, n * 1.6)).toFixed(1)}deg;--y:${(t * t * Math.min(10, n * 1.3)).toFixed(1)}px`;

let trayPrev = { key: '', res: null }, traySig = '';
function renderTray() {
  const mine = G && !HEADLESS && me();
  if (!mine) { traySig = ''; $('hand').innerHTML = ''; $('devs').innerHTML = ''; $('handCount').textContent = ''; return; }
  const n = sum(mine.res), lim = handLimit(), hc = $('handCount');
  hc.textContent = `· ${n} / ${lim}`; hc.classList.toggle('over', n > lim);
  hc.title = n > lim ? `Over the hand limit: you'll discard ${Math.floor(n / 2)} if a 7 is rolled` : '';
  const free = G.cur === ME && G.phase === 'main' && !G.over && G.turnOpen && !G.busy;
  const playable = d => d.type !== 'vp' && free && !G.devPlayed && d.bought !== G.turn && (d.type === 'knight' || G.rolled);
  const W = $('tray').clientWidth - 48, nd = mine.devs.length;

    const inner = `${d.bought === G.turn ? '<span class="new">NEW</span>' : ''}${cardSvg(DEV_ICON[d.type])}<span class="nm">${DEV_NAME[d.type]}</span>`, pos = fanPos(i, nd, devRoom, 58, 52);
    return d.type === 'vp' ? `<div class="hc dv vpcard" style="${pos}" title="${DEV_HELP.vp}">${inner}</div>`
      : `<button class="hc dv" style="${pos}" title="${DEV_HELP[d.type]}${playable(d) ? ' (click to play)' : ''}" onclick="H.play(${i})" ${playable(d) ? '' : 'disabled'}>${inner}</button>`;

const DIE_PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

function showDice(a, b) {

  s.textContent = a && b ? n : ''; s.classList.toggle('on', !!(a && b)); s.classList.toggle('seven', n === 7);

function animateDice(a, b) {

// =====================================================================  boot
function boot() {
  const c = cv();
  addEventListener('resize', () => { resize(); renderTray(); });
  c.addEventListener('mousemove', e => { const r = c.getBoundingClientRect(); const h = nearest(e.clientX - r.left, e.clientY - r.top); if (h !== hover) { hover = h; drawBoard(); } c.style.cursor = h !== null ? 'pointer' : 'default'; });
  c.addEventListener('click', e => { const r = c.getBoundingClientRect(); const h = nearest(e.clientX - r.left, e.clientY - r.top); if (h !== null && pending) resolvePick(h); });
  $('promptCancel').onclick = () => { if (pending && pending.cancellable) resolvePick(null); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && pending && pending.cancellable) resolvePick(null); });
  $('newGameBtn').onclick = () => { if (modalBg().classList.contains('on')) return; gameMenu(); };
  addEventListener('beforeunload', e => { if (NET.role === 'host' && Host.inGame && G && !G.over && !window.__tideNoUnloadPrompt) { e.preventDefault(); e.returnValue = ''; } });
  setInterval(() => { if (pending) { pulse += 0.35; drawBoard(); } }, 60);
  // a board to look at behind the menu
  previewBoard();
  const q = new URLSearchParams(location.search);
  if (q.has('test')) return;
  const join = (q.get('join') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  const hosting = ss.get('tw_hosting');
  if (join) {
    // a refresh mid-game reconnects straight away; a fresh visit asks for a name first
    const name = cleanName(ss.get('tw_name')) || savedName();
    if (ss.get('tw_join') === join && name) ensurePeer().then(ok => { if (ok) { openModal(`<h3>Rejoining room ${esc(join)}</h3><p class="note" id="jMsg">Connecting…</p><div class="row"><button class="btn" id="leave">Leave</button></div>`, 'join'); $('leave').onclick = backToMenu; Client.start(join, name); } });
    else joinScreen(join);
  } else if (hosting) {
    // the host refreshed: pick the game (or lobby) straight back up
    const save = loadSave();
    if (save && save.room === hosting) resumeHosted(save);
    else startHosting(hosting);
  } else mainMenu();
}
window.__tide = {
  get G() { return G; }, get ME() { return ME; }, get me() { return me(); }, NET, Host, Client, H, act, doAction, botAnswer,
  newGame, runGame, startGame, Bot, vp, legalRoads, legalShips, movableShips, legalSettlements, legalCities, canAfford, portRates, roadLength, COST, RES,
  setHeadless: v => HEADLESS = v, setAuto: f => TEST_AUTO = f, setSpeed: v => CFG.speed = v, encodeSave, decodeSave,
  screenOf(kind, i) {   // canvas position of a vertex, edge or hex (used by tests)
    if (kind === 'vertex') return W2S(G.verts[i].x, G.verts[i].y);
    if (kind === 'hex') return W2S(G.hexes[i].x, G.hexes[i].y);
    if (kind === 'water') return W2S(G.water[i].x, G.water[i].y);
