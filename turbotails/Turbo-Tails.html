<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Tails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#12101f;--panel:#201c38;--line:#38305e;--ink:#efe8ff;--dim:#a59cc8;--accent:#f08a3a}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;padding-inline:16px;padding-block:16px;box-sizing:border-box;
  background-image:radial-gradient(ellipse at 50% 0%,#2a2250 0%,transparent 65%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.frame{width:min(100%,960px,calc((100vh - 170px)*4/3));border:4px solid #0a0814;border-radius:6px;box-shadow:0 0 0 3px var(--line),0 24px 50px #0009;background:#000}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.help{font-size:12px;color:var(--dim);line-height:1.9;text-align:center;max-width:780px}
kbd{font-family:inherit;background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink);font-size:11px}
.touch{display:none;width:100%;max-width:560px;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.touch .grp{display:flex;gap:10px}
.touch button{width:66px;height:66px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-family:"Silkscreen",monospace;font-size:13px;box-shadow:0 4px 0 #0a0814;touch-action:none}
.touch button.a{background:var(--accent);color:#2a1408;border-color:#b35a1c}
.touch button:active{transform:translateY(2px);box-shadow:0 2px 0 #0a0814}
@media (hover:none),(max-width:640px){.touch{display:flex}.help{display:none}}
</style>
</head><body>

<div class="wrap">
  <div class="frame"><canvas id="game" width="320" height="240" tabindex="0" aria-label="Turbo Tails race screen"></canvas></div>
  <div class="touch" id="touch">
    <div class="grp"><button data-k="left" aria-label="Steer left">◀</button><button data-k="right" aria-label="Steer right">▶</button></div>
    <div class="grp"><button data-k="brake" aria-label="Brake">BRK</button><button data-k="item" aria-label="Use item">ITEM</button><button class="a" data-k="hop" aria-label="Hop and drift">DRIFT</button></div>
  </div>
  <div class="help">
    <kbd>↑</kbd>/<kbd>W</kbd> gas &nbsp;·&nbsp; <kbd>↓</kbd>/<kbd>S</kbd> brake &nbsp;·&nbsp; <kbd>←</kbd><kbd>→</kbd> steer &nbsp;·&nbsp; <kbd>Space</kbd>/<kbd>Shift</kbd> hop &amp; drift &nbsp;·&nbsp; <kbd>Z</kbd>/<kbd>E</kbd> use item<br>
    Hold drift through a turn until the sparks turn blue, then orange, and let go for a boost. &nbsp;<kbd>Enter</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> music
  </div>
</div>

<script>
(()=>{
const W=320,H=240,HOR=86,FOCAL=160,CAMH=22,CAMD=56,S=1600,RW=92,CW=7,GW=70;
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');ctx.imageSmoothingEnabled=false;
const FONT='"Silkscreen", "Courier New", monospace';
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- drivers & kart sprites ---------- */
const DRIVERS=[
 {name:'PIP',  kart:'#f08a3a',suit:'#3b6fe0',helm:'#f08a3a',ears:1,tip:'#ffd0a0'},
 {name:'BOLT', kart:'#4fd6e8',suit:'#3a3a50',helm:'#c8d0dc',ant:1,tail:'#8a94a4',tip:'#ffd84a'},
 {name:'MARA', kart:'#b77cff',suit:'#ffd84a',helm:'#ffd84a',ears:1},
 {name:'GUS',  kart:'#6ee07a',suit:'#2f8a36',helm:'#9be36e',tail:'#5fbf52'},
 {name:'OTTIE',kart:'#b07a4a',suit:'#e8c890',helm:'#6a4a2a'},
 {name:'NIX',  kart:'#ff5c7a',suit:'#1c1030',helm:'#f4f4ff',tail:'#2a2040',tip:'#f4f4ff'}
];
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,((n>>16)&255)*f|0),g=Math.min(255,((n>>8)&255)*f|0),b=Math.min(255,(n&255)*f|0);return `rgb(${r},${g},${b})`}
const NA=24;
function renderKart(d,angle){
  const c=mkCanvas(64,64),g=c.getContext('2d');
  const cr=Math.cos(angle),sr=Math.sin(angle),p=0.46,cp=Math.cos(p),sp=Math.sin(p),SC=3,OX=32,OY=40;
  const proj=(x,y,z)=>{const X=x*cr+y*sr,Y=-x*sr+y*cr;return [OX+X*SC,OY+(-z*cp-Y*sp)*SC,Y*cp-z*sp]};
  const items=[];
  const box=(x0,x1,y0,y1,z0,z1,col)=>{
    const F=[[[1,0,0],[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],[[-1,0,0],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]]],
      [[0,1,0],[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]]],[[0,-1,0],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
      [[0,0,1],[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]]];
    for(const [n,vs] of F){const nx=n[0]*cr+n[1]*sr,ny=-n[0]*sr+n[1]*cr;if(ny*cp-n[2]*sp>=0)continue;
      const sh=0.62+0.5*Math.max(0,nx*-0.45+ny*-0.5+n[2]*0.75);const P=vs.map(v=>proj(...v));
      items.push({P,d:P.reduce((s,q)=>s+q[2],0)/4,col:shade(col,sh)})}
  };
  box(-6,6,-8,7,1.2,3.4,d.kart);box(-4.5,4.5,7,11,1.2,2.8,d.kart);
  box(-4.5,4.5,-9.5,-4.5,3.4,6.5,'#3a3a48');box(-7.2,7.2,-11,-9.5,6.2,7.4,shade(d.kart,0.7).replace(/rgb\((\d+),(\d+),(\d+)\)/,(m,r,g2,b)=>'#'+[r,g2,b].map(v=>(+v).toString(16).padStart(2,'0')).join('')));
  box(-3,3,-4.5,-0.5,3.4,8.5,d.suit);box(-2,2,1.5,2.5,5,6.2,'#222230');
  const tc=d.tail||d.helm;box(0.6,2.2,-10.4,-8.6,5,7.2,tc);box(1.4,3,-11.8,-10,6.8,9,tc);box(2.2,3.8,-12.4,-10.6,8.8,10.8,tc);box(2.6,4.2,-11.8,-10,10.6,12.4,d.tip||tc);
  for(const sx of [-1,1]){box(sx>0?5.8:-8.8,sx>0?8.8:-5.8,-8.8,-3.6,0,4.4,'#24222c');box(sx>0?5.8:-8.4,sx>0?8.4:-5.8,4,8.6,0,3.8,'#24222c')}
  const hc=proj(0,-2.5,11.2);items.push({head:1,c:hc,d:hc[2]-0.5});
  items.sort((a,b)=>b.d-a.d);
  for(const it of items){
    if(it.head){
      const [x,y]=it.c,r=3.5*SC;
      if(d.ears||d.ant){for(const s of [-1,1]){const e=proj(s*2.3,-2.5,14.2);g.fillStyle=d.ant?'#ffd84a':d.helm;g.beginPath();
        if(d.ant){g.fillRect(e[0]-1,e[1]-3,2,5)}else{g.moveTo(e[0]-4,e[1]+4);g.lineTo(e[0],e[1]-5);g.lineTo(e[0]+4,e[1]+4);g.fill()}}}
      g.fillStyle=d.helm;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
      g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.arc(x-r*0.35,y-r*0.4,r*0.3,0,Math.PI*2);g.fill();
      const v=proj(0,-0.3,11.4);if(v[2]<it.c[2]){g.fillStyle='#1c1830';g.beginPath();g.ellipse(v[0],v[1],r*0.75*Math.abs(cr)+2,r*0.35,0,0,Math.PI*2);g.fill()}
      continue}
    g.fillStyle=it.col;g.strokeStyle=it.col;g.lineWidth=0.8;g.beginPath();it.P.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();g.stroke();
  }
  return c;
}
const KART_SPR=DRIVERS.map(d=>Array.from({length:NA},(_,i)=>outline(renderKart(d,i/NA*Math.PI*2))));

/* ---------- tracks ---------- */
const TRACK_DEFS=[
 {name:'MAPLE LOOP',theme:{wall:'#2c6a34',deco:['#1f5028','#3d8a3e','#245c2a'],grass:'#5fb84a',grass2:'#4fa23e',road:'#6c6a78',road2:'#63616e',curb:'#e8403a',sky:['#3a86e0','#cfeaff'],mtn:['#7c9ad0','#5a78b8'],cap:null,
   sun:{a:-0.7,y:22,r:7,col:'#fffbe8'},near:'trees',nearCol:['#2e6a3a','#3f8a46'],scen:'maple'},
  pts:[[300,800],[320,450],[520,280],[850,300],[1050,450],[1300,380],[1400,600],[1300,850],[1050,900],[1000,1100],[1200,1250],[1100,1380],[700,1350],[450,1250]],boosts:[0.3,0.72],boxes:[0.18,0.55,0.86]},
 {name:'DUNE RUN',theme:{wall:'#c28c4c',deco:['#a8723a','#d6a462','#8a5a30'],grass:'#e6c07a',grass2:'#dab26a',road:'#7a5e58',road2:'#705450',curb:'#3a7ae0',sky:['#d8644a','#ffe2a8'],mtn:['#c07048','#94503a'],cap:null,
   sun:{a:2.2,y:52,r:14,col:'#fff2c0'},near:'dunes',nearCol:['#d89a5a','#ecb878'],scen:'desert'},
  pts:[[250,1300],[250,700],[400,300],[700,250],[800,550],[650,800],[900,950],[1150,700],[1100,350],[1350,250],[1400,700],[1350,1150],[1000,1350],[600,1250]],boosts:[0.1,0.47,0.8],boxes:[0.25,0.6,0.92]},
 {name:'FROST RING',theme:{wall:'#dce8f4',deco:['#2a5a4a','#3e7a62','#b8c8dc'],grass:'#f2f7ff',grass2:'#e2ecf8',road:'#56688a',road2:'#4e6080',curb:'#3a8ae0',sky:['#6a96d4','#e8f0ff'],mtn:['#a8bce0','#7e96c4'],cap:'#ffffff',
   sun:{a:1.1,y:30,r:6,col:'#ffffff'},near:'pines',nearCol:['#2a5a4a','#f4f8ff'],scen:'snow'},
  pts:[[800,1400],[400,1350],[250,1050],[450,850],[300,600],[400,300],[750,250],[850,500],[700,700],[900,850],[1100,650],[1000,350],[1300,250],[1400,550],[1300,900],[1400,1200],[1150,1400]],boosts:[0.05,0.52],boxes:[0.2,0.45,0.7,0.9]}
];
function catmull(pts,n){const out=[],L=pts.length;
  for(let i=0;i<L;i++){const p0=pts[(i-1+L)%L],p1=pts[i],p2=pts[(i+1)%L],p3=pts[(i+2)%L];
    for(let s=0;s<n;s++){const t=s/n,t2=t*t,t3=t2*t;out.push([0,1].map(k=>0.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}
  return out}
function resample(poly,step){const out=[poly[0]];let acc=0;const L=poly.length;
  for(let i=0;i<L;i++){const a=poly[i],b=poly[(i+1)%L];let seg=Math.hypot(b[0]-a[0],b[1]-a[1]),pos=0;
    while(acc+seg-pos>=step){const need=step-acc;pos+=need;const t=pos/seg;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);acc=0}
    acc+=seg-pos}
  if(Math.hypot(out[out.length-1][0]-out[0][0],out[out.length-1][1]-out[0][1])<step*0.5)out.pop();return out}
function noisePattern(g,c1,c2,size=32,density=0.35){const c=mkCanvas(size,size),x=c.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,size,size);x.fillStyle=c2;
  for(let i=0;i<size*size*density/4;i++)x.fillRect(Math.random()*size|0,Math.random()*size|0,2,2);return g.createPattern(c,'repeat')}
const rngOf=seed=>()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296};
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]};
const mix=(a,b,f)=>{const A=hexRgb(a),B=hexRgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*f).toString(16).padStart(2,'0')).join('')};
// harden anti-aliased edges so everything keeps the chunky pixel look
function crisp(c){const g=c.getContext('2d'),im=g.getImageData(0,0,c.width,c.height),d=im.data;for(let i=3;i<d.length;i+=4)d[i]=d[i]>110?255:0;g.putImageData(im,0,0);return c}
// one-pixel dark rim around opaque pixels
function outline(c,col=[14,10,26,230]){const g=c.getContext('2d'),w=c.width,h=c.height,im=g.getImageData(0,0,w,h),d=im.data,src=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)src[i]=d[i*4+3]>0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(src[i])continue;
    if((x>0&&src[i-1])||(x<w-1&&src[i+1])||(y>0&&src[i-w])||(y<h-1&&src[i+w])){d.set(col,i*4)}}
  g.putImageData(im,0,0);return c}
function halve(src,n){const h=n>>1,out=new Uint32Array(h*h);
  for(let y=0;y<h;y++)for(let x=0;x<h;x++){const i=y*2*n+x*2,a=src[i],b=src[i+1],c=src[i+n],d=src[i+n+1];
    const r=((a&255)+(b&255)+(c&255)+(d&255))>>2,g=((a>>8&255)+(b>>8&255)+(c>>8&255)+(d>>8&255))>>2,bl=((a>>16&255)+(b>>16&255)+(c>>16&255)+(d>>16&255))>>2;
    out[y*h+x]=0xff000000|bl<<16|g<<8|r}
  return out}
// distance haze shared by ground rows and billboards
const fogAt=dz=>Math.pow(clamp((dz-160)/1100,0,1),0.7);
const FOG_LV=[0,0.3,0.55,0.8];

/* ---------- scenery sprites (drawn at 2px per world unit) ---------- */
const blob=(g,x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()};
const SCEN_ART={
  tree(g,R,pal){const w=48,h=64;g.fillStyle='#5a3a24';g.fillRect(21,38,6,26);g.fillStyle='#7a5234';g.fillRect(21,38,2,26);
    const lobes=[[24,22,15],[13,32,11],[35,32,11],[24,36,12],[17,16,9],[31,15,9]];
    for(const [x,y,r] of lobes)blob(g,x+1,y+2,r,pal[0]);for(const [x,y,r] of lobes)blob(g,x,y,r-1.5,pal[1]);
    for(const [x,y,r] of lobes)blob(g,x-r*0.3,y-r*0.35,r*0.45,pal[2]);
    for(let i=0;i<10;i++)g.fillStyle=pal[2],g.fillRect(6+R()*36|0,6+R()*36|0,2,2);return [w,h]},
  bush(g,R,pal){for(const [x,y,r] of [[10,14,8],[20,11,9],[29,15,7]])blob(g,x,y,r,pal[0]);for(const [x,y,r] of [[9,12,5],[19,9,6],[28,13,4]])blob(g,x,y,r,pal[1]);
    for(const [x,y,r] of [[7,9,2],[16,6,3]])blob(g,x,y,r,pal[2]);return [38,22]},
  cactus(g,R){const dk='#2f7a3e',md='#46a052',lt='#7ccf6e';const arm=(x,y,w,h)=>{g.fillStyle=dk;g.beginPath();g.roundRect(x,y,w,h,w/2);g.fill();g.fillStyle=md;g.beginPath();g.roundRect(x+1,y+1,w-3,h-2,w/2);g.fill();g.fillStyle=lt;g.fillRect(x+2,y+3,1,h-6)};
    arm(14,2,10,58);const l=10+R()*12|0,r=16+R()*12|0;arm(3,l,8,18);g.fillStyle=dk;g.fillRect(6,l+14,10,6);arm(27,r,8,16);g.fillStyle=dk;g.fillRect(22,r+12,10,6);
    g.fillStyle='#ff6a8a';g.fillRect(17,1,4,3);return [38,60]},
  rock(g,R,pal){g.fillStyle=pal[0];g.beginPath();g.moveTo(2,22);g.lineTo(6,8);g.lineTo(16,2);g.lineTo(28,6);g.lineTo(34,22);g.fill();
    g.fillStyle=pal[1];g.beginPath();g.moveTo(6,8);g.lineTo(16,2);g.lineTo(20,12);g.lineTo(9,16);g.fill();
    if(pal[2]){g.fillStyle=pal[2];g.beginPath();g.moveTo(9,6);g.lineTo(16,2);g.lineTo(26,5);g.lineTo(18,8);g.fill()}return [36,22]},
  pine(g,R){g.fillStyle='#4a3020';g.fillRect(14,52,6,12);
    for(let i=0;i<4;i++){const y=6+i*12,hw=7+i*4.5;g.fillStyle='#1e4a3c';g.beginPath();g.moveTo(17,y-6);g.lineTo(17-hw,y+12);g.lineTo(17+hw,y+12);g.fill();
      g.fillStyle='#2e6a52';g.beginPath();g.moveTo(17,y-6);g.lineTo(17-hw+3,y+10);g.lineTo(17,y+10);g.fill();
      g.fillStyle='#f4f8ff';g.beginPath();g.moveTo(17,y-6);g.lineTo(17-hw*0.55,y+3);g.lineTo(17-hw*0.2,y+1);g.lineTo(17,y+4);g.lineTo(17+hw*0.3,y+1);g.lineTo(17+hw*0.55,y+3);g.fill()}
    return [34,64]},
  snowman(g){blob(g,12,30,9,'#c8d6ec');blob(g,12,29,8,'#ffffff');blob(g,12,15,6,'#c8d6ec');blob(g,12,14,5.5,'#ffffff');
    g.fillStyle='#1c1830';g.fillRect(6,4,12,3);g.fillRect(8,-2,8,7);g.fillStyle='#e8403a';g.fillRect(7,19,10,2);g.fillStyle='#1c1830';g.fillRect(10,12,1,1);g.fillRect(13,12,1,1);
    g.fillStyle='#ff8a1c';g.fillRect(12,14,4,1);g.fillStyle='#1c1830';g.fillRect(11,25,2,2);g.fillRect(11,30,2,2);return [24,40]},
  sign(g,R,pal,dir){g.fillStyle='#d8d8e0';g.fillRect(4,18,2,14);g.fillRect(26,18,2,14);g.fillStyle='#1c1830';g.fillRect(0,0,32,20);g.fillStyle='#e8403a';g.fillRect(1,1,30,18);
    g.fillStyle='#fff';for(const cx of [7,16,25]){g.beginPath();if(dir>0){g.moveTo(cx-4,3);g.lineTo(cx+2,10);g.lineTo(cx-4,17);g.lineTo(cx-1,17);g.lineTo(cx+5,10);g.lineTo(cx-1,3)}
      else{g.moveTo(cx+4,3);g.lineTo(cx-2,10);g.lineTo(cx+4,17);g.lineTo(cx+1,17);g.lineTo(cx-5,10);g.lineTo(cx+1,3)}g.fill()}return [32,32]}
};
const SCEN_SETS={
  maple:[['tree',['#1f5a2a','#3d8a3e','#7cc860'],6],['tree',['#a8401c','#e8702a','#ffb050'],3],['tree',['#8a1c22','#d23a2a','#ff7a50'],2],['bush',['#1f5a2a','#3d8a3e','#7cc860'],4],['rock',['#6a6a78','#9a9aa8'],1]],
  desert:[['cactus',null,6],['rock',['#9a5a34','#d08a54','#e8a870'],4],['rock',['#7a4a30','#b07048'],2],['bush',['#8a7a3a','#b0a050','#d8c878'],3]],
  snow:[['pine',null,10],['rock',['#7a8aa8','#b0bcd4','#ffffff'],3],['snowman',null,1],['bush',['#a8bcd8','#e6eef8','#ffffff'],2]]
};
function makeSprite(kind,pal,seed,dir){const c=mkCanvas(48,64),g=c.getContext('2d');const [w,h]=SCEN_ART[kind](g,rngOf(seed),pal,dir);
  const t=mkCanvas(w+2,h+2);t.getContext('2d').drawImage(c,1,1);crisp(t);outline(t,[20,16,30,140]);return t}
// pre-tinted copies so distant billboards sink into the same haze as the ground
function fogged(c,haze){return FOG_LV.map(f=>{if(!f)return c;const t=mkCanvas(c.width,c.height),g=t.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=f;g.fillStyle=haze;g.fillRect(0,0,t.width,t.height);return t})}

/* ---------- backdrop: sky, clouds, layered ranges ---------- */
const PH=64;
function buildBackdrop(th,seed){
  const R=rngOf(seed),PW=Math.round(Math.PI*2*FOCAL),pan=mkCanvas(PW,PH),pg=pan.getContext('2d'),haze=th.sky[1];
  // a closed ridge: widths scaled so the strip wraps seamlessly
  const ridge=(col,lit,base,hMin,hVar,wMin,wVar,cap)=>{const ws=[];let tot=0;while(tot<PW){const w=wMin+R()*wVar;ws.push(w);tot+=w}const k=PW/tot;let x=0;
    for(const w0 of ws){const w=w0*k,px=x+w*(0.35+R()*0.3),top=PH-base-hMin-R()*hVar;
      for(const ox of [-PW,0,PW]){pg.fillStyle=col;pg.beginPath();pg.moveTo(ox+x-w*0.25,PH);pg.lineTo(ox+x,PH-base);pg.lineTo(ox+px-w*0.12,top+(PH-top)*0.22);pg.lineTo(ox+px,top);
        pg.lineTo(ox+px+w*0.16,top+(PH-top)*0.3);pg.lineTo(ox+x+w,PH-base);pg.lineTo(ox+x+w*1.25,PH);pg.fill();
        pg.fillStyle=lit;pg.beginPath();pg.moveTo(ox+px,top);pg.lineTo(ox+px-w*0.12,top+(PH-top)*0.22);pg.lineTo(ox+x,PH-base);pg.lineTo(ox+px-w*0.05,PH-base);pg.lineTo(ox+px+w*0.04,top+(PH-top)*0.45);pg.fill();
        if(cap){pg.fillStyle=cap;pg.beginPath();const ch=(PH-top)*0.28;pg.moveTo(ox+px,top);pg.lineTo(ox+px-w*0.12*ch/((PH-top)*0.22)*0.8,top+ch);pg.lineTo(ox+px-w*0.03,top+ch*0.7);pg.lineTo(ox+px+w*0.05,top+ch);pg.lineTo(ox+px+w*0.16*ch/((PH-top)*0.3),top+ch);pg.fill()}}
      x+=w}};
  ridge(mix(th.mtn[0],haze,0.45),mix(th.mtn[0],'#ffffff',0.5),6,26,22,50,60,th.cap?mix('#ffffff',haze,0.3):null);
  ridge(th.mtn[1],mix(th.mtn[1],'#ffffff',0.22),4,12,18,36,50,th.cap);
  // near band of theme silhouettes
  const [nc,nl]=th.nearCol;
  if(th.near==='dunes'){for(let layer=0;layer<2;layer++){pg.fillStyle=layer?nl:mix(nc,haze,0.35);pg.beginPath();pg.moveTo(0,PH);
    for(let x=0;x<=PW;x+=3)pg.lineTo(x,PH-(layer?5:9)-Math.sin(x/PW*Math.PI*2*(layer?7:5))*3-Math.sin(x/PW*Math.PI*2*(layer?13:11)+1)*2);pg.lineTo(PW,PH);pg.fill()}}
  else{pg.fillStyle=nc;pg.fillRect(0,PH-5,PW,5);let x=0;while(x<PW){const h=6+R()*9,w=4+R()*5;
    for(const ox of [-PW,0,PW]){if(th.near==='pines'){pg.fillStyle=nc;pg.beginPath();pg.moveTo(ox+x,PH-5-h);pg.lineTo(ox+x-w*0.7,PH-3);pg.lineTo(ox+x+w*0.7,PH-3);pg.fill();
        pg.fillStyle=nl;pg.beginPath();pg.moveTo(ox+x,PH-5-h);pg.lineTo(ox+x-w*0.3,PH-5-h*0.55);pg.lineTo(ox+x+w*0.3,PH-5-h*0.55);pg.fill()}
      else{blob(pg,ox+x,PH-4-h*0.6,w*0.9,nc);blob(pg,ox+x-w*0.25,PH-5-h*0.7,w*0.4,nl)}}
    x+=w*(th.near==='pines'?0.9:1.3)}}
  // haze where the ranges meet the horizon
  pg.globalCompositeOperation='source-atop';const hz=pg.createLinearGradient(0,PH-26,0,PH);hz.addColorStop(0,haze+'00');hz.addColorStop(1,haze+'d0');pg.fillStyle=hz;pg.fillRect(0,0,PW,PH);
  pg.globalCompositeOperation='source-over';crisp(pan);
  // clouds parallax at half speed, so the strip is half as wide
  const CWD=Math.round(PW/2),cl=mkCanvas(CWD,44),cg=cl.getContext('2d'),shadeC=mix('#ffffff',th.sky[0],0.2);
  for(let i=0;i<7;i++){const cx=(i+R()*0.6)*CWD/7,cy=10+R()*22,n=3+R()*3|0,sz=0.6+R()*0.6;
    for(const ox of [-CWD,0,CWD]){for(let j=0;j<n;j++)blob(cg,ox+cx+(j-n/2)*8*sz,cy+2-Math.abs(j-n/2+0.5)*-1,(6+R()*4)*sz,shadeC);
      for(let j=0;j<n;j++)blob(cg,ox+cx+(j-n/2)*8*sz,cy-Math.abs(j-n/2+0.5)*1.5,(5+(j%2)*3)*sz,'#ffffff');}}
  crisp(cl);
  const sky=mkCanvas(1,HOR),sg=sky.getContext('2d'),gr=sg.createLinearGradient(0,0,0,HOR);gr.addColorStop(0,th.sky[0]);gr.addColorStop(0.75,mix(th.sky[0],th.sky[1],0.7));gr.addColorStop(1,th.sky[1]);sg.fillStyle=gr;sg.fillRect(0,0,1,HOR);
  return {pan,PW,clouds:cl,CWD,sky}
}

const surf2=(cls,x,y)=>{const ix=x|0,iy=y|0;return ix<0||iy<0||ix>=S||iy>=S?0:cls[iy*S+ix]};
const trackCache={};
function buildTrack(i){
  if(trackCache[i])return trackCache[i];
  const def=TRACK_DEFS[i],th=def.theme;
  let pts=resample(catmull(def.pts,24),10);const N=pts.length;
  { // start on the straightest stretch so the grid launches down a straight
    const ang=pts.map((p,j)=>{const q=pts[(j+1)%N];return Math.atan2(q[1]-p[1],q[0]-p[0])});
    let bestJ=0,bestC=1e9;for(let j=0;j<N;j++){let c=0;for(let o=-14;o<12;o++)c+=Math.abs(wrapA(ang[(j+o+1+N)%N]-ang[(j+o+N)%N]));if(c<bestC){bestC=c;bestJ=j}}
    pts=pts.slice(bestJ).concat(pts.slice(0,bestJ));
  }
  const tan=pts.map((p,j)=>{const q=pts[(j+1)%N],o=pts[(j-1+N)%N],dx=q[0]-o[0],dy=q[1]-o[1],l=Math.hypot(dx,dy);return [dx/l,dy/l]});
  const c=mkCanvas(S,S),g=c.getContext('2d');
  g.fillStyle=noisePattern(g,th.wall,th.deco[2],32,0.2);g.fillRect(0,0,S,S);
  for(let k=0;k<1400;k++){const x=Math.random()*S,y=Math.random()*S,r=5+Math.random()*9;g.fillStyle=th.deco[k%2];g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.arc(x-r*0.3,y-r*0.3,r*0.4,0,Math.PI*2);g.fill()}
  const path=gg=>{gg.beginPath();pts.forEach((p,j)=>j?gg.lineTo(p[0],p[1]):gg.moveTo(p[0],p[1]));gg.closePath()};
  g.lineJoin='round';g.lineCap='round';
  g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=RW+2*GW+10;path(g);g.stroke();
  g.strokeStyle=noisePattern(g,th.grass,th.grass2,32,0.5);g.lineWidth=RW+2*GW;path(g);g.stroke();
  g.strokeStyle='#ffffff';g.lineWidth=RW+2*CW;path(g);g.stroke();
  g.setLineDash([12,12]);g.strokeStyle=th.curb;path(g);g.stroke();g.setLineDash([]);
  g.strokeStyle=noisePattern(g,th.road,th.road2,32,0.6);g.lineWidth=RW;path(g);g.stroke();
  g.setLineDash([14,20]);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=2;path(g);g.stroke();g.setLineDash([]);
  const k=mkCanvas(S,S),kg=k.getContext('2d');kg.fillStyle='#000';kg.fillRect(0,0,S,S);kg.lineJoin='round';kg.lineCap='round';
  kg.strokeStyle='rgb(100,0,0)';kg.lineWidth=RW+2*GW;path(kg);kg.stroke();kg.strokeStyle='rgb(200,0,0)';kg.lineWidth=RW+2*CW;path(kg);kg.stroke();
  const pad=(gg,j,fn)=>{const p=pts[j],t=tan[j];gg.save();gg.translate(p[0],p[1]);gg.rotate(Math.atan2(t[1],t[0]));fn(gg);gg.restore()};
  // start line
  pad(g,0,gg=>{for(let y=-RW/2;y<RW/2;y+=6)for(let x=0;x<3;x++){gg.fillStyle=((y/6|0)+x)%2?'#111':'#fff';gg.fillRect(-9+x*6,y,6,6)}});
  for(let r=0;r<3;r++)for(const s of [-1,1])pad(g,N-3-r*3,gg=>{gg.fillStyle='rgba(255,255,255,.6)';gg.fillRect(-2,s*20-8,2,16)});
  const boostIdx=def.boosts.map(f=>Math.floor(f*N));
  for(const j of boostIdx)for(const off of [-24,24]){
    pad(g,j,gg=>{gg.translate(0,off);gg.fillStyle='#ff8a1c';gg.fillRect(-16,-13,32,26);gg.fillStyle='#ffe05a';for(const cx of [-10,0,10]){gg.beginPath();gg.moveTo(cx-4,-9);gg.lineTo(cx+4,0);gg.lineTo(cx-4,9);gg.lineTo(cx-1,0);gg.fill()}});
    pad(kg,j,gg=>{gg.translate(0,off);gg.fillStyle='rgb(250,0,0)';gg.fillRect(-16,-13,32,26)});
  }
  const kd=kg.getImageData(0,0,S,S).data,cls=new Uint8Array(S*S);
  for(let q=0;q<S*S;q++){const v=kd[q*4];cls[q]=v>225?3:v>150?2:v>50?1:0}
  const tex=new Uint32Array(g.getImageData(0,0,S,S).data.buffer.slice(0));
  const one=mkCanvas(1,1),og=one.getContext('2d');og.fillStyle=th.wall;og.fillRect(0,0,1,1);const wall32=new Uint32Array(og.getImageData(0,0,1,1).data.buffer)[0];
  const mini=mkCanvas(72,72),mg=mini.getContext('2d');mg.scale(72/S,72/S);mg.lineJoin='round';mg.strokeStyle='rgba(0,0,0,.55)';mg.lineWidth=RW*2.6;path(mg);mg.stroke();mg.strokeStyle='#fff';mg.lineWidth=RW*1.2;path(mg);mg.stroke();
  const mips=[tex];for(let l=1;l<3;l++)mips.push(halve(mips[l-1],S>>(l-1)));
  // scenery billboards scattered beyond the grass, thicker near the road
  const R=rngOf(i*977+13),edge=RW/2+GW,haze=th.sky[1];
  const kinds=SCEN_SETS[th.scen].map(([k,pal,wt],n)=>({spr:fogged(makeSprite(k,pal,i*31+n),haze),wt}));
  const totW=kinds.reduce((s,k)=>s+k.wt,0),pick=()=>{let r=R()*totW;for(const k of kinds)if((r-=k.wt)<0)return k;return kinds[0]};
  const scen=[];
  for(let n=0;n<7000&&scen.length<460;n++){const x=R()*S,y=R()*S;let bd=1e12;for(const p of pts){const d=(p[0]-x)**2+(p[1]-y)**2;if(d<bd)bd=d}
    const d=Math.sqrt(bd)-edge;if(d<12||d>320||R()>Math.pow(1-d/320,1.6))continue;scen.push({x,y,spr:pick().spr})}
  // chevrons on the outside of the sharper bends
  const ang=pts.map((p,j)=>Math.atan2(tan[j][1],tan[j][0])),signs={};[-1,1].forEach(dr=>signs[dr]=fogged(makeSprite('sign',null,0,dr),haze));
  for(let j=0;j<N;j+=5){const cv=wrapA(ang[(j+6)%N]-ang[(j-6+N)%N]);if(Math.abs(cv)<0.5)continue;const dr=Math.sign(cv),t=tan[j],p=pts[j],o=edge+14;
    const x=p[0]+t[1]*dr*o,y=p[1]-t[0]*dr*o;if(surf2(cls,x,y)===0)scen.push({x,y,spr:signs[dr]})}
  return trackCache[i]={def,th,pts,tan,N,tex,mips,cls,wall32,mini,scen,...buildBackdrop(th,i*7+3),boxRows:def.boxes.map(f=>Math.floor(f*N))};
}

/* ---------- audio ---------- */
let AC=null,master=null,musicGain=null,muted=false,engine=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.22;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=0.35;musicGain.connect(master);
    const o=AC.createOscillator(),f=AC.createBiquadFilter(),gn=AC.createGain();o.type='sawtooth';o.frequency.value=60;f.type='lowpass';f.frequency.value=700;gn.gain.value=0;
    o.connect(f);f.connect(gn);gn.connect(master);o.start();engine={o,gn}}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f1,f2,dur,type='square',vol=0.5,delay=0,dest){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.03)}
const SFX={
  beep:()=>tone(440,440,0.18,'square',0.3),go:()=>tone(880,880,0.4,'square',0.3),
  box:()=>[0,1,2].forEach(i=>tone(600+i*200,700+i*200,0.06,'triangle',0.4,i*0.04)),
  roll:()=>tone(1200,1200,0.02,'square',0.08),got:()=>tone(900,1400,0.12,'square',0.2),
  boost:()=>tone(200,900,0.35,'sawtooth',0.18),bump:()=>tone(160,70,0.1,'triangle',0.6),
  spin:()=>[0,1,2,3].forEach(i=>tone(700-i*120,500-i*120,0.08,'square',0.2,i*0.07)),
  throw:()=>tone(500,1200,0.12,'square',0.2),drop:()=>tone(300,120,0.15,'triangle',0.5),
  lap:()=>[659,784,988].forEach((f,i)=>tone(f,f,0.1,'square',0.22,i*0.09)),
  finish:()=>[523,659,784,1047,988,1047].forEach((f,i)=>tone(f,f,0.14,'square',0.22,i*0.12)),
  hop:()=>tone(300,500,0.06,'square',0.12),pause:()=>tone(880,440,0.1,'square',0.2),menu:()=>tone(660,660,0.05,'square',0.18)
};
const SONG={mel:[76,0,79,81,83,0,81,79,76,0,74,76,79,0,0,0,76,0,79,81,83,86,88,86,83,0,81,0,79,0,0,0,72,0,76,79,81,0,79,76,74,0,71,74,76,0,0,0,72,74,76,79,81,79,76,74,76,0,0,0,0,0,0,0],
  bass:[52,52,48,48,50,50,47,47,52,52,48,48,50,50,52,52],step:0.14};
const mtof=m=>440*Math.pow(2,(m-69)/12);
let musicNext=0,musicStep=0;
setInterval(()=>{
  if(!AC||muted||paused||!(state==='race'||state==='countdown'&&cdT<60)){musicNext=0;return}
  if(musicNext<AC.currentTime)musicNext=AC.currentTime+0.05;
  while(musicNext<AC.currentTime+0.15){const n=SONG.mel[musicStep%SONG.mel.length],dl=musicNext-AC.currentTime;
    if(n)tone(mtof(n),mtof(n),SONG.step*0.85,'square',0.14,dl,musicGain);
    if(musicStep%2===0){const b=SONG.bass[Math.floor(musicStep/4)%SONG.bass.length]+(musicStep%4===2?12:0);tone(mtof(b),mtof(b),SONG.step*1.7,'triangle',0.45,dl,musicGain)}
    if(musicStep%4===0)tone(90,40,0.08,'sine',0.5,dl,musicGain);
    musicStep++;musicNext+=SONG.step}
},40);

/* ---------- input ---------- */
const inp={left:0,right:0,gas:0,brake:0,hop:0,item:0,hopP:0,itemP:0,sp:0,up:0,down:0,lp:0,rp:0,upP:0,downP:0};
let touchMode=false;
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',KeyX:'gas',ArrowDown:'brake',KeyS:'brake',
  Space:'hop',ShiftLeft:'hop',ShiftRight:'hop',KeyZ:'item',KeyE:'item',ControlLeft:'item'};
function press(k){if(!inp[k]){if(k==='hop')inp.hopP=1;if(k==='item')inp.itemP=1;if(k==='left')inp.lp=1;if(k==='right')inp.rp=1;if(k==='gas')inp.upP=1;if(k==='brake')inp.downP=1}inp[k]=1}
addEventListener('keydown',e=>{
  initAudio();touchMode=false;
  if(e.code==='Enter'||e.code==='KeyP'||e.code==='Escape'){e.preventDefault();if(!e.repeat)inp.sp=1;return}
  if(e.code==='KeyM'){muted=!muted;return}
  const k=KEYS[e.code];if(!k)return;e.preventDefault();if(e.repeat)return;press(k);
});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)inp[k]=0});
addEventListener('blur',()=>{for(const k of ['left','right','gas','brake','hop','item'])inp[k]=0;if(state==='race'&&!paused)paused=true});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();touchMode=true;try{b.setPointerCapture(e.pointerId)}catch(_){}
    if(paused){inp.sp=1;return}press(k)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{inp[k]=0}))});
cvs.addEventListener('pointerdown',e=>{initAudio();cvs.focus();if(e.pointerType!=='mouse')touchMode=true;
  if(state==='title'){const y=e.offsetY/cvs.clientHeight*H,x=e.offsetX/cvs.clientWidth*W;
    if(y>118&&y<138){menuRow=0;changeMenu(x<W/2?-1:1)}else if(y>=138&&y<158){menuRow=1;changeMenu(x<W/2?-1:1)}else inp.sp=1}
  else if(state==='results'||state==='standings'||paused)inp.sp=1});

/* ---------- game state ---------- */
let TR,karts=[],player,boxes=[],oils=[],orbs=[],sparks=[],state='title',paused=false,frameN=0;
let camX=0,camY=0,camA=0,cdT=0,raceT=0,finishT=0,msg='',msgT=0,wrongT=0,finishOrder=0;
let menuRow=0,menuDriver=0,menuCourse=0,gp=null,raceTrack=0,titleIdx=0,results=[];
const COURSES=['GRAND PRIX','MAPLE LOOP','DUNE RUN','FROST RING'];
const POINTS=[10,7,5,3,2,1];
let bestLap={};try{bestLap=JSON.parse(localStorage.getItem('turbotails-best')||'{}')}catch(e){}

function surf(x,y){const ix=x|0,iy=y|0;if(ix<0||iy<0||ix>=S||iy>=S)return 0;return TR.cls[iy*S+ix]}
function nearestIdx(x,y){let b=0,bd=1e12;TR.pts.forEach((p,i)=>{const d=(p[0]-x)**2+(p[1]-y)**2;if(d<bd){bd=d;b=i}});return b}
function changeMenu(d){SFX.menu();if(menuRow===0)menuDriver=(menuDriver+d+DRIVERS.length)%DRIVERS.length;else{menuCourse=(menuCourse+d+COURSES.length)%COURSES.length;TR=buildTrack(Math.max(0,menuCourse-1));titleIdx=0}}

function startRace(ti){
  raceTrack=ti;TR=buildTrack(ti);
  const order=[...DRIVERS.keys()].filter(i=>i!==menuDriver);
  const grid=[order[0],order[1],order[2],order[3],menuDriver,order[4]];
  karts=grid.map((di,slot)=>{
    const row=Math.floor(slot/2),side=slot%2?1:-1,j=(TR.N-3-row*3+TR.N)%TR.N,p=TR.pts[j],t=TR.tan[j];
    const x=p[0]+(-t[1])*side*20,y=p[1]+t[0]*side*20;
    return {d:di,x,y,a:Math.atan2(t[0],-t[1]),v:0,player:di===menuDriver,idx:j,lap:1,half:false,prog:0,finished:false,ftime:0,
      item:null,count:0,roll:0,spin:0,visSpin:0,boost:0,drift:0,charge:0,hopT:0,maxV:3,skill:di===menuDriver?1:0.9+slot*0.018,lane:(Math.random()-0.5)*40,stuck:0,lastLap:0,lapStart:0,best:0};
  });
  player=karts.find(k=>k.player);
  boxes=[];TR.boxRows.forEach(j=>{const p=TR.pts[j],t=TR.tan[j];for(const o of [-30,-10,10,30])boxes.push({x:p[0]-t[1]*o,y:p[1]+t[0]*o,alive:true,t:0})});
  oils=[];orbs=[];sparks=[];camA=player.a;camX=player.x-Math.sin(camA)*CAMD;camY=player.y+Math.cos(camA)*CAMD;
  state='countdown';cdT=240;raceT=0;finishT=0;finishOrder=0;msg='';msgT=0;wrongT=0;paused=false;musicStep=0;
}

/* ---------- kart physics ---------- */
function moveKart(k,dx,dy){
  const nx=k.x+dx,ny=k.y+dy;
  if(surf(nx,ny)!==0){k.x=nx;k.y=ny;return}
  if(surf(nx,k.y)!==0){k.x=nx;k.v*=0.9}else if(surf(k.x,ny)!==0){k.y=ny;k.v*=0.9}
  else{k.v=-k.v*0.35;if(k.player)SFX.bump()}
  if(Math.abs(k.v)>1.2&&k.drift){k.drift=0;k.charge=0}
}
function spinOut(k){if(k.spin>0)return;k.spin=55;k.v*=0.35;k.drift=0;k.charge=0;k.boost=0;if(k.player)SFX.spin()}
function driveKart(k,c){
  if(k.spin>0){k.spin--;k.v*=0.95;k.visSpin+=0.42;moveKart(k,Math.sin(k.a)*k.v,-Math.cos(k.a)*k.v);if(k.spin===0)k.visSpin=0;return}
  const s=surf(k.x,k.y);
  const max=k.boost>0?4.5:s===1?1.35:k.maxV;
  if(k.boost>0){k.boost--;k.v=Math.min(k.v+0.2,max)}
  else if(c.gas){if(k.v<max)k.v=Math.min(max,k.v+(k.v<1.2?0.06:0.042));else k.v=Math.max(max,k.v-0.09)}
  else if(c.brake){k.v=Math.max(-1.1,k.v-0.1)}
  else{k.v*=0.982;if(Math.abs(k.v)<0.03)k.v=0}
  if(s===1&&k.v>max)k.v=Math.max(max,k.v-0.12);
  if(s===3&&k.boost<30){k.boost=50;if(k.player)SFX.boost()}

function step(){
  frameN++;
  if(state==='title'){
    if(inp.upP||inp.downP){menuRow=1-menuRow;SFX.menu()}
    if(inp.lp)changeMenu(-1);if(inp.rp)changeMenu(1);
    if(inp.sp||inp.hopP){SFX.go();if(menuCourse===0){gp={race:0,pts:DRIVERS.map(()=>0)};startRace(0)}else{gp=null;startRace(menuCourse-1)}}
    titleIdx=(titleIdx+0.35)%TR.N;
  }else if(state==='results'){
    if(inp.sp||inp.hopP){if(gp&&gp.race<2){gp.race++;startRace(gp.race)}else if(gp){state='standings'}else state='title'}
  }else if(state==='standings'){if(inp.sp||inp.hopP){state='title';TR=buildTrack(Math.max(0,menuCourse-1))}}
  else{
    if(inp.sp&&state!=='countdown'){paused=!paused;SFX.pause()}
    if(!paused){
      if(state==='countdown'){cdT--;if(cdT===180||cdT===120||cdT===60)SFX.beep();if(cdT===0){SFX.go();state='race';msg='GO!';msgT=50}}
      updateRace();updateCamera();

    }
  }
  if(engine&&AC){const on=(state==='race'||state==='finish'||state==='countdown')&&!paused&&!muted;
    engine.gn.gain.setTargetAtTime(on?0.05:0,AC.currentTime,0.05);if(player)engine.o.frequency.setTargetAtTime(55+Math.abs(player.v)*38+(player.boost>0?30:0),AC.currentTime,0.05)}

}

    else if(t==='orb'){const r=Math.max(1.5,4.5*sc),y=p.sy-5*sc;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(p.sx,p.sy,r,r*0.3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,80,120,.3)';ctx.beginPath();ctx.arc(p.sx,y,r*1.6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c81e44';ctx.beginPath();ctx.arc(p.sx,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff3a5a';ctx.beginPath();ctx.arc(p.sx-r*0.15,y-r*0.15,r*0.8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffd0e0';ctx.beginPath();ctx.arc(p.sx-r*0.35,y-r*0.35,r*0.3,0,Math.PI*2);ctx.fill()}
    else if(t==='flame'){drawFlame(p.sx,p.sy-3*sc,sc*0.9)}
    else{
      const view=Math.atan2(o.x-cx,-(o.y-cy));let rel=wrapA(o.a-view+o.visSpin+(o.player?((inp.right?1:0)-(inp.left?1:0))*0.18+o.drift*0.3:o.drift*0.3));
      const idx=((Math.round(rel/(Math.PI*2)*NA)%NA)+NA)%NA,img=KART_SPR[o.d][idx],dw=64*sc/3;
      const hop=o.hopT>0?Math.sin(o.hopT/12*Math.PI)*4*sc:0;
      ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(p.sx,p.sy,9*sc,3*sc,0,0,Math.PI*2);ctx.fill();
      ctx.drawImage(img,Math.round(p.sx-dw/2),Math.round(p.sy-40*sc/3-hop),Math.round(dw),Math.round(dw));
      if(!o.player&&p.dz<420&&state!=='title'){txt(DRIVERS[o.d].name,p.sx,p.sy-40*sc/3-hop-9,'#fff','center',8,0.8)}
    }
  }
}
function txt(s,x,y,col='#fff',align='left',size=8,alpha=1){ctx.globalAlpha=alpha;ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);ctx.fillStyle=col;ctx.fillText(s,Math.round(x),Math.round(y));ctx.globalAlpha=1}
// chunky outline + drop shadow for headline text
function txtO(s,x,y,col,align='left',size=16,line='#1c1030',grad){ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';x=Math.round(x);y=Math.round(y);const o=size>=24?2:1;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(s,x+o+1,y+o+2);ctx.fillStyle=line;for(let dx=-o;dx<=o;dx++)for(let dy=-o;dy<=o+1;dy++)if(dx||dy)ctx.fillText(s,x+dx,y+dy);
  if(grad){const g=ctx.createLinearGradient(0,y,0,y+size);g.addColorStop(0,grad[0]);g.addColorStop(0.55,grad[1]);g.addColorStop(1,grad[2]);ctx.fillStyle=g}else ctx.fillStyle=col;ctx.fillText(s,x,y)}
function rpanel(x,y,w,h,fill='rgba(12,10,26,.72)',edge='rgba(255,255,255,.18)'){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,4);ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x+0.5,y+0.5,w-1,h-1,4);ctx.stroke()}
const fmt=t=>{const s=t/60;return Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0')};
const ORD=['1ST','2ND','3RD','4TH','5TH','6TH'];
function drawItemIcon(it,x,y,s){
  if(it==='nitro'||it==='triple'){const n=it==='triple'?3:1;for(let i=0;i<n;i++){const ox=x+(n>1?(i-1)*6:0);ctx.fillStyle='#3a8ae0';ctx.fillRect(ox-3,y-7,6,13);ctx.fillStyle='#bfe0ff';ctx.fillRect(ox-2,y-6,1,11);ctx.fillStyle='#ff7a2a';ctx.fillRect(ox-2,y+6,4,3);ctx.fillStyle='#ffe05a';ctx.fillRect(ox-1,y+7,2,3)}}
  else if(it==='oil'){ctx.fillStyle='#16121e';ctx.beginPath();ctx.moveTo(x,y-9);ctx.quadraticCurveTo(x+8,y+2,x,y+7);ctx.quadraticCurveTo(x-8,y+2,x,y-9);ctx.fill();ctx.fillStyle='#8a70ff';ctx.fillRect(x-3,y,2,3)}
  else if(it==='orb'){ctx.fillStyle='#ff3a5a';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd0e0';ctx.beginPath();ctx.arc(x-2,y-2,2.5,0,Math.PI*2);ctx.fill()}
}
const PLACE_GRAD=[['#fff6b0','#ffd84a','#e08a1c'],['#ffffff','#d8e0ec','#8a98b0'],['#ffd8a8','#e89a50','#a85a24']];
function drawHUD(){
  rpanel(4,4,62,26);txt('LAP',9,8,'#a59cc8');txt(Math.min(3,player.lap)+'/3',60,8,'#fff','right');txt(fmt(raceT),35,18,'#ffe05a','center');
  // item slot
  const rolling=player.roll>0,ix=W-40,iy=4;
  ctx.fillStyle=rolling?`hsl(${frameN*12%360},90%,60%)`:'#f4f4ff';ctx.beginPath();ctx.roundRect(ix,iy,34,30,5);ctx.fill();
  const ig=ctx.createLinearGradient(0,iy,0,iy+30);ig.addColorStop(0,'#3a3268');ig.addColorStop(1,'#16122c');ctx.fillStyle=ig;ctx.beginPath();ctx.roundRect(ix+2,iy+2,30,26,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(ix+4,iy+4,26,6);
  const it=rolling?['nitro','oil','orb','triple'][Math.floor(frameN/4)%4]:player.item;if(it)drawItemIcon(it,ix+17,iy+15,1);
  if(player.item==='triple'&&!rolling)txtO('x'+player.count,ix+33,iy+22,'#fff','right',8);
  const pl=placeOf(player),num=String(pl+1),suf=ORD[pl].slice(1),gr=PLACE_GRAD[Math.min(pl,3)]||['#ffffff','#c8c0e8','#7a70a8'];
  txtO(num,10,H-42,'#fff','left',32,'#1c1030',pl<3?gr:['#ffffff','#c8c0e8','#7a70a8']);
  ctx.font='32px '+FONT;const nw=ctx.measureText(num).width;txtO(suf,12+nw,H-26,'#fff','left',16,'#1c1030',pl<3?gr:['#ffffff','#c8c0e8','#7a70a8']);
  ctx.globalAlpha=0.9;ctx.drawImage(TR.mini,W-78,H-78);ctx.globalAlpha=1;
  for(const k of karts)if(!k.player){const x=W-78+k.x/S*72,y=H-78+k.y/S*72;ctx.fillStyle='#1c1030';ctx.fillRect(Math.round(x)-2,Math.round(y)-2,4,4);ctx.fillStyle=DRIVERS[k.d].kart;ctx.fillRect(Math.round(x)-1,Math.round(y)-1,2,2)}
  {const x=W-78+player.x/S*72,y=H-78+player.y/S*72,fx=Math.sin(player.a),fy=-Math.cos(player.a);ctx.fillStyle='#fff';ctx.strokeStyle='#1c1030';ctx.lineWidth=1;ctx.beginPath();
    ctx.moveTo(x+fx*4,y+fy*4);ctx.lineTo(x-fx*3-fy*3,y-fy*3+fx*3);ctx.lineTo(x-fx*3+fy*3,y-fy*3-fx*3);ctx.closePath();ctx.fill();ctx.stroke()}
  if(player.drift&&player.charge>100){const t=player.charge>220;txtO(t?'TURBO!':'BOOST',W/2,H-20,t?'#ffb03a':'#6ad0ff','center',8)}
  if(wrongT>60&&frameN%40<26)txtO('WRONG WAY',W/2,60,'#ff5a5a','center',16);
  if(msgT>0){const big=msg==='GO!'||msg==='FINISH!';
    txtO(msg,W/2,big?54:60,'#fff','center',big?32:16,'#1c1030',msg==='FINISH!'||msg==='GO!'?['#fff6b0','#ffd84a','#e07a1c']:msg==='FINAL LAP!'?['#ffd0d8','#ff6a7a','#b02a40']:null)}
}
function drawCountdown(){
  const n=Math.ceil(cdT/60)-1;if(cdT>180)return;
  rpanel(W/2-34,24,68,28,'#1c1830','#5a4e8e');ctx.fillStyle='#0c0a18';ctx.fillRect(W/2-2,10,4,14);
  for(let i=0;i<3;i++){const on=i<3-n,cx=W/2-20+i*20,col=n===0?'#6ee07a':'#ff4a4a';
    if(on){const g=ctx.createRadialGradient(cx,38,2,cx,38,14);g.addColorStop(0,col+'aa');g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.fillRect(cx-14,24,28,28)}
    ctx.fillStyle='#0c0a18';ctx.beginPath();ctx.arc(cx,38,8,0,Math.PI*2);ctx.fill();ctx.fillStyle=on?col:'#3a3450';ctx.beginPath();ctx.arc(cx,38,6.5,0,Math.PI*2);ctx.fill();
    if(on){ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(cx-3,34,2,2)}}
  if(n>0)txtO(String(n),W/2,60,'#fff','center',32,'#1c1030',['#ffffff','#ffe8a0','#f0a040']);
}
function panel(x,y,w,h){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(34,28,66,.92)');g.addColorStop(1,'rgba(12,10,26,.94)');
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(x+2,y+3,w,h,6);ctx.fill();ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fill();
  ctx.strokeStyle='#7a6ec0';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x+0.5,y+0.5,w-1,h-1,6);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x+4,y+2,w-8,1)}
function render(){
  ctx.imageSmoothingEnabled=false;
  if(state==='title'){
    const i=Math.floor(titleIdx),p=TR.pts[i],t=TR.tan[i],a=Math.atan2(t[0],-t[1]);
    boxes=[];oils=[];orbs=[];renderWorld(p[0]-t[0]*30,p[1]-t[1]*30,a,false);
    {const v=ctx.createLinearGradient(0,0,0,H);v.addColorStop(0,'rgba(12,10,26,.1)');v.addColorStop(0.5,'rgba(12,10,26,.3)');v.addColorStop(1,'rgba(12,10,26,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
    txtO('TURBO',W/2,18,'#ffe05a','center',24,'#1c1030',['#fff6b0','#ffd84a','#e8a020']);
    ctx.font='32px '+FONT;const tw=ctx.measureText('TAILS').width;let lx=W/2-tw/2;
    for(const ch of 'TAILS'){const cw=ctx.measureText(ch).width,y=46+Math.sin(frameN/9+lx/14)*2;txtO(ch,lx,y,'#f08a3a','left',32,'#1c1030',['#ffd0a0','#f08a3a','#b04a1c']);ctx.font='32px '+FONT;lx+=cw}
    panel(40,112,240,50);
    const rows=[['DRIVER',DRIVERS[menuDriver].name],['COURSE',COURSES[menuCourse]]];
    rows.forEach(([l,v],r)=>{const y=120+r*20,on=menuRow===r;txt(l,52,y,on?'#fff':'#8a82b0');txt((on?'◀ ':'  ')+v+(on?' ▶':''),196,y,on?'#ffe05a':'#c8c0e8','center')});
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(W/2,201,30,7,0,0,Math.PI*2);ctx.fill();ctx.drawImage(KART_SPR[menuDriver][Math.floor(frameN/6)%NA],W/2-32,160);
    if(frameN%60<40)txt(touchMode?'TAP HERE TO RACE':'PRESS ENTER TO RACE',W/2,222,'#fff','center');
    const bl=menuCourse>0&&bestLap[COURSES[menuCourse]];if(bl)txt('BEST LAP '+fmt(bl),W/2,100,'#c8c0e8','center');
    return}
  if(state==='standings'){
    const i=Math.floor(frameN*0.35)%TR.N,p=TR.pts[i],t=TR.tan[i];renderWorld(p[0]-t[0]*30,p[1]-t[1]*30,Math.atan2(t[0],-t[1]),false);
    panel(40,24,240,196);txtO('GRAND PRIX RESULTS',W/2,34,'#ffe05a','center',8);
    const order=DRIVERS.map((d,i)=>({i,pts:gp.pts[i]})).sort((a,b)=>b.pts-a.pts);
    order.forEach((r,j)=>{const y=58+j*20,me=r.i===menuDriver;if(me){ctx.fillStyle='rgba(240,138,58,.18)';ctx.fillRect(46,y-5,228,18)}txt(ORD[j],56,y,j===0?'#ffe05a':'#fff');ctx.drawImage(KART_SPR[r.i][3],92,y-18,32,32);txt(DRIVERS[r.i].name,130,y,me?'#f08a3a':'#fff');txt(r.pts+' PTS',260,y,'#c8c0e8','right')});
    const my=order.findIndex(r=>r.i===menuDriver);txt(my===0?'CHAMPION!':'Finished '+ORD[my],W/2,182,my===0?'#6ee07a':'#fff','center');
    if(frameN%60<40)txt('PRESS ENTER',W/2,202,'#a59cc8','center');return}
  renderWorld(camX,camY,camA,true);
  for(const s of sparks){if(s.puff){const f=s.t/s.max;ctx.globalAlpha=f*0.75;ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(Math.round(s.x),Math.round(s.y),s.r*(2-f),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
    else{ctx.fillStyle=s.col;ctx.fillRect(Math.round(s.x),Math.round(s.y),2,2)}}
  if(player.boost>0&&!paused&&state!=='results'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<12;i++){const a=((i*2.39996+frameN*0.37)%(Math.PI*2)),r0=95+((i*37+frameN*11)%40),cx=W/2,cy=HOR+20;
      ctx.moveTo(cx+Math.cos(a)*r0*1.4,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*(r0+30)*1.4,cy+Math.sin(a)*(r0+30))}ctx.stroke()}
  if(state==='results'){
    panel(36,20,248,200);txtO(TR.def.name+(gp?'  · RACE '+(gp.race+1)+'/3':''),W/2,30,'#ffe05a','center',8);
    results.forEach((r,j)=>{const y=52+j*22;if(r.player){ctx.fillStyle='rgba(240,138,58,.18)';ctx.fillRect(42,y-6,236,20)}else if(j%2){ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(42,y-6,236,20)}txt(ORD[j],50,y,j===0?'#ffe05a':'#fff');ctx.drawImage(KART_SPR[r.d][3],84,y-18,32,32);
      txt(DRIVERS[r.d].name,122,y,r.player?'#f08a3a':'#fff');txt(r.time?fmt(r.time):'--',228,y,'#c8c0e8','right');if(gp)txt('+'+r.pts,272,y,'#6ee07a','right')});
    txt('BEST LAP '+fmt(player.best||0),W/2,186,'#c8c0e8','center');
    if(frameN%60<40)txt(gp&&gp.race<2?'PRESS ENTER FOR NEXT RACE':'PRESS ENTER',W/2,202,'#fff','center');
    return}
  drawHUD();
  if(state==='countdown')drawCountdown();
  if(paused){ctx.fillStyle='rgba(12,10,26,.7)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,96,'#fff','center',16);txt('ENTER TO RESUME   M MUSIC '+(muted?'OFF':'ON'),W/2,122,'#a59cc8','center')}
}

/* ---------- boot ---------- */
TR=buildTrack(0);
let acc=0,last=performance.now();
function frame(t){acc+=Math.min(t-last,100);last=t;while(acc>=1000/60){step();acc-=1000/60}render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load)document.fonts.load('8px Silkscreen').catch(()=>{});
cvs.focus();
})();
